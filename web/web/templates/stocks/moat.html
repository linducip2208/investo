<!DOCTYPE html>
<html lang="id" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[.Title]]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        *{scrollbar-width:thin;scrollbar-color:#334155 #0b1120}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0b1120}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid rgba(51,65,85,.5);border-radius:14px;transition:all .2s}
        .card:hover{border-color:#475569}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:500;transition:all .15s;text-decoration:none}
        .sidebar-link:hover{background:#1e293b;color:#e2e8f0}
        .sidebar-link.active{background:#1e3a8a;color:#93c5fd;font-weight:600}
        .star-filled{color:#fbbf24}
        .star-empty{color:#334155}
        .moat-wide{background:linear-gradient(135deg,#064e3b,#065f46);border-color:#059669}
        .moat-narrow{background:linear-gradient(135deg,#451a03,#78350f);border-color:#f59e0b}
        .moat-none{background:linear-gradient(135deg,#450a0a,#7f1d1d);border-color:#dc2626}
        @media(max-width:1024px){.sidebar{display:none}.sidebar.open{display:flex}}
    </style>
</head>
<body class="h-full flex" x-data="moatAnalysis()" x-init="init()">

<script>
function moatAnalysis() {
    return {
        sidebarOpen: false,
        chart: null,
        result: null,
        loading: true,
        code: '[[.Code]]',
        init() { this.fetchData(); },
        async fetchData() {
            try {
                var resp = await fetch('/api/stocks/' + this.code + '/moat');
                var data = await resp.json();
                this.result = data;
                this.loading = false;
                this.$nextTick(() => this.renderChart());
            } catch(e) { this.loading = false; }
        },
        renderChart() {
            if (this.chart) this.chart.destroy();
            var ctx = document.getElementById('moatRadar');
            if (!ctx || !this.result || !this.result.dimensions) return;
            this.chart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: this.result.dimensions.map(d => d.name),
                    datasets: [{
                        label: 'Moat Strength',
                        data: this.result.dimensions.map(d => d.stars),
                        backgroundColor: 'rgba(59,130,246,0.2)',
                        borderColor: '#3b82f6',
                        borderWidth: 2,
                        pointBackgroundColor: '#3b82f6',
                        pointBorderColor: '#1e40af',
                        pointRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { r: { beginAtZero: true, max: 5, ticks: { stepSize: 1, color: '#64748b', backdropColor: 'transparent' }, grid: { color: 'rgba(51,65,85,0.5)' }, pointLabels: { color: '#e2e8f0', font: { size: 11, family: 'Inter', weight: '600' } } } },
                    plugins: { legend: { display: false } }
                }
            });
        },
        starDisplay(stars) {
            var html = '';
            for (var i = 1; i <= 5; i++) {
                html += i <= stars ? '\u2605' : '\u2606';
            }
            return html;
        },
        moatClass(w) {
            if (w === 'Wide Moat') return 'moat-wide';
            if (w === 'Narrow Moat') return 'moat-narrow';
            return 'moat-none';
        }
    }
}
</script>

<!-- SIDEBAR -->
<aside class="sidebar fixed inset-y-0 left-0 z-50 w-60 bg-[#0b1120] border-r border-slate-800 flex flex-col" class="max-md:hidden">
    <div class="flex items-center gap-3 px-5 h-16 border-b border-slate-800">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center font-bold text-white text-sm">I</div>
        <span class="font-bold text-lg text-white">Investo</span>
    </div>
    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
        <a href="/dashboard" class="sidebar-link"><span>&#x1F4CA;</span> Dashboard</a>
        <a href="/saham" class="sidebar-link"><span>&#x1F4C8;</span> Saham IDX</a>
        <a href="/saham/[[.Code]]" class="sidebar-link"><span>&#x1F50D;</span> Detail [[.Code]]</a>
        <a href="/saham/[[.Code]]/fundamental" class="sidebar-link"><span>&#x1F4CA;</span> Fundamental</a>
        <a href="/saham/[[.Code]]/teknikal" class="sidebar-link"><span>&#x1F4C8;</span> Teknikal</a>
        <a href="/saham/[[.Code]]/moat" class="sidebar-link active"><span>&#x1F6E1;</span> Moat Analysis</a>
    </nav>
</aside>

<!-- MAIN -->
<div class="flex-1 lg:ml-60 min-h-screen flex flex-col">
    <header class="sticky top-0 z-40 h-16 bg-[#0b1120]/90 backdrop-blur-xl border-b border-slate-800 flex items-center px-4 lg:px-8 gap-4">
        <button onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');document.getElementById('sb-overlay').classList.toggle('hidden')" class="lg:hidden p-2 text-slate-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="flex-1 max-w-md hidden sm:block">
            <input type="text" placeholder="Cari saham, forex, atau halaman..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" onkeydown="if(event.key==='Enter'){var q=this.value.trim();if(q.length>1)location.href='/saham?search='+encodeURIComponent(q)}">
        </div>
        <div class="flex items-center gap-2 ml-auto">
            [[if .User]]
            <div class="flex items-center gap-2.5 pl-2 border-l border-slate-700">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center text-white text-xs font-bold">[[slice .User.Name 0 1]]</div>
                <span class="text-sm font-medium text-white hidden sm:block">[[.User.Name]]</span>
            </div>
            [[else]]
            <a href="/login" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl transition-colors">Masuk</a>
            [[end]]
        </div>
    </header>

    <main class="flex-1 p-4 lg:p-6 space-y-5 overflow-y-auto">
        <div>
            <h1 class="text-xl lg:text-2xl font-bold text-white">Moat Analysis: <span x-text="code"></span></h1>
            <p class="text-sm text-slate-400 mt-0.5">Economic moat assessment across 5 dimensions. How strong is the competitive advantage?</p>
        </div>

        <template x-if="loading">
            <div class="space-y-4">
                <div class="card p-6 animate-pulse"><div class="h-64 bg-slate-700/30 rounded-lg"></div></div>
            </div>
        </template>

        <template x-if="!loading && result">
            <div class="space-y-4">
                <div class="card p-6 text-center" :class="moatClass(result.moat_width)">
                    <h3 class="text-sm text-slate-400 mb-1">Moat Width</h3>
                    <p class="text-3xl font-extrabold text-white" x-text="result.moat_width"></p>
                    <p class="text-sm text-slate-400 mt-1"><span class="font-mono text-white" x-text="result.total_stars.toFixed(1)"></span> / 25 stars</p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
                    <div class="lg:col-span-2">
                        <div class="card p-5">
                            <h3 class="text-sm font-semibold text-slate-300 mb-4">Moat Radar</h3>
                            <div style="height:350px"><canvas id="moatRadar"></canvas></div>
                        </div>
                    </div>
                    <div class="lg:col-span-3">
                        <div class="card p-5 space-y-3">
                            <h3 class="text-sm font-semibold text-slate-300 mb-3">Dimension Breakdown</h3>
                            <template x-for="dim in result.dimensions" :key="dim.name">
                                <div class="bg-slate-800/50 rounded-xl p-3">
                                    <div class="flex items-center justify-between mb-1">
                                        <span class="text-sm font-semibold text-slate-200" x-text="dim.name"></span>
                                        <span class="font-mono text-sm" :class="{'text-amber-400': dim.stars >= 4, 'text-slate-400': dim.stars < 4}">
                                            <span x-show="dim.stars >= 1">&#x2605;</span>
                                            <span x-show="dim.stars >= 2">&#x2605;</span>
                                            <span x-show="dim.stars >= 3">&#x2605;</span>
                                            <span x-show="dim.stars >= 4">&#x2605;</span>
                                            <span x-show="dim.stars >= 5">&#x2605;</span>
                                            <span x-show="dim.stars < 1">&#x2606;&#x2606;&#x2606;&#x2606;&#x2606;</span>
                                            <span x-show="dim.stars >= 1 && dim.stars < 2">&#x2606;&#x2606;&#x2606;&#x2606;</span>
                                            <span x-show="dim.stars >= 2 && dim.stars < 3">&#x2606;&#x2606;&#x2606;</span>
                                            <span x-show="dim.stars >= 3 && dim.stars < 4">&#x2606;&#x2606;</span>
                                            <span x-show="dim.stars >= 4 && dim.stars < 5">&#x2606;</span>
                                            <span class="ml-1 text-xs" x-text="dim.stars + '/5'"></span>
                                        </span>
                                    </div>
                                    <p class="text-xs text-slate-500 leading-relaxed" x-text="dim.description"></p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="card p-6">
                    <h3 class="text-sm font-semibold text-slate-300 mb-3">Moat Narrative</h3>
                    <p class="text-sm text-slate-400 leading-relaxed" x-text="result.narrative"></p>
                </div>
            </div>
        </template>
    </main>
</div>
<div id="sb-overlay" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm hidden" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div></body>
</html>
