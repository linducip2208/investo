<!-- Ticker Bar Component — include on dashboard, stocks, forex pages -->
<div x-data="tickerBar()" x-init="fetchTicker(); setInterval(() => fetchTicker(), 30000)"
     class="bg-slate-900 text-white overflow-hidden border-b border-slate-700">
    <div class="relative flex items-center h-9">
        <div class="shrink-0 bg-blue-600 px-3 h-full flex items-center gap-1.5 z-10">
            <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
            <span class="text-xs font-bold tracking-wide">IDX LIVE</span>
        </div>
        <div class="flex-1 overflow-hidden">
            <div class="ticker-track flex items-center h-full" x-ref="track">
                <template x-for="(item, idx) in items" :key="idx">
                    <div class="ticker-item flex items-center gap-2 shrink-0 px-5 border-r border-slate-700/50">
                        <span class="text-xs font-bold tracking-tight" x-text="item.code">BBCA</span>
                        <span class="text-xs font-mono text-slate-300" x-text="'Rp ' + item.price.toLocaleString('id-ID')">9,875</span>
                        <span class="text-xs font-mono font-semibold" :class="item.change_percent >= 0 ? 'text-emerald-400' : 'text-red-400'"
                              x-text="(item.change_percent >= 0 ? '+' : '') + item.change_percent.toFixed(2) + '%'">+2.3%</span>
                    </div>
                </template>
                <template x-for="(item, idx) in items" :key="'dup-'+idx">
                    <div class="ticker-item flex items-center gap-2 shrink-0 px-5 border-r border-slate-700/50">
                        <span class="text-xs font-bold tracking-tight" x-text="item.code">BBCA</span>
                        <span class="text-xs font-mono text-slate-300" x-text="'Rp ' + item.price.toLocaleString('id-ID')">9,875</span>
                        <span class="text-xs font-mono font-semibold" :class="item.change_percent >= 0 ? 'text-emerald-400' : 'text-red-400'"
                              x-text="(item.change_percent >= 0 ? '+' : '') + item.change_percent.toFixed(2) + '%'">+2.3%</span>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>

<style>
.ticker-track {
    display: flex;
    width: max-content;
    animation: ticker-scroll 60s linear infinite;
}
.ticker-track:hover {
    animation-play-state: paused;
}
@keyframes ticker-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}
</style>

<script>
function tickerBar() {
    return {
        items: [],
        async fetchTicker() {
            try {
                const res = await fetch('/api/market/summary');
                const data = await res.json();
                this.items = (data.ticker || []).slice(0, 10);
            } catch(e) { console.error('Ticker fetch error:', e) }
        }
    }
}
</script>
