<!DOCTYPE html>
<html lang="id" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[.Title]]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        *{scrollbar-width:thin;scrollbar-color:#334155 #0b1120}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0b1120}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid rgba(51,65,85,.5);border-radius:14px;transition:all .2s}
        .card:hover{border-color:#475569}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:500;transition:all .15s;text-decoration:none}
        .sidebar-link:hover{background:#1e293b;color:#e2e8f0}
        .sidebar-link.active{background:#1e3a8a;color:#93c5fd;font-weight:600}
        .sidebar-link .icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:16px}
        .text-success{color:#34d399}.text-danger{color:#f87171}.text-warning{color:#fbbf24}
        @media(max-width:1024px){.sidebar{display:none}.sidebar.open{display:flex}}
        @media(max-width:640px){.card{padding:12px!important}}
    </style>
</head>
<body class="h-full flex" x-data="industryLifecycle()" x-init="fetch()">
    <script>
        function industryLifecycle() {
            return {
                sidebarOpen: false,
                stages: [],
                loaded: false,
                async fetch() {
                    try {
                        const resp = await fetch('/api/market/industry-lifecycle');
                        const data = await resp.json();
                        this.stages = data.stages || [];
                        this.loaded = true;
                    } catch(e) { this.loaded = true; }
                },
                stageBadge(stage) {
                    if (stage === 'Growth') return 'bg-green-500/20 text-green-400 border border-green-500/30';
                    if (stage === 'Mature') return 'bg-blue-500/20 text-blue-400 border border-blue-500/30';
                    if (stage === 'Decline') return 'bg-red-500/20 text-red-400 border border-red-500/30';
                    return 'bg-slate-500/20 text-slate-400 border border-slate-500/30';
                },
                stageIcon(stage) {
                    if (stage === 'Growth') return '🌱';
                    if (stage === 'Mature') return '🌳';
                    if (stage === 'Decline') return '🍂';
                    return '📊';
                }
            }
        }
    </script>

    <aside class="sidebar fixed inset-y-0 left-0 z-50 w-60 bg-[#0b1120] border-r border-slate-800 flex flex-col" class="max-md:hidden">
        <div class="flex items-center gap-3 px-5 h-16 border-b border-slate-800">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center font-bold text-white text-sm">I</div>
            <span class="font-bold text-lg text-white">Investo</span>
        </div>
        <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
            <a href="/dashboard" class="sidebar-link"><span class="icon">📊</span> Dashboard</a>
            <a href="/saham" class="sidebar-link"><span class="icon">📈</span> Saham IDX</a>
            <div class="border-t border-slate-800 my-2"></div>
            <p class="px-4 text-[10px] font-semibold text-slate-600 uppercase tracking-widest mb-1">Quantitative Research</p>
            <a href="/market/factor-exposure" class="sidebar-link"><span class="icon">📐</span> Factor Exposure</a>
            <a href="/market/factor-timing" class="sidebar-link"><span class="icon">⏱️</span> Factor Timing</a>
            <a href="/market/smart-beta" class="sidebar-link"><span class="icon">🧬</span> Smart Beta</a>
            <div class="border-t border-slate-800 my-2"></div>
            <p class="px-4 text-[10px] font-semibold text-slate-600 uppercase tracking-widest mb-1">Supply Chain</p>
            <a href="/market/supply-chain" class="sidebar-link"><span class="icon">🔗</span> Supply Chain</a>
            <a href="/market/industry-lifecycle" class="sidebar-link active"><span class="icon">🌱</span> Industry Lifecycle</a>
            <a href="/market/competitive" class="sidebar-link"><span class="icon">🏆</span> Competitive</a>
            <div class="border-t border-slate-800 my-2"></div>
            <a href="/dashboard/portfolios" class="sidebar-link"><span class="icon">💼</span> Portofolio</a>
        </nav>
        <div class="p-3 border-t border-slate-800">
            <a href="/pengaturan" class="sidebar-link"><span class="icon">⚙️</span> Pengaturan</a>
        </div>
    </aside>

    <header class="fixed top-0 right-0 left-0 lg:left-60 h-16 bg-[#0b1120]/90 backdrop-blur-md border-b border-slate-800 z-40 flex items-center justify-between px-6">
        <button onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');document.getElementById('sb-overlay').classList.toggle('hidden')" class="lg:hidden p-2 text-slate-400 hover:text-white transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="text-sm text-slate-400"><span class="text-slate-600">Supply Chain /</span> Industry Lifecycle</div>
        <div class="flex items-center gap-3">
            <button @click="fetch()" class="p-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition-colors" title="Refresh">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
            [[if .User]]
            <a href="/profil" class="flex items-center gap-2 text-sm text-slate-300 hover:text-white transition-colors">
                <span class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-xs font-bold text-white">[[slice .User.Name 0 1]]</span>
            </a>
            [[end]]
        </div>
    </header>

    <main class="flex-1 ml-0 lg:ml-60 mt-16 p-6">
        <template x-if="!loaded">
            <div class="card p-8 flex flex-col items-center justify-center space-y-4">
                <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-slate-400">Analyzing industry lifecycles...</p>
            </div>
        </template>

        <template x-if="loaded">
            <div class="space-y-6">
                <div>
                    <h1 class="text-2xl font-bold text-white">Industry Lifecycle Analyzer</h1>
                    <p class="text-slate-400 text-sm mt-1">Classify sectors by lifecycle stage: Growth, Mature, or Decline</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                    <template x-for="s in stages" :key="s.sector">
                        <div class="card p-5">
                            <div class="flex items-center justify-between mb-4">
                                <div class="flex items-center gap-2">
                                    <span class="text-xl" x-text="stageIcon(s.stage)"></span>
                                    <span class="font-bold text-white" x-text="s.sector"></span>
                                </div>
                                <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold" :class="stageBadge(s.stage)" x-text="s.stage"></span>
                            </div>
                            <p class="text-xs text-slate-400 mb-4" x-text="s.description"></p>
                            <div class="space-y-3">
                                <div>
                                    <div class="flex justify-between text-[11px] text-slate-500 mb-1">
                                        <span>Revenue Growth</span>
                                        <span class="font-mono" x-text="s.revenue_growth.toFixed(1) + '%'"></span>
                                    </div>
                                    <div class="h-1.5 bg-slate-700 rounded-full overflow-hidden">
                                        <div class="h-full rounded-full bg-green-500" :style="{ width: Math.min(100, Math.max(0, s.revenue_growth * 2)) + '%' }"></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-[11px] text-slate-500 mb-1">
                                        <span>Innovation Index</span>
                                        <span class="font-mono" x-text="s.innovation_index.toFixed(1)"></span>
                                    </div>
                                    <div class="h-1.5 bg-slate-700 rounded-full overflow-hidden">
                                        <div class="h-full rounded-full bg-purple-500" :style="{ width: s.innovation_index + '%' }"></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-[11px] text-slate-500 mb-1">
                                        <span>Competition Level</span>
                                        <span class="font-mono" x-text="s.competition_level.toFixed(1)"></span>
                                    </div>
                                    <div class="h-1.5 bg-slate-700 rounded-full overflow-hidden">
                                        <div class="h-full rounded-full bg-yellow-500" :style="{ width: s.competition_level + '%' }"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <template x-if="stages.length === 0">
                    <div class="card p-12 text-center text-slate-500">No lifecycle data available.</div>
                </template>

                <div class="card p-6">
                    <h2 class="text-lg font-bold text-white mb-3">Lifecycle Stages Explained</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                        <div class="space-y-2">
                            <div class="font-semibold text-green-400">Growth Stage</div>
                            <p class="text-slate-400">High revenue growth, many new entrants, expanding market. High innovation index.</p>
                        </div>
                        <div class="space-y-2">
                            <div class="font-semibold text-blue-400">Mature Stage</div>
                            <p class="text-slate-400">Stable growth, consolidated market, moderate competition. Known players dominate.</p>
                        </div>
                        <div class="space-y-2">
                            <div class="font-semibold text-red-400">Decline Stage</div>
                            <p class="text-slate-400">Negative growth, shrinking market. Companies exiting or consolidating.</p>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <div x-show="sidebarOpen" onclick="document.getElementById('sidebar').classList.add('max-md:hidden');document.getElementById('sb-overlay').classList.add('hidden')" class="lg:hidden fixed inset-0 bg-black/50 z-30 backdrop-blur-sm"></div>
<div id="sb-overlay" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm hidden" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div></body>
</html>
