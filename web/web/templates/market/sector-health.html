<!DOCTYPE html>
<html lang="id" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sector Health Index · Investo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif'],mono:['JetBrains Mono','Consolas','monospace']},colors:{brand:{500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'}}}}}</script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        *{scrollbar-width:thin;scrollbar-color:#334155 #0b1120}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0b1120}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid rgba(51,65,85,.5);border-radius:14px;transition:all .2s}
        .card:hover{border-color:#475569}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:500;transition:all .15s;text-decoration:none}
        .sidebar-link:hover{background:#1e293b;color:#e2e8f0}
        .sidebar-link.active{background:#1e3a8a;color:#93c5fd;font-weight:600}
        .text-success{color:#34d399}.text-danger{color:#f87171}.text-warning{color:#f59e0b}
        @media(max-width:1024px){.sidebar{display:none}.sidebar.open{display:flex}}
        @media(max-width:640px){.card{padding:12px!important}.stat-value{font-size:20px!important}}
    </style>
</head>
<body class="h-full flex" x-data="sectorHealth()" x-init="init()">
    <script>
    function sectorHealth() {
        return {
            sidebarOpen: false, sectors: [], loading: true,
            async init() { await this.fetch(); },
            async fetch() { this.loading = true; try { var r = await fetch('/api/market/sector-health'); var d = await r.json(); this.sectors = d.sectors || []; } catch(e) {} this.loading = false; },
            gaugeColor(s) { if (s >= 70) return '#34d399'; if (s >= 40) return '#f59e0b'; return '#f87171'; },
            gaugeBg(s) { if (s >= 70) return '#064e3b'; if (s >= 40) return '#78350f'; return '#7f1d1d'; },
            fmt(v) { return v ? 'Rp ' + Math.round(v).toLocaleString('id-ID') : '-'; }
        }
    }
    </script>

    <!-- SIDEBAR -->
    <aside class="sidebar fixed inset-y-0 left-0 z-50 w-60 bg-[#0b1120] border-r border-slate-800 flex flex-col" class="max-md:hidden">
        <div class="flex items-center gap-3 px-5 h-16 border-b border-slate-800">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center font-bold text-white text-sm">I</div>
            <span class="font-bold text-lg text-white">Investo</span>
        </div>
        <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
            <a href="/dashboard" class="sidebar-link"><span>📊</span> Dashboard</a>
            <a href="/saham" class="sidebar-link"><span>📈</span> Saham IDX</a>
            <a href="/forex" class="sidebar-link"><span>💱</span> Forex</a>
            <a href="/screener" class="sidebar-link"><span>🔍</span> Screener</a>
            <a href="/market/heatmap" class="sidebar-link"><span>🗺️</span> Heatmap</a>
            <a href="/market/recap" class="sidebar-link"><span>📋</span> Market Recap</a>
            <a href="/market/sector-health" class="sidebar-link active"><span>💚</span> Sector Health</a>
            <a href="/market/waran" class="sidebar-link"><span>🎫</span> Waran Tracker</a>
            <a href="/market/economic-calendar" class="sidebar-link"><span>📅</span> Economic Calendar</a>
            <a href="/calculators" class="sidebar-link"><span>🧮</span> Kalkulator</a>
            <div class="border-t border-slate-800 my-2"></div>
            <a href="/ideas" class="sidebar-link"><span>💡</span> Ideas</a>
            <a href="/leaderboard" class="sidebar-link"><span>🏆</span> Leaderboard</a>
            <a href="/blog" class="sidebar-link"><span>📝</span> Blog</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <div class="flex-1 lg:ml-60 min-h-screen flex flex-col">
        <!-- TOPBAR -->
        <header class="sticky top-0 z-40 h-16 bg-[#0b1120]/90 backdrop-blur-xl border-b border-slate-800 flex items-center px-4 lg:px-8 gap-4">
            <button onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');document.getElementById('sb-overlay').classList.toggle('hidden')" class="lg:hidden p-2 text-slate-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
            <div class="flex-1">
                <h1 class="text-lg font-bold text-white">Sector Health Index</h1>
            </div>
            [[template "components/market-clock.html" .]]
        </header>

        <main class="flex-1 p-4 lg:p-6 overflow-y-auto">
            <div x-show="loading" class="text-center py-12 text-slate-500">Memuat data sektor...</div>
            <div x-show="!loading" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="(sec, idx) in sectors" :key="idx">
                    <div class="card p-5">
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <a :href="'/best-saham-' + sec.sector_slug" class="text-base font-bold text-white hover:text-blue-400 transition-colors" x-text="sec.sector_name"></a>
                                <div class="text-xs text-slate-500 mt-0.5" x-text="sec.stock_count + ' saham'"></div>
                            </div>
                            <div class="text-right">
                                <div class="text-3xl font-bold font-mono" :style="'color:'+gaugeColor(sec.health_score)" x-text="sec.health_score"></div>
                                <div class="text-[10px] uppercase font-semibold" :class="{'text-success': sec.health_score>=70, 'text-warning': sec.health_score>=40 && sec.health_score<70, 'text-danger': sec.health_score<40}">/100</div>
                            </div>
                        </div>
                        <div class="w-full bg-slate-700/50 rounded-full h-2.5 mb-4">
                            <div class="h-2.5 rounded-full transition-all duration-700" :style="'width:'+sec.health_score+'%;background:'+gaugeColor(sec.health_score)"></div>
                        </div>
                        <div class="grid grid-cols-3 gap-3 text-center">
                            <div>
                                <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">PER Avg</div>
                                <div class="text-sm font-mono text-white" x-text="sec.per_avg + 'x'"></div>
                            </div>
                            <div>
                                <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">PBV Avg</div>
                                <div class="text-sm font-mono text-white" x-text="sec.pbv_avg + 'x'"></div>
                            </div>
                            <div>
                                <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">ROE Avg</div>
                                <div class="text-sm font-mono text-white" x-text="sec.roe_avg + '%'"></div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-slate-700/50 text-center">
                            <div>
                                <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-0.5">Momentum</div>
                                <div class="text-xs font-mono" :class="sec.momentum_score>=50?'text-success':'text-warning'" x-text="sec.momentum_score"></div>
                            </div>
                            <div>
                                <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-0.5">Foreign Flow</div>
                                <div class="text-xs font-mono" :class="sec.foreign_flow_score>=50?'text-success':'text-warning'" x-text="sec.foreign_flow_score"></div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
            <div x-show="!loading && sectors.length === 0" class="text-center py-12 text-slate-500">
                <p class="text-lg">Belum ada data sektor</p>
            </div>
        </main>
    </div>
<div id="sb-overlay" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm hidden" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div></body>
</html>
