<body class="h-100 d-flex" x-data="factorTiming()" x-init="fetch()">
    <script>
        function factorTiming() {
            return {
                sidebarOpen: false,
                timings: [],
                loaded: false,
                async fetch() {
                    try {
                        const resp = await fetch('/api/market/factor-timing');
                        const data = await resp.json();
                        this.timings = data.timings || [];
                        this.loaded = true;
                    } catch(e) { this.loaded = true; }
                },
                signalBadge(signal) {
                    if (signal === 'Overweight') return 'bg-green-lt text-success border border-green-500/30';
                    if (signal === 'Underweight') return 'bg-red-lt text-danger border border-red-500/30';
                    return 'bg-slate-500/20 text-muted border border-slate-500/30';
                },
                factorIcon(factor) {
                    const icons = { Value:'💰', Size:'📏', Momentum:'🚀', Quality:'⭐', LowVol:'🛡️', Growth:'🌱' };
                    return icons[factor] || '📊';
                },
                barColor(factor) {
                    const colors = { Value:'bg-blue', Size:'bg-yellow', Momentum:'bg-purple-500', Quality:'bg-green', LowVol:'bg-teal-500', Growth:'bg-orange' };
                    return colors[factor] || 'bg-slate-500';
                }
            }
        }
    </script>

            </button>
            [[if .User]]

                <span class="w-8 h-8 bg-primary rounded-pill d-flex align-items-center justify-content-center fs-xs fw-bold text-white">[[slice .User.Name 0 1]]</span>
            </a>
            [[end]]
        </div>
    </header>

    <main class="flex-fill ms-0 ml-60 mt-2 p-2">
        <template x-if="!loaded">
            <div class="card p-2 d-flex flex-column align-items-center justify-content-center vstack gap-3">
                <div class="w-16 h-16 border-4 border-primary border-top rounded-pill "></div>
                <p class="text-muted dark:text-muted">Analyzing factor timing...</p>
            </div>
        </template>

        <template x-if="loaded">
            <div class="vstack gap-4">
                <div>
                    <h1 class="fs-1 fw-bold text-white">Factor Timing Model</h1>
                    <p class="text-muted dark:text-muted fs-sm mt-1">Which factor is leading this quarter? Dynamic factor rotation signals.</p>
                </div>

                <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 gap-4">
                    <template x-for="t in timings" :key="t.factor">
                        <div class="card p-2">
                            <div class="d-flex align-items-center justify-content-between mb-2">
                                <div class="d-flex align-items-center gap-3">
                                    <span class="fs-1" x-text="factorIcon(t.factor)"></span>
                                    <span class="fw-bold text-white fs-3" x-text="t.factor"></span>
                                </div>
                                <span class="px-2 py-1 rounded-pill fs-6 fw-semibold" :class="signalBadge(t.signal)" x-text="t.signal"></span>
                            </div>
                            <div class="mb-2">
                                <div class="d-flex justify-content-between fs-xs text-muted dark:text-muted mb-1">
                                    <span>Score</span>
                                    <span class="font-monospace" x-text="t.current_score.toFixed(1)"></span>
                                </div>
                                <div class="h-2 bg-body dark:bg-secondary-lt rounded-pill overflow-hidden">
                                    <div class="h-100 rounded-pill  " :class="barColor(t.factor)" :style="{ width: Math.min(100, t.current_score) + '%' }"></div>
                                </div>
                            </div>
                            <p class="fs-xs text-muted dark:text-muted lh-lg" x-text="t.rationale"></p>
                        </div>
                    </template>
                </div>

                <div class="card p-2">
                    <h2 class="fs-3 fw-bold text-white mb-2">How Factor Timing Works</h2>
                    <div class="row row-cols-1 row-cols-md-3 gap-4 fs-sm">
                        <div class="vstack gap-2">
                            <div class="fw-semibold text-primary">1. Quintile Analysis</div>
                            <p class="text-muted dark:text-muted">Rank all stocks by each factor, take the top 20% for each factor</p>
                        </div>
                        <div class="vstack gap-2">
                            <div class="fw-semibold text-primary">2. Compare Performance</div>
                            <p class="text-muted dark:text-muted">Compare average returns of top-quintile portfolios across factors</p>
                        </div>
                        <div class="vstack gap-2">
                            <div class="fw-semibold text-primary">3. Generate Signals</div>
                            <p class="text-muted dark:text-muted">Overweight factors outperforming by &gt;20%, Underweight those underperforming</p>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <div x-show="sidebarOpen" onclick="document.getElementById('sidebar').classList.add('max-md:hidden');document.getElementById('sb-overlay').classList.add('hidden')" class="d-lg-none position-fixed top-0 bottom-0 start-0 end-0 bg-black bg-opacity-50 z-2 "></div>
<div id="sb-overlay" class="position-fixed top-0 bottom-0 start-0 end-0 z-2 bg-black bg-opacity-50  d-none" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div>    <script src="/static/js/app.js" defer></script>
</body>
