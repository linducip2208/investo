    <script>
        function sectorRotation() {
            return {
                sidebarOpen: false,
                sectors: [],
                loaded: false,
                chart: null,
                async fetch() {
                    try {
                        const resp = await fetch('/api/market/sector-rotation');
                        const data = await resp.json();
                        this.sectors = data.sectors || [];
                        this.loaded = true;
                        this.$nextTick(() => this.renderChart());
                    } catch(e) { this.loaded = true; }
                },
                renderChart() {
                    if (this.chart) this.chart.destroy();
                    const ctx = document.getElementById('radar-chart');
                    if (!ctx || this.sectors.length === 0) return;

                    const labels = this.sectors.map(s => s.sector_name);
                    const scores = this.sectors.map(s => s.momentum_score);

                    const colors = scores.map(s => {
                        if (s > 70) return 'rgba(52,211,153,0.6)';
                        if (s > 50) return 'rgba(96,165,250,0.6)';
                        if (s > 30) return 'rgba(251,191,36,0.6)';
                        return 'rgba(248,113,113,0.6)';
                    });

                    this.chart = new Chart(ctx, {
                        type: 'radar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Momentum Score',
                                data: scores,
                                backgroundColor: 'rgba(59,130,246,0.15)',
                                borderColor: '#3b82f6',
                                borderWidth: 2,
                                pointBackgroundColor: colors,
                                pointBorderColor: '#3b82f6',
                                pointRadius: 5,
                                pointHoverRadius: 7
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                r: {
                                    beginAtZero: true,
                                    max: 100,
                                    grid: { color: '#334155' },
                                    angleLines: { color: '#334155' },
                                    pointLabels: { color: '#94a3b8', font: { size: 11, family: 'Inter' } },
                                    ticks: { display: false }
                                }
                            },
                            plugins: {
                                legend: { display: false }
                            }
                        }
                    });
                },
                trendBadge(trend) {
                    if (trend === 'Leading') return 'bg-green-lt text-success border border-green-500/30';
                    if (trend === 'Lagging') return 'bg-red-lt text-danger border border-red-500/30';
                    return 'bg-slate-500/20 text-muted border border-slate-500/30';
                },
                formatPct(v) {
                    if (v == null) return '—';
                    return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
                },
                pctColor(v) {
                    if (v > 0) return 'text-success';
                    if (v < 0) return 'text-danger';
                    return 'text-muted';
                }
            }
        }
    </script>

                    </template>

                <!-- Flow of Funds -->
                <div class="card p-2">
                    <h2 class="fs-3 fw-bold text-white mb-2 d-flex align-items-center gap-2">
                        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
                        Flow of Funds
                    </h2>
                    <template x-if="sectors.length >= 2">
                        <div class="d-flex flex-wrap align-items-center gap-4 fs-sm font-monospace">
                            <template x-for="(s, i) in sectors.slice(0, Math.min(5, sectors.length))" :key="s.sector_name">
                                <template x-if="i < sectors.length - 1">
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="px-2 py-2 rounded-2 bg-white dark:bg-white text-white fw-semibold" x-text="s.sector_name"></span>
                                        <svg class="w-5 h-5 text-muted flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                                        <span class="px-2 py-2 rounded-2 bg-white dark:bg-white text-white fw-semibold" x-text="sectors[i+1].sector_name"></span>
                                        <span class="fs-xs text-muted" x-text="Math.abs(s.momentum_score - sectors[i+1].momentum_score).toFixed(0) + 'pts'"></span>
                                    </div>
                                </template>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </main>

    <div x-show="sidebarOpen" onclick="document.getElementById('sidebar').classList.add('max-md:hidden');document.getElementById('sb-overlay').classList.add('hidden')" class="d-lg-none position-fixed top-0 bottom-0 start-0 end-0 bg-black bg-opacity-50 z-2 "></div>
<div id="sb-overlay" class="position-fixed top-0 bottom-0 start-0 end-0 z-2 bg-black bg-opacity-50  d-none" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div>    <script src="/static/js/app.js" defer></script>
</body>
</html>
