    <script>
        function pairTrading() {
            return {
                sidebarOpen: false,
                pairs: [],
                filteredPairs: [],
                sectors: ['All'],
                selectedSector: 'All',
                loaded: false,
                async fetch() {
                    try {
                        const resp = await fetch('/api/market/pair-trading');
                        const data = await resp.json();
                        this.pairs = data.pairs || [];
                        const secSet = new Set(this.pairs.map(p => p.sector_name));
                        this.sectors = ['All', ...Array.from(secSet).sort()];
                        this.filter();
                        this.loaded = true;
                    } catch(e) { this.loaded = true; }
                },
                filter() {
                    if (this.selectedSector === 'All') {
                        this.filteredPairs = this.pairs;
                    } else {
                        this.filteredPairs = this.pairs.filter(p => p.sector_name === this.selectedSector);
                    }
                },
                signalBadge(signal) {
                    if (signal.startsWith('SHORT')) return 'bg-red-lt text-red-400 border border-red-500/30';
                    if (signal.startsWith('LONG')) return 'bg-green-lt text-green-400 border border-green-500/30';
                    return 'bg-slate-500/20 text-slate-400 border border-slate-500/30';
                },
                zColor(z) {
                    const az = Math.abs(z);
                    if (az > 2.5) return 'text-red-400';
                    if (az > 2.0) return 'text-orange-400';
                    if (az > 1.5) return 'text-yellow-400';
                    return 'text-slate-400';
                },
                corColor(c) {
                    if (c > 0.95) return 'bg-green';
                    if (c > 0.9) return 'bg-lime';
                    if (c > 0.85) return 'bg-yellow';
                    return 'bg-blue';
                }
            }
        }
    </script>

    <!-- MAIN CONTENT -->
    <main class="flex-fill ms-0 ml-60 mt-2 p-2">

                <div class="w-16 h-16 border-4 border-primary border-top rounded-pill "></div>
                <p class="text-muted dark:text-slate-400">Finding correlated pairs...</p>
            </div>
        </template>

        <template x-if="loaded">
            <div class="vstack gap-4">
                <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-4">
                    <div>
                        <h1 class="fs-1 fw-bold text-white">Pair Trading Finder</h1>
                        <p class="text-muted dark:text-slate-400 fs-sm mt-1">Statistical arbitrage pairs with high correlation</p>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <span class="fs-xs text-muted dark:text-slate-400">Filter:</span>
                        <select x-model="selectedSector" @change="filter()"
                                class="bg-white dark:bg-white border border rounded-2 px-2 py-2 fs-sm text-white  ">
                            <template x-for="s in sectors" :key="s">
                                <option :value="s" x-text="s"></option>
                            </template>
                        </select>
                        <span class="fs-xs text-muted font-monospace" x-text="filteredPairs.length + ' pairs'"></span>
                    </div>
                </div>

                <!-- Pairs Grid -->
                <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 gap-4">
                    <template x-for="pair in filteredPairs" :key="pair.stock_a + '-' + pair.stock_b">
                        <div class="card p-2  ">
                            <!-- Pair Header -->
                            <div class="d-flex align-items-center justify-content-between mb-2">
                                <div class="d-flex align-items-center gap-2">
                                    <span class="font-monospace fw-bold text-white fs-sm" x-text="pair.stock_a"></span>
                                    <svg class="w-4 h-4 text-muted flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                                    <span class="font-monospace fw-bold text-white fs-sm" x-text="pair.stock_b"></span>
                                </div>
                                <span class="px-2 py-1 rounded-pill fs-6 fw-semibold" :class="signalBadge(pair.signal)" x-text="pair.signal === 'NEUTRAL' ? 'NEUTRAL' : pair.signal.substring(0, 25) + '...'"></span>
                            </div>

                            <!-- Details -->
                            <div class="row row-cols-2 gap-3 fs-sm">
                                <div>
                                    <div class="fs-xs text-muted dark:text-slate-400 mb-0">Correlation</div>
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="font-monospace fw-semibold" :class="corColor(pair.correlation).replace('bg-','text-')" x-text="pair.correlation"></span>
                                        <div class="flex-fill h-1.5 bg-body dark:bg-secondary-lt rounded-pill overflow-hidden">
                                            <div class="h-100 rounded-pill" :class="corColor(pair.correlation)" :style="{ width: (pair.correlation * 100) + '%' }"></div>
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <div class="fs-xs text-muted dark:text-slate-400 mb-0">Z-Score</div>
                                    <span class="font-monospace fw-semibold" :class="zColor(pair.z_score)" x-text="pair.z_score"></span>
                                </div>
                                <div>
                                    <div class="fs-xs text-muted dark:text-slate-400 mb-0">Spread Mean</div>
                                    <span class="font-monospace text-body dark:text-body" x-text="pair.spread_mean"></span>
                                </div>
                                <div>
                                    <div class="fs-xs text-muted dark:text-slate-400 mb-0">Spread Std</div>
                                    <span class="font-monospace text-body dark:text-body" x-text="pair.spread_std"></span>
                                </div>
                                <div>
                                    <div class="fs-xs text-muted dark:text-slate-400 mb-0">Current Spread</div>
                                    <span class="font-monospace fw-semibold"
                                          :class="Math.abs(pair.z_score) > 2 ? 'text-warning' : 'text-body'"
                                          x-text="pair.current_spread"></span>
                                </div>
                                <div>
                                    <div class="fs-xs text-muted dark:text-slate-400 mb-0">Half-Life</div>
                                    <span class="font-monospace text-body dark:text-body" x-text="pair.half_life + 'd'"></span>
                                </div>
                            </div>

                            <!-- Sector Tag -->
                            <div class="mt-2 pt-2 border-top border dark:border">
                                <span class="d-inline-block px-2 py-1 rounded-2 bg-white dark:bg-white fs-6 text-muted dark:text-slate-400 fw-medium" x-text="pair.sector_name"></span>
                                <span class="ms-2 fs-xs text-muted" x-text="pair.stock_a_name + ' / ' + pair.stock_b_name"></span>
                            </div>
                        </div>
                    </template>
                </div>

                <template x-if="filteredPairs.length === 0">
                    <div class="card p-2 text-center">
                        <div class="text-muted fs-3 mb-2">No pairs found</div>
                        <p class="text-muted fs-sm">No correlated pairs (r >= 0.8) found in the selected sector. Try All sectors.</p>
                    </div>
                </template>

                <!-- Info Card -->
                <div class="card p-2">
                    <h2 class="fs-3 fw-bold text-white mb-2">How Pair Trading Works</h2>
                    <div class="row row-cols-1 row-cols-md-3 gap-6 fs-sm">
                        <div class="vstack gap-2">
                            <div class="fw-semibold text-primary">1. Find Correlation</div>
                            <p class="text-muted dark:text-slate-400">Identify two stocks in the same sector with correlation &gt; 0.8 over 6 months.</p>
                        </div>
                        <div class="vstack gap-2">
                            <div class="fw-semibold text-primary">2. Calculate Spread</div>
                            <p class="text-muted dark:text-slate-400">Compute log spread between the pair. When z-score &gt; 2, the pair is out of equilibrium.</p>
                        </div>
                        <div class="vstack gap-2">
                            <div class="fw-semibold text-primary">3. Execute Trade</div>
                            <p class="text-muted dark:text-slate-400">LONG the underperformer, SHORT the overperformer. Exit when spread reverts to mean.</p>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </main>

<div id="sb-overlay" class="position-fixed top-0 bottom-0 start-0 end-0 z-2 bg-black bg-opacity-50  d-none" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div>    <script src="/static/js/app.js" defer></script>
