<!DOCTYPE html>
<html lang="id" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[.Title]]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        *{scrollbar-width:thin;scrollbar-color:#334155 #0b1120}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0b1120}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid rgba(51,65,85,.5);border-radius:14px;transition:all .2s}
        .card:hover{border-color:#475569}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:500;transition:all .15s;text-decoration:none}
        .sidebar-link:hover{background:#1e293b;color:#e2e8f0}
        .sidebar-link.active{background:#1e3a8a;color:#93c5fd;font-weight:600}
        .sidebar-link .icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:16px}
        .text-success{color:#34d399}.text-danger{color:#f87171}.text-warning{color:#fbbf24}
        input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:#334155;border-radius:3px;outline:none}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:#3b82f6;border-radius:50%;cursor:pointer}
        @media(max-width:1024px){.sidebar{display:none}.sidebar.open{display:flex}}
        @media(max-width:640px){.card{padding:12px!important}}
    </style>
</head>
<body class="h-full flex" x-data="smartBeta()" x-init="fetch()">
    <script>
        function smartBeta() {
            return {
                sidebarOpen: false,
                factors: [
                    { key:'value', label:'Value', selected:true, weight:33, color:'bg-blue-500' },
                    { key:'size', label:'Size', selected:false, weight:0, color:'bg-yellow-500' },
                    { key:'momentum', label:'Momentum', selected:true, weight:34, color:'bg-purple-500' },
                    { key:'quality', label:'Quality', selected:true, weight:33, color:'bg-green-500' },
                    { key:'low_vol', label:'Low Vol', selected:false, weight:0, color:'bg-teal-500' },
                    { key:'growth', label:'Growth', selected:false, weight:0, color:'bg-orange-500' },
                ],
                results: [],
                allExposures: [],
                loaded: false,
                async fetch() {
                    try {
                        const resp = await fetch('/api/market/factor-exposure');
                        const data = await resp.json();
                        this.allExposures = data.exposures || [];
                        this.recalculate();
                        this.loaded = true;
                    } catch(e) { this.loaded = true; }
                },
                toggle(index) {
                    this.factors[index].selected = !this.factors[index].selected;
                    if (!this.factors[index].selected) this.factors[index].weight = 0;
                    this.normalize();
                    this.recalculate();
                },
                updateWeight() {
                    this.normalize();
                    this.recalculate();
                },
                normalize() {
                    const sel = this.factors.filter(f => f.selected);
                    if (sel.length === 0) return;
                    const each = Math.floor(100 / sel.length);
                    let remainder = 100 - each * sel.length;
                    sel.forEach((f, i) => {
                        f.weight = each + (i < remainder ? 1 : 0);
                    });
                    this.factors.forEach(f => { if (!f.selected) f.weight = 0; });
                },
                recalculate() {
                    const sel = this.factors.filter(f => f.selected);
                    if (sel.length === 0) { this.results = []; return; }
                    const totalW = sel.reduce((s, f) => s + f.weight, 0);
                    this.results = this.allExposures.map(exp => {
                        let score = 0;
                        sel.forEach(f => {
                            const w = f.weight / totalW;
                            score += (exp[f.key] || 0) * w;
                        });
                        return { ...exp, score: Math.round(score * 10) / 10 };
                    }).sort((a, b) => b.score - a.score).slice(0, 50);
                },
                barColor(v) {
                    if (v > 60) return 'bg-green-500';
                    if (v > 35) return 'bg-yellow-500';
                    return 'bg-red-500';
                },
                factorColor(key) {
                    const m = { value:'bg-blue-500', size:'bg-yellow-500', momentum:'bg-purple-500', quality:'bg-green-500', low_vol:'bg-teal-500', growth:'bg-orange-500' };
                    return m[key] || 'bg-slate-500';
                }
            }
        }
    </script>

    <aside class="sidebar fixed inset-y-0 left-0 z-50 w-60 bg-[#0b1120] border-r border-slate-800 flex flex-col" class="max-md:hidden">
        <div class="flex items-center gap-3 px-5 h-16 border-b border-slate-800">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center font-bold text-white text-sm">I</div>
            <span class="font-bold text-lg text-white">Investo</span>
        </div>
        <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
            <a href="/dashboard" class="sidebar-link"><span class="icon">📊</span> Dashboard</a>
            <a href="/saham" class="sidebar-link"><span class="icon">📈</span> Saham IDX</a>
            <div class="border-t border-slate-800 my-2"></div>
            <p class="px-4 text-[10px] font-semibold text-slate-600 uppercase tracking-widest mb-1">Quantitative Research</p>
            <a href="/market/factor-exposure" class="sidebar-link"><span class="icon">📐</span> Factor Exposure</a>
            <a href="/market/factor-timing" class="sidebar-link"><span class="icon">⏱️</span> Factor Timing</a>
            <a href="/market/smart-beta" class="sidebar-link active"><span class="icon">🧬</span> Smart Beta</a>
            <div class="border-t border-slate-800 my-2"></div>
            <p class="px-4 text-[10px] font-semibold text-slate-600 uppercase tracking-widest mb-1">Supply Chain</p>
            <a href="/market/supply-chain" class="sidebar-link"><span class="icon">🔗</span> Supply Chain</a>
            <a href="/market/industry-lifecycle" class="sidebar-link"><span class="icon">🌱</span> Industry Lifecycle</a>
            <a href="/market/competitive" class="sidebar-link"><span class="icon">🏆</span> Competitive</a>
            <div class="border-t border-slate-800 my-2"></div>
            <a href="/dashboard/portfolios" class="sidebar-link"><span class="icon">💼</span> Portofolio</a>
        </nav>
        <div class="p-3 border-t border-slate-800">
            <a href="/pengaturan" class="sidebar-link"><span class="icon">⚙️</span> Pengaturan</a>
        </div>
    </aside>

    <header class="fixed top-0 right-0 left-0 lg:left-60 h-16 bg-[#0b1120]/90 backdrop-blur-md border-b border-slate-800 z-40 flex items-center justify-between px-6">
        <button onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');document.getElementById('sb-overlay').classList.toggle('hidden')" class="lg:hidden p-2 text-slate-400 hover:text-white transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="text-sm text-slate-400"><span class="text-slate-600">Quant /</span> Smart Beta Screener</div>
        <div class="flex items-center gap-3">
            <button @click="recalculate()" class="p-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition-colors" title="Recalculate">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
            [[if .User]]
            <a href="/profil" class="flex items-center gap-2 text-sm text-slate-300 hover:text-white transition-colors">
                <span class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-xs font-bold text-white">[[slice .User.Name 0 1]]</span>
            </a>
            [[end]]
        </div>
    </header>

    <main class="flex-1 ml-0 lg:ml-60 mt-16 p-6">
        <template x-if="!loaded">
            <div class="card p-8 flex flex-col items-center justify-center space-y-4">
                <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-slate-400">Loading smart beta screener...</p>
            </div>
        </template>

        <template x-if="loaded">
            <div class="space-y-6">
                <div>
                    <h1 class="text-2xl font-bold text-white">Smart Beta Screener</h1>
                    <p class="text-slate-400 text-sm mt-1">Build custom multi-factor portfolios with weighted factor exposures</p>
                </div>

                <div class="card p-6">
                    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Factor Selection & Weights (must sum to 100%)</h2>
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                        <template x-for="(f, i) in factors" :key="f.key">
                            <div class="space-y-2">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" :checked="f.selected" @change="toggle(i)"
                                           class="w-4 h-4 rounded border-slate-600 bg-slate-800 text-blue-600 focus:ring-blue-600">
                                    <span class="text-sm font-medium text-slate-300" x-text="f.label"></span>
                                </label>
                                <input type="range" min="0" max="100" step="1" x-model.number="f.weight" @input="updateWeight()"
                                       :disabled="!f.selected" :class="!f.selected ? 'opacity-30' : ''">
                                <span class="text-xs font-mono text-slate-500" x-text="f.weight + '%'"
                                      :class="f.selected ? '' : 'opacity-30'"></span>
                            </div>
                        </template>
                    </div>
                    <div class="mt-3 text-xs" :class="factors.reduce((s,f)=>s+f.weight,0) === 100 ? 'text-green-400' : 'text-red-400'">
                        Total: <span class="font-mono font-bold" x-text="factors.reduce((s,f)=>s+f.weight,0) + '%'"></span>
                        <span x-show="factors.reduce((s,f)=>s+f.weight,0) !== 100" class="ml-1">(must equal 100%)</span>
                    </div>
                </div>

                <template x-if="factors.reduce((s,f)=>s+f.weight,0) === 100 && results.length > 0">
                    <div class="card overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="border-b border-slate-700">
                                    <th class="text-left p-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Rank</th>
                                    <th class="text-left p-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Stock</th>
                                    <th class="text-right p-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Smart Beta Score</th>
                                    <th class="p-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Factor Breakdown</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="(r, idx) in results" :key="r.stock_code">
                                    <tr class="border-b border-slate-800 hover:bg-slate-800/50 transition-colors">
                                        <td class="p-3 text-slate-500 font-mono text-xs" x-text="idx + 1"></td>
                                        <td class="p-3">
                                            <span class="font-mono font-bold text-white" x-text="r.stock_code"></span>
                                            <span class="text-slate-500 text-xs ml-2 hidden sm:inline" x-text="r.stock_name"></span>
                                        </td>
                                        <td class="p-3 text-right">
                                            <span class="font-mono font-bold text-blue-400" x-text="r.score.toFixed(1)"></span>
                                        </td>
                                        <td class="p-3">
                                            <div class="flex gap-1 items-end h-6">
                                                <template x-for="f in factors.filter(x=>x.selected)" :key="f.key">
                                                    <div class="flex-1 min-w-[20px]" :title="f.label + ': ' + (r[f.key]||0).toFixed(1)">
                                                        <div class="rounded-t" :class="factorColor(f.key)"
                                                             :style="{ height: Math.max(2, (r[f.key]||0)*0.24) + 'px' }"></div>
                                                    </div>
                                                </template>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>

                <div class="card p-6">
                    <h2 class="text-lg font-bold text-white mb-3">Smart Beta Strategy Guide</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                        <div class="space-y-2">
                            <div class="font-semibold text-blue-400">1. Select Factors</div>
                            <p class="text-slate-400">Choose factors that match your investment thesis. Common combinations: Value+Quality for defensive, Momentum+Growth for aggressive.</p>
                        </div>
                        <div class="space-y-2">
                            <div class="font-semibold text-blue-400">2. Set Weights</div>
                            <p class="text-slate-400">Adjust slider weights to emphasize certain factors. Weights auto-normalize to 100%.</p>
                        </div>
                        <div class="space-y-2">
                            <div class="font-semibold text-blue-400">3. Analyze Results</div>
                            <p class="text-slate-400">Top-ranked stocks have the highest composite score. Review factor breakdown bars for diversification.</p>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <div x-show="sidebarOpen" onclick="document.getElementById('sidebar').classList.add('max-md:hidden');document.getElementById('sb-overlay').classList.add('hidden')" class="lg:hidden fixed inset-0 bg-black/50 z-30 backdrop-blur-sm"></div>
<div id="sb-overlay" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm hidden" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div></body>
</html>
