<!DOCTYPE html>
<html lang="id" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[.Title]]</title>
    <link rel="stylesheet" href="/static/css/vendor/tabler.css">
    <link rel="stylesheet" href="/static/css/legacy-compat.css">
    <link rel="stylesheet" href="/static/css/fintech.css">
    <script data-investo-assets>
    (function(){try{var p=localStorage.getItem('investo-theme')||'light';
    var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(d)document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-bs-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();
    </script>
    <script defer src="/static/js/vendor/alpine.min.js"></script>
    <style>
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid #334155;border-radius:14px}
        .input-field{width:100%;padding:10px 14px;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#e2e8f0;font-size:14px;outline:none}
        .input-field:focus{border-color:#3b82f6}
        .btn{padding:8px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none}
        .btn-primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff}
    </style>
<style data-investo-compat>
    body{background:var(--ui-bg)!important;color:var(--ui-text)!important}
    .card{background:var(--ui-surface)!important;border-color:var(--ui-border)!important;color:var(--ui-text)!important}
    .text-success{color:var(--ui-success)!important}.text-danger{color:var(--ui-danger)!important}
    .widget-title{color:var(--ui-muted)!important}
    </style>
</head>
<body class="bg-body dark:bg-[#0b1120] text-body dark:text-slate-200" x-data="forwardRules()">
<div class="max-w-3xl mx-auto px-2 py-2">
    <h1 class="fs-1 fw-bold text-white mb-2">Auto-Forward Rules</h1>
    <p class="fs-sm text-muted dark:text-muted mb-2">Teruskan sinyal trading ke bot lain berdasarkan aturan tertentu.</p>

    <div class="card p-2 vstack gap-3">
        <div>
            <label class="fs-xs text-muted dark:text-muted d-block mb-1">Min Confidence (%)</label>
            <input type="number" min="0" max="100" x-model.number="rules.confidence_min" class="input-field">
        </div>
        <div>
            <label class="fs-xs text-muted dark:text-muted d-block mb-1">Pattern Match (regex, opsional)</label>
            <input type="text" x-model="rules.pattern_match" placeholder="cth: BBCA|BBRI" class="input-field">
        </div>
        <div>
            <label class="fs-xs text-muted dark:text-muted d-block mb-1">Signal Types</label>
            <div class="d-flex gap-4">
                <label class="d-flex align-items-center gap-2 fs-sm text-body dark:text-body"><input type="checkbox" value="BUY" x-model="rules.signal_types" class="rounded"> BUY</label>
                <label class="d-flex align-items-center gap-2 fs-sm text-body dark:text-body"><input type="checkbox" value="SELL" x-model="rules.signal_types" class="rounded"> SELL</label>
                <label class="d-flex align-items-center gap-2 fs-sm text-body dark:text-body"><input type="checkbox" value="HOLD" x-model="rules.signal_types" class="rounded"> HOLD</label>
            </div>
        </div>
        <div>
            <label class="fs-xs text-muted dark:text-muted d-block mb-1">Target Bot ID</label>
            <input type="number" x-model.number="rules.target_bot_id" class="input-field">
        </div>
        <button @click="save()" class="btn btn-primary">Simpan Rules</button>
    </div>

    <div x-show="toast" x-text="toast" class="mt-2 fs-sm" :class="ok ? 'text-success' : 'text-danger'"></div>
</div>

<script>
function forwardRules() {
    return {
        rules: { confidence_min: 70, pattern_match: '', signal_types: ['BUY','SELL'], target_bot_id: 0 },
        toast: '', ok: true,

        async init() {
            try {
                const r = await fetch('/api/bots/forward-rules');
                const d = await r.json();
                if (d && d.confidence_min !== undefined) this.rules = d;
            } catch (e) {}
        },

        async save() {
            try {
                const r = await fetch('/api/bots/forward-rules', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.rules)
                });
                const d = await r.json();
                this.ok = r.ok;
                this.toast = this.ok ? 'Rules tersimpan ✓' : (d.error || 'Gagal menyimpan');
            } catch (e) {
                this.ok = false;
                this.toast = e.message;
            }
        }
    };
}
</script>
    <script src="/static/js/app.js" defer></script>
</body>
</html>
