<body class="h-100 d-flex" x-data="fearGreed()" x-init="fetch()">
    <script>
        function fearGreed() {
            return {
                sidebarOpen: false,
                score: 0,
                label: 'Neutral',
                components: {},
                history: [],
                loaded: false,
                timer: null,
                async fetch() {
                    try {
                        const resp = await fetch('/api/market/fear-greed');
                        const data = await resp.json();
                        if (data.current) {
                            this.score = data.current.score;
                            this.label = data.current.label;
                            this.components = data.current.components || {};
                            this.history = data.history || [];
                            this.loaded = true;
                        }
                    } catch(e) {}
                },
                init() {
                    this.timer = setInterval(() => this.fetch(), 300000);
                    this.$watch('loaded', () => { if(this.loaded) this.drawGauge(); });
                },
                drawGauge() {
                    const self = this;
                    this.$nextTick(() => {
                        const svg = document.getElementById('gauge-svg');
                        if (!svg) return;
                        const cx = 160, cy = 150, r = 110;
                        const angle = -180 + (self.score / 100) * 180;
                        const rad = angle * Math.PI / 180;
                        const nx = cx + r * Math.cos(rad);
                        const ny = cy + r * Math.sin(rad);
                        const needle = document.getElementById('gauge-needle');
                        if (needle) needle.setAttribute('d', `M${cx} ${cy-10} L${cx} ${cy+20} L${nx} ${ny} Z`);
                        const label = document.getElementById('gauge-label');
                        if (label) label.textContent = self.score;
                    });
                },
                getColor(score) {
                    if (score <= 25) return '#ef4444';
                    if (score <= 45) return '#f97316';
                    if (score <= 55) return '#eab308';
                    if (score <= 75) return '#22c55e';
                    return '#16a34a';
                },
                barColor(score) {
                    if (score <= 25) return 'bg-red';
                    if (score <= 45) return 'bg-orange';
                    if (score <= 55) return 'bg-yellow';
                    if (score <= 75) return 'bg-lime';
                    return 'bg-green';
                },
                barHeight(score) { return Math.max(4, score * 0.8) + 'px'; }
            }
        }
    </script>

                                                  'text-orange-400': value > 25 && value <= 45,
                                                  'text-yellow-400': value > 45 && value <= 55,

                                    <div class="w-100 h-2 bg-body dark:bg-secondary-lt rounded-pill overflow-hidden">
                                        <div class="h-100 rounded-pill  "
                                             :style="{ width: value + '%' }"
                                             :class="{
                                                 'bg-red': value <= 25,
                                                 'bg-orange': value > 25 && value <= 45,
                                                 'bg-yellow': value > 45 && value <= 55,
                                                 'bg-lime': value > 55 && value <= 75,
                                                 'bg-green': value > 75
                                             }"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Historical Timeline -->
                <div class="card p-2">
                    <h2 class="fs-3 fw-bold text-white mb-2 d-flex align-items-center gap-2">
                        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                        30-Day Sentiment History
                    </h2>
                    <template x-if="history.length === 0">
                        <p class="text-muted text-center py-2">No historical data available yet.</p>
                    </template>
                    <template x-if="history.length > 0">
                        <div class="overflow-x-auto">
                            <div class="d-flex align-items-end gap-1 h-36 min-w-max">
                                <template x-for="item in history.slice(-30)" :key="item.timestamp">
                                    <div class="d-flex flex-column align-items-center group position-relative">
                                        <div class="w-6 rounded-t"
                                             :style="{ height: (item.score * 1.2) + 'px' }"
                                             :class="{
                                                 'bg-red': item.score <= 25,
                                                 'bg-orange': item.score > 25 && item.score <= 45,
                                                 'bg-yellow': item.score > 45 && item.score <= 55,
                                                 'bg-lime': item.score > 55 && item.score <= 75,
                                                 'bg-green': item.score > 75
                                             }"
                                             :title="item.score + ' - ' + item.label"></div>
                                        <div class="position-absolute bottom-full mb-1 opacity-0  bg-white dark:bg-white text-white fs-6 rounded px-2 py-1 text-nowrap font-monospace  z-1" x-text="item.score + ' · ' + item.label"></div>
                                    </div>
                                </template>
                            </div>
                            <div class="d-flex align-items-center justify-content-between mt-2 fs-6 text-muted font-monospace">
                                <span x-text="history.length > 0 ? history[Math.max(0, history.length - 30)].timestamp?.split('T')[0] : ''"></span>
                                <span x-text="history.length > 0 ? history[history.length - 1]?.timestamp?.split('T')[0] : ''"></span>
                            </div>
                        </div>
                    </template>
                    <!-- Legend -->
                    <div class="d-flex flex-wrap gap-3 mt-2">
                        <div class="d-flex align-items-center gap-1 fs-xs text-muted dark:text-slate-400"><span class="w-3 h-3 rounded bg-danger"></span> Extreme Fear</div>
                        <div class="d-flex align-items-center gap-1 fs-xs text-muted dark:text-slate-400"><span class="w-3 h-3 rounded bg-warning"></span> Fear</div>
                        <div class="d-flex align-items-center gap-1 fs-xs text-muted dark:text-slate-400"><span class="w-3 h-3 rounded bg-warning"></span> Neutral</div>
                        <div class="d-flex align-items-center gap-1 fs-xs text-muted dark:text-slate-400"><span class="w-3 h-3 rounded bg-success"></span> Greed</div>
                        <div class="d-flex align-items-center gap-1 fs-xs text-muted dark:text-slate-400"><span class="w-3 h-3 rounded bg-success"></span> Extreme Greed</div>
                    </div>
                </div>

                <!-- Component Weights Info -->
                <div class="card p-2">
                    <h2 class="fs-3 fw-bold text-white mb-2">Index Composition</h2>
                    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-5 gap-4">
                        <div class="bg-white dark:bg-[#0f172a] rounded-3 p-2 border border dark:border">
                            <div class="fs-xs text-muted dark:text-slate-400 text-uppercase  mb-1">Market Momentum</div>
                            <div class="fs-1 fw-bold text-white font-monospace">25%</div>
                            <div class="fs-xs text-muted mt-1">% of stocks above MA50</div>
                        </div>
                        <div class="bg-white dark:bg-[#0f172a] rounded-3 p-2 border border dark:border">
                            <div class="fs-xs text-muted dark:text-slate-400 text-uppercase  mb-1">Stock Breadth</div>
                            <div class="fs-1 fw-bold text-white font-monospace">25%</div>
                            <div class="fs-xs text-muted mt-1">Advance/decline ratio</div>
                        </div>
                        <div class="bg-white dark:bg-[#0f172a] rounded-3 p-2 border border dark:border">
                            <div class="fs-xs text-muted dark:text-slate-400 text-uppercase  mb-1">Volatility</div>
                            <div class="fs-1 fw-bold text-white font-monospace">25%</div>
                            <div class="fs-xs text-muted mt-1">IHSG 20-day std dev</div>
                        </div>
                        <div class="bg-white dark:bg-[#0f172a] rounded-3 p-2 border border dark:border">
                            <div class="fs-xs text-muted dark:text-slate-400 text-uppercase  mb-1">Foreign Flow</div>
                            <div class="fs-1 fw-bold text-white font-monospace">12.5%</div>
                            <div class="fs-xs text-muted mt-1">Net buy ratio</div>
                        </div>
                        <div class="bg-white dark:bg-[#0f172a] rounded-3 p-2 border border dark:border">
                            <div class="fs-xs text-muted dark:text-slate-400 text-uppercase  mb-1">Trading Volume</div>
                            <div class="fs-1 fw-bold text-white font-monospace">12.5%</div>
                            <div class="fs-xs text-muted mt-1">Volume vs 20-day avg</div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- Mobile overlay -->
    <div x-show="sidebarOpen" onclick="document.getElementById('sidebar').classList.add('max-md:hidden');document.getElementById('sb-overlay').classList.add('hidden')" class="d-lg-none position-fixed top-0 bottom-0 start-0 end-0 bg-black bg-opacity-50 z-2 "></div>
<div id="sb-overlay" class="position-fixed top-0 bottom-0 start-0 end-0 z-2 bg-black bg-opacity-50  d-none" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div>    <script src="/static/js/app.js" defer></script>
</body>
</html>
