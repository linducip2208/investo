<body class="h-100 d-flex" x-data="factorExposure()" x-init="fetch()">
    <script>
        function factorExposure() {
            return {
                sidebarOpen: false,
                exposures: [],
                filtered: [],
                search: '',
                sortKey: 'composite',
                sortDir: -1,
                loaded: false,
                async fetch() {
                    try {
                        const resp = await fetch('/api/market/factor-exposure');
                        const data = await resp.json();
                        this.exposures = data.exposures || [];
                        this.filter();
                        this.loaded = true;
                    } catch(e) { this.loaded = true; }
                },
                filter() {
                    let items = this.exposures;
                    if (this.search) {
                        const q = this.search.toUpperCase();
                        items = items.filter(e => e.stock_code.toUpperCase().includes(q) || e.stock_name.toUpperCase().includes(q));
                    }
                    items.sort((a,b) => (a[this.sortKey] - b[this.sortKey]) * this.sortDir);
                    this.filtered = items;
                },
                sort(key) {
                    if (this.sortKey === key) { this.sortDir *= -1; } else { this.sortKey = key; this.sortDir = -1; }
                    this.filter();
                },
                barColor(v) {
                    if (v > 70) return 'bg-green';
                    if (v > 40) return 'bg-yellow';
                    return 'bg-red';
                },
                scoreColor(v) {
                    if (v > 70) return 'text-green-400';
                    if (v > 40) return 'text-yellow-400';
                    return 'text-red-400';
                }
            }
        }
    </script>

    <main class="flex-fill ms-0 ml-60 mt-2 p-2">

                <div class="w-16 h-16 border-4 border-primary border-top rounded-pill "></div>
                <p class="text-muted dark:text-slate-400">Loading factor exposures...</p>
            </div>
        </template>

        <template x-if="loaded">
            <div class="vstack gap-4">
                <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-4">
                    <div>
                        <h1 class="fs-1 fw-bold text-white">Factor Exposure Report</h1>
                        <p class="text-muted dark:text-slate-400 fs-sm mt-1">Multi-factor decomposition: Value, Size, Momentum, Quality, Low Vol, Growth</p>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <input type="text" placeholder="Search stock..." x-model="search" @input="filter()"
                               class="bg-white dark:bg-white border border rounded-2 px-2 py-2 fs-sm text-white placeholder:text-slate-500   w-48">
                        <span class="fs-xs text-muted font-monospace" x-text="filtered.length + ' stocks'"></span>
                    </div>
                </div>

                <div class="card overflow-x-auto">
                    <table class="table table-vcenter table-hover w-100 fs-sm">
                        <thead>
                            <tr class="border-bottom border dark:border">
                                <th class="text-start p-2 fs-xs fw-semibold text-muted dark:text-slate-400 text-uppercase ">Stock</th>
                                <th class="text-end p-2 fs-xs fw-semibold text-muted dark:text-slate-400 text-uppercase  cursor-pointer " @click="sort('value')">Value <span x-text="sortKey==='value' ? (sortDir>0?'▴':'▾') : ''"></span></th>
                                <th class="text-end p-2 fs-xs fw-semibold text-muted dark:text-slate-400 text-uppercase  cursor-pointer " @click="sort('size')">Size <span x-text="sortKey==='size' ? (sortDir>0?'▴':'▾') : ''"></span></th>
                                <th class="text-end p-2 fs-xs fw-semibold text-muted dark:text-slate-400 text-uppercase  cursor-pointer " @click="sort('momentum')">Momentum <span x-text="sortKey==='momentum' ? (sortDir>0?'▴':'▾') : ''"></span></th>
                                <th class="text-end p-2 fs-xs fw-semibold text-muted dark:text-slate-400 text-uppercase  cursor-pointer " @click="sort('quality')">Quality <span x-text="sortKey==='quality' ? (sortDir>0?'▴':'▾') : ''"></span></th>
                                <th class="text-end p-2 fs-xs fw-semibold text-muted dark:text-slate-400 text-uppercase  cursor-pointer " @click="sort('low_vol')">Low Vol <span x-text="sortKey==='low_vol' ? (sortDir>0?'▴':'▾') : ''"></span></th>
                                <th class="text-end p-2 fs-xs fw-semibold text-muted dark:text-slate-400 text-uppercase  cursor-pointer " @click="sort('growth')">Growth <span x-text="sortKey==='growth' ? (sortDir>0?'▴':'▾') : ''"></span></th>
                                <th class="text-end p-2 fs-xs fw-semibold text-muted dark:text-slate-400 text-uppercase  cursor-pointer " @click="sort('composite')">Composite <span x-text="sortKey==='composite' ? (sortDir>0?'▴':'▾') : ''"></span></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="exp in filtered" :key="exp.stock_code">
                                <tr class="border-bottom border dark:border-slate-800  dark:hover:bg-white/50 ">
                                    <td class="p-2">
                                        <span class="font-monospace fw-bold text-white" x-text="exp.stock_code"></span>
                                        <span class="text-muted fs-xs ms-2" x-text="exp.stock_name"></span>
                                    </td>
                                    <td class="p-2 text-end"><span class="font-monospace" :class="scoreColor(exp.value)" x-text="exp.value.toFixed(1)"></span></td>
                                    <td class="p-2 text-end"><span class="font-monospace" :class="scoreColor(exp.size)" x-text="exp.size.toFixed(1)"></span></td>
                                    <td class="p-2 text-end"><span class="font-monospace" :class="scoreColor(exp.momentum)" x-text="exp.momentum.toFixed(1)"></span></td>
                                    <td class="p-2 text-end"><span class="font-monospace" :class="scoreColor(exp.quality)" x-text="exp.quality.toFixed(1)"></span></td>
                                    <td class="p-2 text-end"><span class="font-monospace" :class="scoreColor(exp.low_vol)" x-text="exp.low_vol.toFixed(1)"></span></td>
                                    <td class="p-2 text-end"><span class="font-monospace" :class="scoreColor(exp.growth)" x-text="exp.growth.toFixed(1)"></span></td>
                                    <td class="p-2 text-end"><span class="font-monospace fw-bold text-primary" x-text="exp.composite.toFixed(1)"></span></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    <template x-if="filtered.length === 0">
                        <div class="p-2 text-center text-muted">No stocks match your search.</div>
                    </template>
                </div>

                <div class="card p-2">
                    <h2 class="fs-3 fw-bold text-white mb-2">Factor Methodology</h2>
                    <div class="row row-cols-1 row-cols-md-3 gap-4 fs-sm">
                        <div class="vstack gap-2">
                            <div class="fw-semibold text-primary">Value (0-100)</div>
                            <p class="text-muted dark:text-slate-400">PER&lt;15 (+30), PBV&lt;1.5 (+40), Div Yield&gt;3% (+30)</p>
                        </div>
                        <div class="vstack gap-2">
                            <div class="fw-semibold text-success">Quality (0-100)</div>
                            <p class="text-muted dark:text-slate-400">ROE&gt;20% (+40), DER&lt;1 (+30), Stable earnings (+30)</p>
                        </div>
                        <div class="vstack gap-2">
                            <div class="fw-semibold text-primary">Momentum (0-100)</div>
                            <p class="text-muted dark:text-slate-400">6-month price return normalized to 0-100 scale</p>
                        </div>
                        <div class="vstack gap-2">
                            <div class="fw-semibold text-warning">Size (0-100)</div>
                            <p class="text-muted dark:text-slate-400">Small cap=100, Mega cap=0. Market cap-based scoring</p>
                        </div>
                        <div class="vstack gap-2">
                            <div class="fw-semibold text-success">Low Vol (0-100)</div>
                            <p class="text-muted dark:text-slate-400">Beta&lt;0.8 (+50), Low daily volatility (+50)</p>
                        </div>
                        <div class="vstack gap-2">
                            <div class="fw-semibold text-warning">Growth (0-100)</div>
                            <p class="text-muted dark:text-slate-400">EPS growth&gt;15% (+50), Revenue growth&gt;10% (+50)</p>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <div x-show="sidebarOpen" onclick="document.getElementById('sidebar').classList.add('max-md:hidden');document.getElementById('sb-overlay').classList.add('hidden')" class="d-lg-none position-fixed top-0 bottom-0 start-0 end-0 bg-black bg-opacity-50 z-2 "></div>
<div id="sb-overlay" class="position-fixed top-0 bottom-0 start-0 end-0 z-2 bg-black bg-opacity-50  d-none" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div>    <script src="/static/js/app.js" defer></script>
</body>
</html>
