    <script>
        function tradeIdeas() {
            return {
                sidebarOpen: false,
                ideas: [],
                filteredIdeas: [],
                strategies: ['All', 'Breakout', 'Dip Buy', 'Momentum', 'Value', 'Dividend Capture', 'Mean Reversion'],
                riskLevels: ['All', 'Low', 'Medium', 'High'],
                selectedStrategy: 'All',
                selectedRisk: 'All',
                expanded: {},
                loaded: false,
                async fetch() {
                    try {
                        const resp = await fetch('/api/market/trade-ideas');
                        const data = await resp.json();
                        this.ideas = data.ideas || [];
                        this.filter();
                        this.loaded = true;
                    } catch(e) { this.loaded = true; }
                },
                filter() {
                    let result = this.ideas;
                    if (this.selectedStrategy !== 'All') {
                        result = result.filter(i => i.strategy === this.selectedStrategy);
                    }
                    if (this.selectedRisk !== 'All') {
                        result = result.filter(i => i.risk_level === this.selectedRisk);
                    }
                    this.filteredIdeas = result;
                },
                toggle(key) {
                    this.expanded[key] = !this.expanded[key];
                },
                stratBadge(strat) {
                    const map = {
                        'Breakout': 'bg-purple-500/20 text-purple-400 border border-purple-500/30',
                        'Dip Buy': 'bg-orange-500/20 text-orange-400 border border-orange-500/30',
                        'Momentum': 'bg-blue-500/20 text-blue-400 border border-blue-500/30',
                        'Value': 'bg-green-500/20 text-green-400 border border-green-500/30',
                        'Dividend Capture': 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30',
                        'Mean Reversion': 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30'
                    };
                    return map[strat] || 'bg-slate-500/20 text-slate-400';
                },
                riskBadge(risk) {
                    if (risk === 'Low') return 'bg-green-500/20 text-green-400';
                    if (risk === 'Medium') return 'bg-yellow-500/20 text-yellow-400';
                    return 'bg-red-500/20 text-red-400';
                },
                rangePercent(entry, target) {
                    const entryNum = parseFloat(entry);
                    const targetNum = parseFloat(target);
                    if (entryNum <= 0 || targetNum <= 0) return 0;
                    const diff = ((targetNum - entryNum) / entryNum) * 100;
                    return Math.min(100, Math.max(0, Math.abs(diff) * 8));
                },
                addWatchlist(idea) {
                    alert('Add to watchlist: ' + idea.stock_code + ' (requires login)');
                }
            }
        }
    </script>

    <main class="flex-1 ml-0 lg:ml-60 mt-16 p-6">

            <div class="card p-8 flex flex-col items-center justify-center space-y-4">
                <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-slate-500 dark:text-slate-400">Generating trade ideas...</p>
            </div>
        </template>

        <template x-if="loaded">
            <div class="space-y-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Trade Ideas Generator</h1>
                        <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">AI-powered trade setups using multi-strategy analysis</p>
                    </div>
                    <div class="flex items-center gap-3 flex-wrap">
                        <span class="text-xs text-slate-500 dark:text-slate-400">Strategy:</span>
                        <select x-model="selectedStrategy" @change="filter()"
                                class="bg-white dark:bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                            <template x-for="s in strategies" :key="s">
                                <option :value="s" x-text="s"></option>
                            </template>
                        </select>
                        <span class="text-xs text-slate-500 dark:text-slate-400">Risk:</span>
                        <select x-model="selectedRisk" @change="filter()"
                                class="bg-white dark:bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                            <template x-for="r in riskLevels" :key="r">
                                <option :value="r" x-text="r"></option>
                            </template>
                        </select>
                        <span class="text-xs text-slate-500 font-mono" x-text="filteredIdeas.length + ' ideas'"></span>
                    </div>
                </div>

                <!-- Ideas Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                    <template x-for="(idea, idx) in filteredIdeas" :key="idea.stock_code + '-' + idea.strategy">
                        <div class="card overflow-hidden">
                            <!-- Card Header -->
                            <div class="p-5 pb-3">
                                <div class="flex items-start justify-between mb-2">
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <span class="font-mono font-bold text-lg text-white" x-text="idea.stock_code"></span>
                                            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold" :class="stratBadge(idea.strategy)" x-text="idea.strategy"></span>
                                        </div>
                                        <span class="text-xs text-slate-500 dark:text-slate-400" x-text="idea.name"></span>
                                    </div>
                                    <span class="text-sm font-mono font-bold text-white" x-text="idea.price"></span>
                                </div>
                                <p class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed mt-2" x-text="idea.rationale"></p>
                            </div>

                            <!-- Price Range Bar -->
                            <div class="px-5 py-3 bg-white dark:bg-[#0f172a] border-y border-slate-200 dark:border-slate-700">
                                <div class="flex items-center justify-between text-xs font-mono mb-1.5">
                                    <span class="text-danger">SL: <b x-text="idea.stop_loss"></b></span>
                                    <span class="text-slate-700 dark:text-slate-300">Entry: <b x-text="idea.entry_price"></b></span>
                                    <span class="text-success">TP: <b x-text="idea.target_price"></b></span>
                                </div>
                                <div class="relative h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                                    <div class="absolute left-0 h-full bg-gradient-to-r from-red-500 via-yellow-500 to-green-500"
                                         :style="{ width: rangePercent(idea.entry_price, idea.target_price) + 30 + '%' }"></div>
                                    <div class="absolute top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full border-2 border-blue-500 shadow-md"
                                         style="left: 50%"></div>
                                </div>
                            </div>

                            <!-- Expandable Details -->
                            <div x-show="expanded[idx]" class="px-5 py-3 border-t border-slate-200 dark:border-slate-700 space-y-2">
                                <div class="flex justify-between text-sm">
                                    <span class="text-slate-500 dark:text-slate-400">Timeframe</span>
                                    <span class="text-slate-700 dark:text-slate-300 font-mono" x-text="idea.timeframe"></span>
                                </div>
                                <div class="flex justify-between text-sm">
                                    <span class="text-slate-500 dark:text-slate-400">Risk Level</span>
                                    <span class="px-2 py-0.5 rounded text-[11px] font-semibold" :class="riskBadge(idea.risk_level)" x-text="idea.risk_level"></span>
                                </div>
                            </div>

                            <!-- Actions -->
                            <div class="p-5 pt-3 flex items-center justify-between">
                                <button @click="toggle(idx)"
                                        class="text-xs text-blue-400 hover:text-blue-300 transition-colors font-medium">
                                    <span x-text="expanded[idx] ? 'Less Info' : 'More Info'"></span>
                                </button>
                                <button @click="addWatchlist(idea)"
                                        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                                    Watchlist
                                </button>
                            </div>
                        </div>
                    </template>
                </div>

                <template x-if="filteredIdeas.length === 0">
                    <div class="card p-12 text-center">
                        <div class="text-slate-500 text-lg mb-2">No trade ideas found</div>
                        <p class="text-slate-600 text-sm">Try changing strategy or risk level filters.</p>
                    </div>
                </template>

                <!-- Legend -->
                <div class="card p-6">
                    <h2 class="text-lg font-bold text-white mb-4">Strategy Legend</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                        <div class="flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded bg-purple-500"></span> Breakout</div>
                        <div class="flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded bg-orange-500"></span> Dip Buy</div>
                        <div class="flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded bg-blue-500"></span> Momentum</div>
                        <div class="flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded bg-green-500"></span> Value</div>
                        <div class="flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded bg-cyan-500"></span> Dividend</div>
                        <div class="flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded bg-yellow-500"></span> Mean Rev</div>
                    </div>
                </div>

                <div class="text-center text-xs text-slate-600">
                    <p>Disclaimer: Trade ideas are generated by algorithms for educational purposes only. Not financial advice. Past performance does not guarantee future results.</p>
                </div>
            </div>
        </template>
    </main>

    <div x-show="sidebarOpen" onclick="document.getElementById('sidebar').classList.add('max-md:hidden');document.getElementById('sb-overlay').classList.add('hidden')" class="lg:hidden fixed inset-0 bg-black/50 z-30 backdrop-blur-sm"></div>
<div id="sb-overlay" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm hidden" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div>    <script src="/static/js/app.js" defer></script>
</body>
</html>
