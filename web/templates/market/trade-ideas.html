    <script>
        function tradeIdeas() {
            return {
                sidebarOpen: false,
                ideas: [],
                filteredIdeas: [],
                strategies: ['All', 'Breakout', 'Dip Buy', 'Momentum', 'Value', 'Dividend Capture', 'Mean Reversion'],
                riskLevels: ['All', 'Low', 'Medium', 'High'],
                selectedStrategy: 'All',
                selectedRisk: 'All',
                expanded: {},
                loaded: false,
                async fetch() {
                    try {
                        const resp = await fetch('/api/market/trade-ideas');
                        const data = await resp.json();
                        this.ideas = data.ideas || [];
                        this.filter();
                        this.loaded = true;
                    } catch(e) { this.loaded = true; }
                },
                filter() {
                    let result = this.ideas;
                    if (this.selectedStrategy !== 'All') {
                        result = result.filter(i => i.strategy === this.selectedStrategy);
                    }
                    if (this.selectedRisk !== 'All') {
                        result = result.filter(i => i.risk_level === this.selectedRisk);
                    }
                    this.filteredIdeas = result;
                },
                toggle(key) {
                    this.expanded[key] = !this.expanded[key];
                },
                stratBadge(strat) {
                    const map = {
                        'Breakout': 'bg-purple-500/20 text-purple-400 border border-purple-500/30',
                        'Dip Buy': 'bg-orange-lt text-orange-400 border border-orange-500/30',
                        'Momentum': 'bg-blue-lt text-blue-400 border border-info/30',
                        'Value': 'bg-green-lt text-green-400 border border-green-500/30',
                        'Dividend Capture': 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30',
                        'Mean Reversion': 'bg-yellow-lt text-yellow-400 border border-yellow-500/30'
                    };
                    return map[strat] || 'bg-slate-500/20 text-slate-400';
                },
                riskBadge(risk) {
                    if (risk === 'Low') return 'bg-green-lt text-green-400';
                    if (risk === 'Medium') return 'bg-yellow-lt text-yellow-400';
                    return 'bg-red-lt text-red-400';
                },
                rangePercent(entry, target) {
                    const entryNum = parseFloat(entry);
                    const targetNum = parseFloat(target);
                    if (entryNum <= 0 || targetNum <= 0) return 0;
                    const diff = ((targetNum - entryNum) / entryNum) * 100;
                    return Math.min(100, Math.max(0, Math.abs(diff) * 8));
                },
                addWatchlist(idea) {
                    alert('Add to watchlist: ' + idea.stock_code + ' (requires login)');
                }
            }
        }
    </script>

    <main class="flex-fill ms-0 ml-60 mt-2 p-2">

                <div class="w-16 h-16 border-4 border-primary border-top rounded-pill "></div>
                <p class="text-muted dark:text-slate-400">Generating trade ideas...</p>
            </div>
        </template>

        <template x-if="loaded">
            <div class="vstack gap-4">
                <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-4">
                    <div>
                        <h1 class="fs-1 fw-bold text-white">Trade Ideas Generator</h1>
                        <p class="text-muted dark:text-slate-400 fs-sm mt-1">AI-powered trade setups using multi-strategy analysis</p>
                    </div>
                    <div class="d-flex align-items-center gap-3 flex-wrap">
                        <span class="fs-xs text-muted dark:text-slate-400">Strategy:</span>
                        <select x-model="selectedStrategy" @change="filter()"
                                class="bg-white dark:bg-white border border rounded-2 px-2 py-2 fs-sm text-white  ">
                            <template x-for="s in strategies" :key="s">
                                <option :value="s" x-text="s"></option>
                            </template>
                        </select>
                        <span class="fs-xs text-muted dark:text-slate-400">Risk:</span>
                        <select x-model="selectedRisk" @change="filter()"
                                class="bg-white dark:bg-white border border rounded-2 px-2 py-2 fs-sm text-white  ">
                            <template x-for="r in riskLevels" :key="r">
                                <option :value="r" x-text="r"></option>
                            </template>
                        </select>
                        <span class="fs-xs text-muted font-monospace" x-text="filteredIdeas.length + ' ideas'"></span>
                    </div>
                </div>

                <!-- Ideas Grid -->
                <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 gap-4">
                    <template x-for="(idea, idx) in filteredIdeas" :key="idea.stock_code + '-' + idea.strategy">
                        <div class="card overflow-hidden">
                            <!-- Card Header -->
                            <div class="p-2 pb-2">
                                <div class="d-flex align-items-start justify-content-between mb-2">
                                    <div>
                                        <div class="d-flex align-items-center gap-2">
                                            <span class="font-monospace fw-bold fs-3 text-white" x-text="idea.stock_code"></span>
                                            <span class="px-2 py-0 rounded-pill fs-6 fw-semibold" :class="stratBadge(idea.strategy)" x-text="idea.strategy"></span>
                                        </div>
                                        <span class="fs-xs text-muted dark:text-slate-400" x-text="idea.name"></span>
                                    </div>
                                    <span class="fs-sm font-monospace fw-bold text-white" x-text="idea.price"></span>
                                </div>
                                <p class="fs-sm text-body dark:text-body lh-lg mt-2" x-text="idea.rationale"></p>
                            </div>

                            <!-- Price Range Bar -->
                            <div class="px-2 py-2 bg-white dark:bg-[#0f172a] border-y border dark:border">
                                <div class="d-flex align-items-center justify-content-between fs-xs font-monospace mb-1">
                                    <span class="text-danger">SL: <b x-text="idea.stop_loss"></b></span>
                                    <span class="text-body dark:text-body">Entry: <b x-text="idea.entry_price"></b></span>
                                    <span class="text-success">TP: <b x-text="idea.target_price"></b></span>
                                </div>
                                <div class="position-relative h-2 bg-body dark:bg-secondary-lt rounded-pill overflow-hidden">
                                    <div class="position-absolute start-0 h-100 bg-gradient bg-gradient-from-red  bg-gradient-to-green"
                                         :style="{ width: rangePercent(idea.entry_price, idea.target_price) + 30 + '%' }"></div>
                                    <div class="position-absolute top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-pill border-2 border-primary shadow"
                                         style="left: 50%"></div>
                                </div>
                            </div>

                            <!-- Expandable Details -->
                            <div x-show="expanded[idx]" class="px-2 py-2 border-top border dark:border vstack gap-2">
                                <div class="d-flex justify-content-between fs-sm">
                                    <span class="text-muted dark:text-slate-400">Timeframe</span>
                                    <span class="text-body dark:text-body font-monospace" x-text="idea.timeframe"></span>
                                </div>
                                <div class="d-flex justify-content-between fs-sm">
                                    <span class="text-muted dark:text-slate-400">Risk Level</span>
                                    <span class="px-2 py-0 rounded fs-6 fw-semibold" :class="riskBadge(idea.risk_level)" x-text="idea.risk_level"></span>
                                </div>
                            </div>

                            <!-- Actions -->
                            <div class="p-2 pt-2 d-flex align-items-center justify-content-between">
                                <button @click="toggle(idx)"
                                        class="fs-xs text-primary   fw-medium">
                                    <span x-text="expanded[idx] ? 'Less Info' : 'More Info'"></span>
                                </button>
                                <button @click="addWatchlist(idea)"
                                        class="d-flex align-items-center gap-1 px-2 py-1 rounded-2 fs-xs fw-medium bg-white dark:bg-white text-body dark:text-body  dark:hover:bg-secondary-lt ">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                                    Watchlist
                                </button>
                            </div>
                        </div>
                    </template>
                </div>

                <template x-if="filteredIdeas.length === 0">
                    <div class="card p-2 text-center">
                        <div class="text-muted fs-3 mb-2">No trade ideas found</div>
                        <p class="text-muted fs-sm">Try changing strategy or risk level filters.</p>
                    </div>
                </template>

                <!-- Legend -->
                <div class="card p-2">
                    <h2 class="fs-3 fw-bold text-white mb-2">Strategy Legend</h2>
                    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-6 gap-3">
                        <div class="d-flex align-items-center gap-2 fs-sm"><span class="w-3 h-3 rounded bg-primary"></span> Breakout</div>
                        <div class="d-flex align-items-center gap-2 fs-sm"><span class="w-3 h-3 rounded bg-warning"></span> Dip Buy</div>
                        <div class="d-flex align-items-center gap-2 fs-sm"><span class="w-3 h-3 rounded bg-primary"></span> Momentum</div>
                        <div class="d-flex align-items-center gap-2 fs-sm"><span class="w-3 h-3 rounded bg-success"></span> Value</div>
                        <div class="d-flex align-items-center gap-2 fs-sm"><span class="w-3 h-3 rounded bg-info"></span> Dividend</div>
                        <div class="d-flex align-items-center gap-2 fs-sm"><span class="w-3 h-3 rounded bg-warning"></span> Mean Rev</div>
                    </div>
                </div>

                <div class="text-center fs-xs text-muted">
                    <p>Disclaimer: Trade ideas are generated by algorithms for educational purposes only. Not financial advice. Past performance does not guarantee future results.</p>
                </div>
            </div>
        </template>
    </main>

    <div x-show="sidebarOpen" onclick="document.getElementById('sidebar').classList.add('max-md:hidden');document.getElementById('sb-overlay').classList.add('hidden')" class="d-lg-none position-fixed top-0 bottom-0 start-0 end-0 bg-black bg-opacity-50 z-2 "></div>
<div id="sb-overlay" class="position-fixed top-0 bottom-0 start-0 end-0 z-2 bg-black bg-opacity-50  d-none" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div>    <script src="/static/js/app.js" defer></script>
</body>
</html>
