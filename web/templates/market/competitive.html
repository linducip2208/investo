    (function(){try{var p=localStorage.getItem('investo-theme')||'light';
    var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(d)document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-bs-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();

    <style>
        *{scrollbar-width:thin;scrollbar-color:#334155 #0b1120}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0b1120}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid rgba(51,65,85,.5);border-radius:14px;transition:all .2s}
        .card:hover{border-color:#475569}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:500;transition:all .15s;text-decoration:none}
        .sidebar-link:hover{background:#1e293b;color:#e2e8f0}
        .sidebar-link.active{background:#1e3a8a;color:#93c5fd;font-weight:600}
        .sidebar-link .icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:16px}
        .text-success{color:#34d399}.text-danger{color:#f87171}.text-warning{color:#fbbf24}
        .rank-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
        @media(max-width:1024px){.sidebar{display:none}.sidebar.open{display:flex}}
        @media(max-width:640px){.card{padding:12px!important}}
    </style>
<style data-investo-compat>
    body{background:var(--ui-bg)!important;color:var(--ui-text)!important}
    .card{background:var(--ui-surface)!important;border-color:var(--ui-border)!important;color:var(--ui-text)!important}
    .text-success{color:var(--ui-success)!important}.text-danger{color:var(--ui-danger)!important}
    .widget-title{color:var(--ui-muted)!important}
    </style>
</head>
<body class="h-100 d-flex" x-data="competitive()" x-init="fetch()">
    <script>
        function competitive() {
            return {
                sidebarOpen: false,
                sectors: [],
                selectedSector: '',
                companies: [],
                loaded: false,
                async fetch() {
                    try {
                        const resp = await fetch('/api/market/competitive');
                        const data = await resp.json();
                        this.sectors = data.sectors || [];
                        if (this.sectors.length > 0) {
                            this.selectedSector = this.sectors[0].name;
                            await this.loadSector();
                        }
                        this.loaded = true;
                    } catch(e) { this.loaded = true; }
                },
                async loadSector() {
                    try {
                        const resp = await fetch('/api/market/competitive?sector=' + encodeURIComponent(this.selectedSector));
                        const data = await resp.json();
                        this.companies = data.companies || [];
                    } catch(e) { this.companies = []; }
                },
                rankColor(rank) {
                    if (rank === 1) return 'bg-yellow text-yellow-900';
                    if (rank === 2) return 'bg-slate-400 text-slate-900';
                    if (rank === 3) return 'bg-amber-600 text-amber-100';
                    return 'bg-secondary-lt text-body';
                },
                shareBar(pct) {
                    if (pct > 25) return 'bg-blue';
                    if (pct > 10) return 'bg-blue-400';
                    if (pct > 5) return 'bg-blue-300';
                    return 'bg-slate-500';
                }
            }
        }
    </script>

    <header class="position-fixed top-0 end-0 start-0 left-60 h-16 bg-body bg-opacity-100 dark:bg-[#0b1120]/90  border-bottom border dark:border-slate-800 z-2 d-flex align-items-center justify-content-between px-2">
        <button onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');document.getElementById('sb-overlay').classList.toggle('hidden')" class="d-lg-none p-2 text-muted dark:text-muted  ">

        </button>
        <div class="fs-sm text-muted dark:text-muted"><span class="text-muted">Supply Chain /</span> Competitive Landscape</div>
        <div class="d-flex align-items-center gap-3">
            [[if .User]]
            <a href="/profil" class="d-flex align-items-center gap-2 fs-sm text-body dark:text-body  ">
                <span class="w-8 h-8 bg-primary rounded-pill d-flex align-items-center justify-content-center fs-xs fw-bold text-white">[[slice .User.Name 0 1]]</span>
            </a>
            [[end]]
        </div>
    </header>

    <main class="flex-fill ms-0 ml-60 mt-2 p-2">
        <template x-if="!loaded">
            <div class="card p-2 d-flex flex-column align-items-center justify-content-center vstack gap-3">
                <div class="w-16 h-16 border-4 border-primary border-top rounded-pill "></div>
                <p class="text-muted dark:text-muted">Loading competitive landscape...</p>
            </div>
        </template>

        <template x-if="loaded">
            <div class="vstack gap-4">
                <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-4">
                    <div>
                        <h1 class="fs-1 fw-bold text-white">Competitive Landscape</h1>
                        <p class="text-muted dark:text-muted fs-sm mt-1">Porter's Five Forces analysis for IDX sectors</p>
                    </div>
                    <select x-model="selectedSector" @change="loadSector()"
                            class="bg-white dark:bg-white border border rounded-2 px-2 py-2 fs-sm text-white  ">
                        <template x-for="s in sectors" :key="s.name">
                            <option :value="s.name" x-text="s.name + ' (' + s.count + ' stocks)'"></option>
                        </template>
                    </select>
                </div>

                <template x-if="companies.length > 0">
                    <div class="vstack gap-3">
                        <template x-for="(c, idx) in companies" :key="c.code">
                            <div class="card p-2">
                                <div class="d-flex align-items-start gap-4">
                                    <div class="rank-badge flex-shrink-0" :class="rankColor(idx + 1)" x-text="idx + 1"></div>
                                    <div class="flex-fill">
                                        <div class="d-flex align-items-center gap-3 mb-2">
                                            <span class="font-monospace fw-bold text-white fs-3" x-text="c.code"></span>
                                            <span class="text-body dark:text-body" x-text="c.name"></span>
                                        </div>
                                        <div class="row row-cols-2 row-cols-md-4 gap-3 fs-sm mb-2">
                                            <div>
                                                <div class="fs-6 text-muted text-uppercase">Market Share</div>
                                                <div class="d-flex align-items-center gap-2">
                                                    <span class="font-monospace fw-semibold text-primary" x-text="c.market_share.toFixed(1) + '%'"></span>
                                                    <div class="flex-fill h-1.5 bg-body dark:bg-secondary-lt rounded-pill overflow-hidden">
                                                        <div class="h-100 rounded-pill" :class="shareBar(c.market_share)" :style="{ width: Math.min(100, c.market_share * 3) + '%' }"></div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div>
                                                <div class="fs-6 text-muted text-uppercase">Revenue Growth</div>
                                                <span class="font-monospace" :class="c.revenue_growth > 0 ? 'text-success' : 'text-danger'" x-text="c.revenue_growth.toFixed(1) + '%'"></span>
                                            </div>
                                            <div>
                                                <div class="fs-6 text-muted text-uppercase">Porter Rivalry</div>
                                                <span class="font-monospace text-body dark:text-body" x-text="c.rivalry + '/10'"></span>
                                            </div>
                                            <div>
                                                <div class="fs-6 text-muted text-uppercase">Barrier to Entry</div>
                                                <span class="font-monospace text-body dark:text-body" x-text="c.barrier + '/10'"></span>
                                            </div>
                                        </div>
                                        <div class="border-top border dark:border pt-2">
                                            <div class="fs-6 text-muted text-uppercase mb-1">Key Differentiator</div>
                                            <span class="fs-xs text-muted dark:text-muted" x-text="c.differentiator"></span>
                                        </div>
                                        <div class="mt-2 bg-white bg-opacity-50 dark:bg-white/50 rounded-2 p-2">
                                            <div class="fs-6 text-muted text-uppercase mb-2">Porter's Five Forces Summary</div>
                                            <div class="row row-cols-2 row-cols-md-5 gap-2 fs-6">
                                                <div class="text-center">
                                                    <div class="fw-semibold" :class="c.supplier_power > 6 ? 'text-danger' : 'text-success'" x-text="'Supplier: ' + c.supplier_power + '/10'"></div>
                                                </div>
                                                <div class="text-center">
                                                    <div class="fw-semibold" :class="c.buyer_power > 6 ? 'text-danger' : 'text-success'" x-text="'Buyer: ' + c.buyer_power + '/10'"></div>
                                                </div>
                                                <div class="text-center">
                                                    <div class="fw-semibold" :class="c.rivalry > 6 ? 'text-danger' : 'text-success'" x-text="'Rivalry: ' + c.rivalry + '/10'"></div>
                                                </div>
                                                <div class="text-center">
                                                    <div class="fw-semibold" :class="c.barrier < 5 ? 'text-danger' : 'text-success'" x-text="'Entry: ' + c.barrier + '/10'"></div>
                                                </div>
                                                <div class="text-center">
                                                    <div class="fw-semibold" :class="c.substitute > 6 ? 'text-danger' : 'text-success'" x-text="'Sub: ' + c.substitute + '/10'"></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="companies.length === 0">
                    <div class="card p-2 text-center text-muted">Select a sector to view competitive landscape.</div>
                </template>
            </div>
        </template>
    </main>

    <div x-show="sidebarOpen" onclick="document.getElementById('sidebar').classList.add('max-md:hidden');document.getElementById('sb-overlay').classList.add('hidden')" class="d-lg-none position-fixed top-0 bottom-0 start-0 end-0 bg-black bg-opacity-50 z-2 "></div>
<div id="sb-overlay" class="position-fixed top-0 bottom-0 start-0 end-0 z-2 bg-black bg-opacity-50  d-none" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div>    <script src="/static/js/app.js" defer></script>
</body>
</html>
