<!DOCTYPE html>

<head>

    <script data-investo-assets>
    (function(){try{var p=localStorage.getItem('investo-theme')||'light';
    var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(d)document.documentElement.classList.add('dark');}catch(e){}})();
    </script>
    <script defer src="/static/js/vendor/alpine.min.js"></script>
    <style>
        *{scrollbar-width:thin;scrollbar-color:#334155 #0b1120}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0b1120}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid rgba(51,65,85,.5);border-radius:14px;transition:all .2s}
        .card:hover{border-color:#475569}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:500;transition:all .15s;text-decoration:none}
        .sidebar-link:hover{background:#1e293b;color:#e2e8f0}
        .sidebar-link.active{background:#1e3a8a;color:#93c5fd;font-weight:600}
        .sidebar-link .icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:16px}
        .text-success{color:#34d399}.text-danger{color:#f87171}.text-warning{color:#fbbf24}
        .rank-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
        @media(max-width:1024px){.sidebar{display:none}.sidebar.open{display:flex}}
        @media(max-width:640px){.card{padding:12px!important}}
    </style>
<style data-investo-compat>
    body{background:var(--ui-bg)!important;color:var(--ui-text)!important}
    .card{background:var(--ui-surface)!important;border-color:var(--ui-border)!important;color:var(--ui-text)!important}
    .text-success{color:var(--ui-success)!important}.text-danger{color:var(--ui-danger)!important}
    .widget-title{color:var(--ui-muted)!important}
    </style>
</head>
<body class="h-full flex" x-data="competitive()" x-init="fetch()">
    <script>
        function competitive() {
            return {
                sidebarOpen: false,
                sectors: [],
                selectedSector: '',
                companies: [],
                loaded: false,
                async fetch() {
                    try {
                        const resp = await fetch('/api/market/competitive');
                        const data = await resp.json();
                        this.sectors = data.sectors || [];
                        if (this.sectors.length > 0) {
                            this.selectedSector = this.sectors[0].name;
                            await this.loadSector();
                        }
                        this.loaded = true;
                    } catch(e) { this.loaded = true; }
                },
                async loadSector() {
                    try {
                        const resp = await fetch('/api/market/competitive?sector=' + encodeURIComponent(this.selectedSector));
                        const data = await resp.json();
                        this.companies = data.companies || [];
                    } catch(e) { this.companies = []; }
                },
                rankColor(rank) {
                    if (rank === 1) return 'bg-yellow-500 text-yellow-900';
                    if (rank === 2) return 'bg-slate-400 text-slate-900';
                    if (rank === 3) return 'bg-amber-600 text-amber-100';
                    return 'bg-slate-700 text-slate-300';
                },
                shareBar(pct) {
                    if (pct > 25) return 'bg-blue-500';
                    if (pct > 10) return 'bg-blue-400';
                    if (pct > 5) return 'bg-blue-300';
                    return 'bg-slate-500';
                }
            }
        }
    </script>

    <header class="fixed top-0 right-0 left-0 lg:left-60 h-16 bg-[#f4f6fb]/90 dark:bg-[#0b1120]/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 z-40 flex items-center justify-between px-6">
        <button onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');document.getElementById('sb-overlay').classList.toggle('hidden')" class="lg:hidden p-2 text-slate-500 dark:text-slate-400 hover:text-white transition-colors">

        </button>
        <div class="text-sm text-slate-500 dark:text-slate-400"><span class="text-slate-600">Supply Chain /</span> Competitive Landscape</div>
        <div class="flex items-center gap-3">
            [[if .User]]
            <a href="/profil" class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300 hover:text-white transition-colors">
                <span class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-xs font-bold text-white">[[slice .User.Name 0 1]]</span>
            </a>
            [[end]]
        </div>
    </header>

    <main class="flex-1 ml-0 lg:ml-60 mt-16 p-6">
        <template x-if="!loaded">
            <div class="card p-8 flex flex-col items-center justify-center space-y-4">
                <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-slate-500 dark:text-slate-400">Loading competitive landscape...</p>
            </div>
        </template>

        <template x-if="loaded">
            <div class="space-y-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Competitive Landscape</h1>
                        <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Porter's Five Forces analysis for IDX sectors</p>
                    </div>
                    <select x-model="selectedSector" @change="loadSector()"
                            class="bg-white dark:bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                        <template x-for="s in sectors" :key="s.name">
                            <option :value="s.name" x-text="s.name + ' (' + s.count + ' stocks)'"></option>
                        </template>
                    </select>
                </div>

                <template x-if="companies.length > 0">
                    <div class="space-y-4">
                        <template x-for="(c, idx) in companies" :key="c.code">
                            <div class="card p-5">
                                <div class="flex items-start gap-4">
                                    <div class="rank-badge flex-shrink-0" :class="rankColor(idx + 1)" x-text="idx + 1"></div>
                                    <div class="flex-1">
                                        <div class="flex items-center gap-3 mb-2">
                                            <span class="font-mono font-bold text-white text-lg" x-text="c.code"></span>
                                            <span class="text-slate-700 dark:text-slate-300" x-text="c.name"></span>
                                        </div>
                                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm mb-3">
                                            <div>
                                                <div class="text-[10px] text-slate-500 uppercase">Market Share</div>
                                                <div class="flex items-center gap-2">
                                                    <span class="font-mono font-semibold text-blue-400" x-text="c.market_share.toFixed(1) + '%'"></span>
                                                    <div class="flex-1 h-1.5 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                                                        <div class="h-full rounded-full" :class="shareBar(c.market_share)" :style="{ width: Math.min(100, c.market_share * 3) + '%' }"></div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div>
                                                <div class="text-[10px] text-slate-500 uppercase">Revenue Growth</div>
                                                <span class="font-mono" :class="c.revenue_growth > 0 ? 'text-green-400' : 'text-red-400'" x-text="c.revenue_growth.toFixed(1) + '%'"></span>
                                            </div>
                                            <div>
                                                <div class="text-[10px] text-slate-500 uppercase">Porter Rivalry</div>
                                                <span class="font-mono text-slate-700 dark:text-slate-300" x-text="c.rivalry + '/10'"></span>
                                            </div>
                                            <div>
                                                <div class="text-[10px] text-slate-500 uppercase">Barrier to Entry</div>
                                                <span class="font-mono text-slate-700 dark:text-slate-300" x-text="c.barrier + '/10'"></span>
                                            </div>
                                        </div>
                                        <div class="border-t border-slate-200 dark:border-slate-700 pt-3">
                                            <div class="text-[10px] text-slate-500 uppercase mb-1">Key Differentiator</div>
                                            <span class="text-xs text-slate-500 dark:text-slate-400" x-text="c.differentiator"></span>
                                        </div>
                                        <div class="mt-3 bg-white/50 dark:bg-slate-800/50 rounded-lg p-3">
                                            <div class="text-[10px] text-slate-500 uppercase mb-2">Porter's Five Forces Summary</div>
                                            <div class="grid grid-cols-2 md:grid-cols-5 gap-2 text-[10px]">
                                                <div class="text-center">
                                                    <div class="font-semibold" :class="c.supplier_power > 6 ? 'text-red-400' : 'text-green-400'" x-text="'Supplier: ' + c.supplier_power + '/10'"></div>
                                                </div>
                                                <div class="text-center">
                                                    <div class="font-semibold" :class="c.buyer_power > 6 ? 'text-red-400' : 'text-green-400'" x-text="'Buyer: ' + c.buyer_power + '/10'"></div>
                                                </div>
                                                <div class="text-center">
                                                    <div class="font-semibold" :class="c.rivalry > 6 ? 'text-red-400' : 'text-green-400'" x-text="'Rivalry: ' + c.rivalry + '/10'"></div>
                                                </div>
                                                <div class="text-center">
                                                    <div class="font-semibold" :class="c.barrier < 5 ? 'text-red-400' : 'text-green-400'" x-text="'Entry: ' + c.barrier + '/10'"></div>
                                                </div>
                                                <div class="text-center">
                                                    <div class="font-semibold" :class="c.substitute > 6 ? 'text-red-400' : 'text-green-400'" x-text="'Sub: ' + c.substitute + '/10'"></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="companies.length === 0">
                    <div class="card p-12 text-center text-slate-500">Select a sector to view competitive landscape.</div>
                </template>
            </div>
        </template>
    </main>

    <div x-show="sidebarOpen" onclick="document.getElementById('sidebar').classList.add('max-md:hidden');document.getElementById('sb-overlay').classList.add('hidden')" class="lg:hidden fixed inset-0 bg-black/50 z-30 backdrop-blur-sm"></div>
<div id="sb-overlay" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm hidden" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div>    <script src="/static/js/app.js" defer></script>
</body>
</html>
