<!DOCTYPE html>
<html lang="id" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sector Health Index · Investo</title>
    <link rel="stylesheet" href="/static/css/vendor/tabler.css">
    <link rel="stylesheet" href="/static/css/legacy-compat.css">
    <link rel="stylesheet" href="/static/css/fintech.css">
    <script data-investo-assets>
    (function(){try{var p=localStorage.getItem('investo-theme')||'light';
    var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(d)document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-bs-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();
    </script>
    <script defer src="/static/js/vendor/alpine.min.js"></script>
    <style>
        *{scrollbar-width:thin;scrollbar-color:#334155 #0b1120}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0b1120}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid rgba(51,65,85,.5);border-radius:14px;transition:all .2s}
        .card:hover{border-color:#475569}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:500;transition:all .15s;text-decoration:none}
        .sidebar-link:hover{background:#1e293b;color:#e2e8f0}
        .sidebar-link.active{background:#1e3a8a;color:#93c5fd;font-weight:600}
        .text-success{color:#34d399}.text-danger{color:#f87171}.text-warning{color:#f59e0b}
        @media(max-width:1024px){.sidebar{display:none}.sidebar.open{display:flex}}
        @media(max-width:640px){.card{padding:12px!important}.stat-value{font-size:20px!important}}
    </style>
<style data-investo-compat>
    body{background:var(--ui-bg)!important;color:var(--ui-text)!important}
    .card{background:var(--ui-surface)!important;border-color:var(--ui-border)!important;color:var(--ui-text)!important}
    .text-success{color:var(--ui-success)!important}.text-danger{color:var(--ui-danger)!important}
    .widget-title{color:var(--ui-muted)!important}
    </style>
</head>
<body class="h-100 d-flex" x-data="sectorHealth()" x-init="init()">
    <script>
    function sectorHealth() {
        return {
            sidebarOpen: false, sectors: [], loading: true,
            async init() { await this.fetch(); },
            async fetch() { this.loading = true; try { var r = await fetch('/api/market/sector-health'); var d = await r.json(); this.sectors = d.sectors || []; } catch(e) {} this.loading = false; },
            gaugeColor(s) { if (s >= 70) return '#34d399'; if (s >= 40) return '#f59e0b'; return '#f87171'; },
            gaugeBg(s) { if (s >= 70) return '#064e3b'; if (s >= 40) return '#78350f'; return '#7f1d1d'; },
            fmt(v) { return v ? 'Rp ' + Math.round(v).toLocaleString('id-ID') : '-'; }
        }
    }
    </script>

    <!-- SIDEBAR -->
    <aside class="sidebar position-fixed top-0 bottom-0 start-0 z-3 w-60 bg-body dark:bg-[#0b1120] border-end border dark:border-slate-800 d-flex flex-column" class="d-none d-md-block">
        <div class="d-flex align-items-center gap-3 px-2 h-16 border-bottom border dark:border-slate-800">
            <div class="w-8 h-8 rounded-2 bg-gradient bg-gradient-from-blue bg-gradient-to-blue d-flex align-items-center justify-content-center fw-bold text-white fs-sm">I</div>
            <span class="fw-bold fs-3 text-white">Investo</span>
        </div>
        <nav class="flex-fill overflow-y-auto px-2 py-2 vstack gap-1">
            <a href="/dashboard" class="sidebar-link"><span>📊</span> Dashboard</a>
            <a href="/saham" class="sidebar-link"><span>📈</span> Saham IDX</a>
            <a href="/forex" class="sidebar-link"><span>💱</span> Forex</a>
            <a href="/screener" class="sidebar-link"><span>🔍</span> Screener</a>
            <a href="/market/heatmap" class="sidebar-link"><span>🗺️</span> Heatmap</a>
            <a href="/market/recap" class="sidebar-link"><span>📋</span> Market Recap</a>
            <a href="/market/sector-health" class="sidebar-link active"><span>💚</span> Sector Health</a>
            <a href="/market/waran" class="sidebar-link"><span>🎫</span> Waran Tracker</a>
            <a href="/market/economic-calendar" class="sidebar-link"><span>📅</span> Economic Calendar</a>
            <a href="/calculators" class="sidebar-link"><span>🧮</span> Kalkulator</a>
            <div class="border-top border dark:border-slate-800 my-2"></div>
            <a href="/ideas" class="sidebar-link"><span>💡</span> Ideas</a>
            <a href="/leaderboard" class="sidebar-link"><span>🏆</span> Leaderboard</a>
            <a href="/blog" class="sidebar-link"><span>📝</span> Blog</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <div class="flex-fill ml-60 min-vh-100 d-flex flex-column">
        <!-- TOPBAR -->
        <header class="position-sticky top-0 z-2 h-16 bg-body bg-opacity-100 dark:bg-[#0b1120]/90  border-bottom border dark:border-slate-800 d-flex align-items-center px-2 px-lg-5 gap-4">
            <button onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');document.getElementById('sb-overlay').classList.toggle('hidden')" class="d-lg-none p-2 text-muted dark:text-muted "><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
            <div class="flex-fill">
                <h1 class="fs-3 fw-bold text-white">Sector Health Index</h1>
            </div>
            [[template "components/market-clock.html" .]]
        </header>

        <main class="flex-fill p-2 p-lg-4 overflow-y-auto">
            <div x-show="loading" class="text-center py-2 text-muted">Memuat data sektor...</div>
            <div x-show="!loading" class="row row-cols-1 row-cols-md-2 gap-4">
                <template x-for="(sec, idx) in sectors" :key="idx">
                    <div class="card p-2">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <div>
                                <a :href="'/best-saham-' + sec.sector_slug" class="fs-base fw-bold text-white  " x-text="sec.sector_name"></a>
                                <div class="fs-xs text-muted mt-0" x-text="sec.stock_count + ' saham'"></div>
                            </div>
                            <div class="text-end">
                                <div class="fs-1 fw-bold font-monospace" :style="'color:'+gaugeColor(sec.health_score)" x-text="sec.health_score"></div>
                                <div class="fs-6 text-uppercase fw-semibold" :class="{'text-success': sec.health_score>=70, 'text-warning': sec.health_score>=40 && sec.health_score<70, 'text-danger': sec.health_score<40}">/100</div>
                            </div>
                        </div>
                        <div class="w-100 bg-body bg-opacity-50 dark:bg-secondary-lt rounded-pill h-2.5 mb-2">
                            <div class="h-2.5 rounded-pill  " :style="'width:'+sec.health_score+'%;background:'+gaugeColor(sec.health_score)"></div>
                        </div>
                        <div class="row row-cols-3 gap-3 text-center">
                            <div>
                                <div class="fs-6 text-muted text-uppercase  mb-1">PER Avg</div>
                                <div class="fs-sm font-monospace text-white" x-text="sec.per_avg + 'x'"></div>
                            </div>
                            <div>
                                <div class="fs-6 text-muted text-uppercase  mb-1">PBV Avg</div>
                                <div class="fs-sm font-monospace text-white" x-text="sec.pbv_avg + 'x'"></div>
                            </div>
                            <div>
                                <div class="fs-6 text-muted text-uppercase  mb-1">ROE Avg</div>
                                <div class="fs-sm font-monospace text-white" x-text="sec.roe_avg + '%'"></div>
                            </div>
                        </div>
                        <div class="row row-cols-2 gap-2 mt-2 pt-2 border-top border dark:border/50 text-center">
                            <div>
                                <div class="fs-6 text-muted text-uppercase  mb-0">Momentum</div>
                                <div class="fs-xs font-monospace" :class="sec.momentum_score>=50?'text-success':'text-warning'" x-text="sec.momentum_score"></div>
                            </div>
                            <div>
                                <div class="fs-6 text-muted text-uppercase  mb-0">Foreign Flow</div>
                                <div class="fs-xs font-monospace" :class="sec.foreign_flow_score>=50?'text-success':'text-warning'" x-text="sec.foreign_flow_score"></div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
            <div x-show="!loading && sectors.length === 0" class="text-center py-2 text-muted">
                <p class="fs-3">Belum ada data sektor</p>
            </div>
        </main>
    </div>
<div id="sb-overlay" class="position-fixed top-0 bottom-0 start-0 end-0 z-2 bg-black bg-opacity-50  d-none" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div>    <script src="/static/js/app.js" defer></script>
</body>
</html>
