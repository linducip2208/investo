<!DOCTYPE html>
<html lang="id" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[.Title]]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        *{scrollbar-width:thin;scrollbar-color:#334155 #0b1120}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0b1120}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid rgba(51,65,85,.5);border-radius:14px;transition:all .2s}
        .card:hover{border-color:#475569}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:500;transition:all .15s;text-decoration:none}
        .sidebar-link:hover{background:#1e293b;color:#e2e8f0}
        .sidebar-link.active{background:#1e3a8a;color:#93c5fd;font-weight:600}
        .sidebar-link .icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:16px}
        .text-success{color:#34d399}.text-danger{color:#f87171}.text-warning{color:#fbbf24}
        canvas{border-radius:12px}
        .chain-node{cursor:pointer;transition:all .2s}
        .chain-node:hover{transform:scale(1.05)}
        .chain-node.highlighted{filter:drop-shadow(0 0 8px rgba(59,130,246,.6))}
        .rel-chip{padding:2px 10px;border-radius:20px;font-size:10px;font-weight:600}
        @media(max-width:1024px){.sidebar{display:none}.sidebar.open{display:flex}}
        @media(max-width:640px){.card{padding:12px!important}}
    </style>
</head>
<body class="h-full flex" x-data="supplyChain()" x-init="fetch()">
    <script>
        function supplyChain() {
            return {
                sidebarOpen: false,
                links: [],
                nodes: [],
                selectedNode: null,
                highlightedLinks: [],
                loaded: false,
                stockCodes: [],
                selectedStock: '',
                async fetch() {
                    try {
                        const resp = await fetch('/api/market/supply-chain');
                        const data = await resp.json();
                        this.links = data.links || [];
                        this.buildNodes();
                        this.loaded = true;
                    } catch(e) { this.loaded = true; }
                },
                buildNodes() {
                    const nodeMap = {};
                    this.links.forEach(l => {
                        if (!nodeMap[l.from]) nodeMap[l.from] = { code: l.from, name: l.from_name || l.from };
                        if (!nodeMap[l.to]) nodeMap[l.to] = { code: l.to, name: l.to_name || l.to };
                    });
                    this.nodes = Object.values(nodeMap).sort((a,b) => a.code.localeCompare(b.code));
                    this.stockCodes = this.nodes.map(n => n.code);
                },
                selectNode(code) {
                    this.selectedNode = code;
                    this.highlightedLinks = this.links.filter(l => l.from === code || l.to === code);
                },
                clearSelection() {
                    this.selectedNode = null;
                    this.highlightedLinks = [];
                },
                isHighlighted(link) {
                    if (!this.selectedNode) return true;
                    return link.from === this.selectedNode || link.to === this.selectedNode;
                },
                relColor(rel) {
                    if (rel === 'creditor') return 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30';
                    if (rel === 'supplier') return 'bg-blue-500/20 text-blue-400 border border-blue-500/30';
                    if (rel === 'customer') return 'bg-green-500/20 text-green-400 border border-green-500/30';
                    return 'bg-slate-500/20 text-slate-400 border border-slate-500/30';
                },
                strengthBar(s) {
                    if (s > 90) return 'bg-green-500';
                    if (s > 70) return 'bg-yellow-500';
                    return 'bg-slate-500';
                }
            }
        }
    </script>

    <aside class="sidebar fixed inset-y-0 left-0 z-50 w-60 bg-[#0b1120] border-r border-slate-800 flex flex-col" :class="{ 'open': sidebarOpen }">
        <div class="flex items-center gap-3 px-5 h-16 border-b border-slate-800">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center font-bold text-white text-sm">I</div>
            <span class="font-bold text-lg text-white">Investo</span>
        </div>
        <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
            <a href="/dashboard" class="sidebar-link"><span class="icon">📊</span> Dashboard</a>
            <a href="/saham" class="sidebar-link"><span class="icon">📈</span> Saham IDX</a>
            <div class="border-t border-slate-800 my-2"></div>
            <p class="px-4 text-[10px] font-semibold text-slate-600 uppercase tracking-widest mb-1">Quantitative Research</p>
            <a href="/market/factor-exposure" class="sidebar-link"><span class="icon">📐</span> Factor Exposure</a>
            <a href="/market/factor-timing" class="sidebar-link"><span class="icon">⏱️</span> Factor Timing</a>
            <a href="/market/smart-beta" class="sidebar-link"><span class="icon">🧬</span> Smart Beta</a>
            <div class="border-t border-slate-800 my-2"></div>
            <p class="px-4 text-[10px] font-semibold text-slate-600 uppercase tracking-widest mb-1">Supply Chain</p>
            <a href="/market/supply-chain" class="sidebar-link active"><span class="icon">🔗</span> Supply Chain</a>
            <a href="/market/industry-lifecycle" class="sidebar-link"><span class="icon">🌱</span> Industry Lifecycle</a>
            <a href="/market/competitive" class="sidebar-link"><span class="icon">🏆</span> Competitive</a>
            <div class="border-t border-slate-800 my-2"></div>
            <a href="/dashboard/portfolios" class="sidebar-link"><span class="icon">💼</span> Portofolio</a>
        </nav>
        <div class="p-3 border-t border-slate-800">
            <a href="/pengaturan" class="sidebar-link"><span class="icon">⚙️</span> Pengaturan</a>
        </div>
    </aside>

    <header class="fixed top-0 right-0 left-0 lg:left-60 h-16 bg-[#0b1120]/90 backdrop-blur-md border-b border-slate-800 z-40 flex items-center justify-between px-6">
        <button @click="sidebarOpen=!sidebarOpen" class="lg:hidden p-2 text-slate-400 hover:text-white transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="text-sm text-slate-400"><span class="text-slate-600">Supply Chain /</span> Supply Chain Mapper</div>
        <div class="flex items-center gap-3">
            [[if .User]]
            <a href="/profil" class="flex items-center gap-2 text-sm text-slate-300 hover:text-white transition-colors">
                <span class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-xs font-bold text-white">[[slice .User.Name 0 1]]</span>
            </a>
            [[end]]
        </div>
    </header>

    <main class="flex-1 ml-0 lg:ml-60 mt-16 p-6">
        <template x-if="!loaded">
            <div class="card p-8 flex flex-col items-center justify-center space-y-4">
                <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-slate-400">Loading supply chain data...</p>
            </div>
        </template>

        <template x-if="loaded">
            <div class="space-y-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Supply Chain Mapper</h1>
                        <p class="text-slate-400 text-sm mt-1">Inter-company relationships: suppliers, customers, and creditors</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <select x-model="selectedStock" @change="if(selectedStock) selectNode(selectedStock); else clearSelection()"
                                class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                            <option value="">All Companies</option>
                            <template x-for="code in stockCodes" :key="code">
                                <option :value="code" x-text="code"></option>
                            </template>
                        </select>
                        <button x-show="selectedNode" @click="clearSelection(); selectedStock=''"
                                class="text-xs text-blue-400 hover:text-blue-300 transition-colors">Clear</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                    <template x-for="n in nodes" :key="n.code">
                        <div class="card p-4 cursor-pointer chain-node transition-all"
                             :class="{ 'border-blue-500 bg-blue-500/5': selectedNode === n.code, 'opacity-50': selectedNode && selectedNode !== n.code }"
                             @click="selectNode(n.code); selectedStock=n.code">
                            <div class="flex items-center justify-between mb-2">
                                <span class="font-mono font-bold text-white text-sm" x-text="n.code"></span>
                                <span class="text-xs text-slate-500" x-text="links.filter(l=>l.from===n.code || l.to===n.code).length + ' links'"></span>
                            </div>
                            <div class="text-xs text-slate-400" x-text="n.name"></div>
                        </div>
                    </template>
                </div>

                <h2 class="text-lg font-bold text-white" x-show="selectedNode">
                    <span x-text="selectedNode ? 'Connections for ' + selectedNode : 'All Supply Chain Links'"></span>
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <template x-for="link in highlightedLinks.length > 0 ? highlightedLinks : links" :key="link.from + '-' + link.to">
                        <div class="card p-4" :class="{ 'opacity-40': selectedNode && !isHighlighted(link) }">
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center gap-2 text-sm">
                                    <span class="font-mono font-bold text-white" x-text="link.from"></span>
                                    <svg class="w-4 h-4 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                                    <span class="font-mono font-bold text-white" x-text="link.to"></span>
                                </div>
                                <span class="rel-chip" :class="relColor(link.relationship)" x-text="link.relationship"></span>
                            </div>
                            <p class="text-xs text-slate-400 mb-2" x-text="link.description"></p>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] text-slate-500 uppercase">Strength</span>
                                <div class="flex-1 h-1.5 bg-slate-700 rounded-full overflow-hidden">
                                    <div class="h-full rounded-full" :class="strengthBar(link.strength)" :style="{ width: link.strength + '%' }"></div>
                                </div>
                                <span class="text-xs font-mono text-slate-400" x-text="link.strength"></span>
                            </div>
                        </div>
                    </template>
                </div>

                <template x-if="links.length === 0">
                    <div class="card p-12 text-center text-slate-500">No supply chain data available.</div>
                </template>
            </div>
        </template>
    </main>

    <div x-show="sidebarOpen" @click="sidebarOpen=false" x-cloak class="lg:hidden fixed inset-0 bg-black/50 z-30 backdrop-blur-sm"></div>
</body>
</html>
