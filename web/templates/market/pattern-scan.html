    <script>
        function patternScan() {
            return {
                sidebarOpen: false, timeframe: '1D', scans: [], loading: false, lastScanned: null, sortKey: 'reliability', sortAsc: false, clock: '',
                init() { this.updateClock(); setInterval(() => this.updateClock(), 1000); },
                updateClock() {
                    var d = new Date();
                    this.clock = d.toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'Asia/Jakarta'}) + ' WIB · ' + d.toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Jakarta'});
                },
                doScan() {
                    var self = this; this.loading = true;
                    fetch('/api/market/pattern-scan?timeframe=' + this.timeframe)
                        .then(function(r) { return r.json(); })
                        .then(function(data) {
                            self.scans = Array.isArray(data) ? data : [];
                            self.lastScanned = new Date().toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
                            self.loading = false;
                        })
                        .catch(function(err) { console.error(err); self.loading = false; });
                },
                get sortedScans() {
                    var key = this.sortKey;
                    return [...this.scans].sort(function(a, b) {
                        var valA, valB;
                        if (key === 'reliability') {
                            valA = a.patterns && a.patterns.length > 0 ? a.patterns[0].reliability : 0;
                            valB = b.patterns && b.patterns.length > 0 ? b.patterns[0].reliability : 0;
                        } else { valA = a.code || ''; valB = b.code || ''; }
                        if (valA < valB) return this.sortAsc ? 1 : -1;
                        if (valA > valB) return this.sortAsc ? -1 : 1;
                        return 0;
                    });
                }
            }
        }
    </script>

                <div class="text-xs text-slate-500">
                    <template x-if="lastScanned"><span x-text="'Last scanned: '+lastScanned"></span></template>
                    <template x-if="!lastScanned && !loading"><span>Click Scan Now to begin</span></template>
                </div>
                <div class="text-xs text-slate-500"><span x-text="scans.length+' stocks found'"></span></div>
            </div>

            <template x-if="scans.length === 0 && !loading">
                <div class="card p-16 text-center">
                    <div class="text-4xl mb-3">&#x1F50D;</div>
                    <h3 class="text-lg font-semibold text-slate-700 dark:text-slate-300 mb-1">Belum ada data scan</h3>
                    <p class="text-sm text-slate-500 dark:text-slate-400">Klik "Scan Now" untuk mulai memindai pola di seluruh pasar.</p>
                </div>
            </template>

            <template x-if="scans.length > 0">
                <div class="card overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="border-b border-slate-200 dark:border-slate-700 bg-white/30 dark:bg-slate-800/30">
                                    <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Stock</th>
                                    <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Pattern</th>
                                    <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Direction</th>
                                    <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider cursor-pointer hover:text-blue-400" @click="sortAsc=!sortAsc; sortKey='reliability'">
                                        Reliability <span class="text-[10px] ml-1" x-text="sortKey==='reliability' ? (sortAsc ? '&#x25B2;' : '&#x25BC;') : ''"></span>
                                    </th>
                                    <th class="text-right px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="scan in sortedScans" :key="scan.code + scan.timeframe">
                                    <tr class="border-b border-slate-200/50 dark:border-slate-700/50 hover:bg-slate-100/30 dark:hover:bg-slate-700/30 transition-colors cursor-pointer" @click="window.location='/saham/'+scan.code+'/chart-pro'">
                                        <td class="px-4 py-3">
                                            <div class="font-semibold text-white" x-text="scan.code"></div>
                                            <div class="text-xs text-slate-500" x-text="scan.name"></div>
                                        </td>
                                        <td class="px-4 py-3">
                                            <template x-for="p in scan.patterns.slice(0,3)" :key="p.name">
                                                <div class="text-xs mb-1 last:mb-0" :class="p.type==='bullish'?'text-success':p.type==='bearish'?'text-danger':'text-slate-400'" x-text="p.name"></div>
                                            </template>
                                            <template x-if="scan.patterns.length > 3">
                                                <span class="text-[10px] text-slate-500" x-text="'+'+(scan.patterns.length-3)+' more'"></span>
                                            </template>
                                        </td>
                                        <td class="px-4 py-3">
                                            <template x-for="p in scan.patterns.slice(0,1)" :key="'d-'+p.name">
                                                <span class="inline-flex px-2 py-0.5 rounded-full text-[10px] font-semibold" :class="p.type==='bullish'?'badge-bullish':p.type==='bearish'?'badge-bearish':'bg-slate-700 text-slate-300'" x-text="p.type==='bullish'?'Bullish':p.type==='bearish'?'Bearish':p.type"></span>
                                            </template>
                                        </td>
                                        <td class="px-4 py-3">
                                            <span class="flex">
                                                <template x-for="s in Array.from({length:5},function(_,i){return i})">
                                                    <span class="text-xs" :class="s < (scan.patterns[0]?.reliability || 0) ? 'star-gold' : 'text-slate-600'">&#x2605;</span>
                                                </template>
                                            </span>
                                        </td>
                                        <td class="px-4 py-3 text-right">
                                            <a :href="'/saham/'+scan.code+'/chart-pro'" class="inline-flex items-center px-2.5 py-1 text-[11px] font-medium text-blue-400 hover:bg-blue-900/20 rounded-lg transition-colors">
                                                View <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                                            </a>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </template>
        </main>
    </div>
<div id="sb-overlay" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm hidden" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div>    <script src="/static/js/app.js" defer></script>
</body>
</html>
