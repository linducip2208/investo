<!DOCTYPE html>
<html lang="id" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/static/sw.js')}</script>
    <title>[[.Title]]</title>
    <link rel="stylesheet" href="/static/css/vendor/tabler.css">
    <link rel="stylesheet" href="/static/css/legacy-compat.css">
    <link rel="stylesheet" href="/static/css/fintech.css">
    <script data-investo-assets>
    (function(){try{var p=localStorage.getItem('investo-theme')||'light';
    var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(d)document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-bs-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();
    </script>
    <script defer src="/static/js/vendor/alpine.min.js"></script>
    <style>
        *{scrollbar-width:thin;scrollbar-color:#334155 #0b1120}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0b1120}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid rgba(51,65,85,.5);border-radius:14px}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:500;transition:all .15s;text-decoration:none}
        .sidebar-link:hover{background:#1e293b;color:#e2e8f0}
        .sidebar-link.active{background:#1e3a8a;color:#93c5fd;font-weight:600}
        .chat-bubble-sent{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:16px 16px 4px 16px}
        .chat-bubble-received{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:16px 16px 16px 4px}
        @media(max-width:768px){.rooms-sidebar{display:none}.rooms-sidebar.open{display:flex!important}}
    </style>
<style data-investo-compat>
    body{background:var(--ui-bg)!important;color:var(--ui-text)!important}
    .card{background:var(--ui-surface)!important;border-color:var(--ui-border)!important;color:var(--ui-text)!important}
    .text-success{color:var(--ui-success)!important}.text-danger{color:var(--ui-danger)!important}
    .widget-title{color:var(--ui-muted)!important}
    </style>
</head>
<body class="h-100 d-flex" x-data="chatApp()" x-init="init()">
    <aside class="rooms-sidebar position-fixed position-relative top-0 bottom-0 start-0 z-2 w-64 bg-body dark:bg-[#0b1120] border-end border dark:border-slate-800 d-flex flex-column" :class="{'open': sidebarOpen}">
        <div class="d-flex align-items-center justify-content-between px-2 h-16 border-bottom border dark:border-slate-800">
            <a href="/dashboard" class="d-flex align-items-center gap-3">
                <div class="w-8 h-8 rounded-2 bg-gradient bg-gradient-from-blue bg-gradient-to-blue d-flex align-items-center justify-content-center fw-bold text-white fs-sm">I</div>
                <span class="fw-bold fs-3 text-white">Investo</span>
            </a>
            <button @click="sidebarOpen=false" class="d-md-none p-2 text-muted dark:text-muted  rounded-2  dark:hover:bg-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <nav class="flex-fill overflow-y-auto px-2 py-2 vstack gap-1">
            <p class="px-2 fs-6 fw-semibold text-muted text-uppercase  mb-1">Stock Rooms</p>
            <template x-for="room in rooms" :key="room">
                <a href="#" @click.prevent="joinRoom(room)" class="sidebar-link" :class="{'active': currentRoom === room}">
                    <span class="fs-sm" x-text="'#' + room"></span>
                    <span class="ms-auto w-2 h-2 rounded-pill" :class="roomHasActivity(room) ? 'bg-blue' : 'bg-secondary-lt'"></span>
                </a>
            </template>
            <div class="border-top border dark:border-slate-800 my-2"></div>
            <p class="px-2 fs-6 fw-semibold text-muted text-uppercase  mb-1">Menu</p>
            <a href="/ideas" class="sidebar-link"><span>💡</span> Ideas</a>
            <a href="/leaderboard" class="sidebar-link"><span>🏆</span> Leaderboard</a>
            <a href="/dashboard" class="sidebar-link"><span>📊</span> Dashboard</a>
            <a href="/saham" class="sidebar-link"><span>📈</span> Saham IDX</a>
        </nav>
    </aside>

    <div class="flex-fill d-flex flex-column min-w-0">
        <header class="h-16 border-bottom border dark:border-slate-800 bg-body dark:bg-[#0b1120] d-flex align-items-center px-2 gap-4 flex-shrink-0">
            <button @click="sidebarOpen=!sidebarOpen" class="d-md-none p-2 text-muted dark:text-muted  rounded-2  dark:hover:bg-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="flex-fill">
                <h2 class="fw-semibold text-white" x-text="currentRoom ? '#' + currentRoom : 'Obrolan Komunitas'"></h2>
                <p class="fs-xs text-muted" x-text="currentRoom ? 'Diskusi saham ' + currentRoom : 'Pilih room untuk memulai chat'"></p>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button @click="showDMs=!showDMs" class="px-2 py-1 fs-xs fw-medium text-body dark:text-body bg-white dark:bg-slate-800  dark:hover:bg-secondary-lt rounded-2 ">
                    <template x-if="unreadDMCount > 0">
                        <span class="d-inline-flex align-items-center justify-content-center w-5 h-5 bg-primary text-white fs-6 fw-bold rounded-pill me-1" x-text="unreadDMCount"></span>
                    </template>
                    DM
                </button>
                <a href="/dashboard" class="px-2 py-1 fs-xs fw-medium text-primary bg-primary bg-opacity-25  rounded-2 ">Dashboard</a>
            </div>
        </header>

        <div class="flex-fill d-flex">
            <div class="flex-fill d-flex flex-column min-w-0">
                <div class="flex-fill overflow-y-auto px-2 py-2 vstack gap-2" id="chatMessages" x-ref="messagesContainer">
                    <template x-for="msg in messages" :key="msg.id">
                        <div class="d-flex" :class="msg.sender_id === currentUserID ? 'justify-end' : 'justify-start'">
                            <div class="max-w-70">
                                <div class="d-flex align-items-end gap-2" :class="msg.sender_id === currentUserID ? 'flex-row-reverse' : ''">
                                    <div class="px-2 py-2 fs-sm" :class="msg.sender_id === currentUserID ? 'chat-bubble-sent' : 'chat-bubble-received'">
                                        <p x-text="msg.message"></p>
                                    </div>
                                </div>
                                <div class="d-flex align-items-center gap-2 mt-1" :class="msg.sender_id === currentUserID ? 'justify-end' : ''">
                                    <span class="fs-6 text-muted" x-text="msg.sender_name"></span>
                                    <span class="fs-6 text-muted" x-text="formatTime(msg.created_at)"></span>
                                </div>
                            </div>
                        </div>
                    </template>
                    <template x-if="messages.length === 0 && currentRoom">
                        <div class="text-center py-2 text-muted">
                            <div class="display-6 mb-2">💬</div>
                            <p class="fs-sm">Belum ada pesan di room ini.</p>
                            <p class="fs-xs mt-1">Jadilah yang pertama memulai diskusi!</p>
                        </div>
                    </template>
                    <template x-if="!currentRoom && !showDMs">
                        <div class="text-center py-2 text-muted">
                            <div class="display-6 mb-2">👋</div>
                            <p class="fs-sm fw-medium text-body dark:text-body">Selamat datang di Chat Komunitas</p>
                            <p class="fs-xs mt-1">Pilih stock room di sidebar untuk bergabung diskusi</p>
                        </div>
                    </template>
                </div>

                <div class="border-top border dark:border-slate-800 p-2" x-show="currentRoom || showDMs">
                    <form @submit.prevent="sendMessage()" class="d-flex gap-3">
                        <input type="text" x-model="newMessage" placeholder="Ketik pesan..."
                               class="flex-fill px-2 py-2 rounded-3 border border dark:border-slate-700 bg-white dark:bg-slate-800 text-white       fs-sm"
                               :disabled="!currentRoom && !showDMs">
                        <button type="submit"
                                class="px-2 py-2 bg-gradient bg-gradient-from-blue bg-gradient-to-blue text-white fs-sm fw-semibold rounded-3 shadow-lg      disabled:opacity-50"
                                :disabled="!newMessage.trim() || (!currentRoom && !showDMs)">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                        </button>
                    </form>
                </div>
            </div>

            <div class="d-none d-lg-flex flex-column w-72 border-start border dark:border-slate-800 p-2 vstack gap-3" x-show="showDMs" x-transition>
                <h3 class="fs-xs fw-semibold text-muted text-uppercase ">Direct Messages</h3>
                <div class="vstack gap-1">
                    <template x-for="conv in dmConversations" :key="conv.user_id">
                        <a href="#" @click.prevent="openDM(conv.user_id)" class="d-flex align-items-center gap-3 p-2 rounded-2  dark:hover:bg-white ">
                            <div class="w-9 h-9 rounded-pill bg-gradient bg-gradient-from-blue bg-gradient-to-purple d-flex align-items-center justify-content-center text-white fs-xs fw-bold" x-text="conv.user_name.charAt(0)"></div>
                            <div class="flex-fill min-w-0">
                                <p class="fs-sm fw-medium text-white text-truncate" x-text="conv.user_name"></p>
                                <p class="fs-xs text-muted text-truncate" x-text="conv.last_message"></p>
                            </div>
                            <span x-show="conv.unread_count > 0" class="w-5 h-5 bg-primary text-white fs-6 fw-bold rounded-pill d-flex align-items-center justify-content-center" x-text="conv.unread_count"></span>
                        </a>
                    </template>
                    <template x-if="dmConversations.length === 0">
                        <p class="fs-xs text-muted text-center py-2">Belum ada percakapan</p>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <div x-show="sidebarOpen" @click="sidebarOpen=false" class="d-md-none position-fixed top-0 bottom-0 start-0 end-0 bg-black bg-opacity-50 z-2 "></div>
    <script src="/static/js/app.js" defer></script>
</body>
<script>
function chatApp() {
    return {
        rooms: [[.Rooms | toJson]],
        messages: [],
        dmConversations: [],
        currentRoom: null,
        currentDMUserID: null,
        showDMs: false,
        sidebarOpen: false,
        newMessage: '',
        currentUserID: [[if .User]][[.User.ID]][[else]]0[[end]],
        unreadDMCount: 0,
        ws: null,
        activeRooms: {},

        init() {
            this.connectWS();
            this.loadDMs();
        },

        connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsURL = protocol + '//' + window.location.host + '/ws';
            this.ws = new WebSocket(wsURL);
            this.ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'chat_message') {
                        if ((this.currentRoom && data.room === this.currentRoom) ||
                            (this.currentDMUserID && !data.room && (data.sender_id === this.currentDMUserID || data.receiver_id === this.currentDMUserID))) {
                            this.messages.push(data);
                            this.$nextTick(() => this.scrollToBottom());
                        }
                        if (data.room) {
                            this.activeRooms[data.room] = Date.now();
                        }
                    }
                } catch(e) {}
            };
            this.ws.onclose = () => {
                setTimeout(() => this.connectWS(), 3000);
            };
        },

        async joinRoom(room) {
            this.currentRoom = room;
            this.showDMs = false;
            this.currentDMUserID = null;
            this.messages = [];
            try {
                const resp = await fetch('/api/chat/room/' + room);
                this.messages = await resp.json();
                this.$nextTick(() => this.scrollToBottom());
            } catch(e) {}
        },

        async sendMessage() {
            if (!this.newMessage.trim()) return;
            const payload = { message: this.newMessage.trim() };
            if (this.currentRoom) {
                payload.room = this.currentRoom;
            } else if (this.currentDMUserID) {
                payload.receiver_id = this.currentDMUserID;
            } else return;

            try {
                const resp = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const msg = await resp.json();
                this.messages.push(msg);
                this.newMessage = '';
                this.$nextTick(() => this.scrollToBottom());
            } catch(e) {}
        },

        async openDM(userID) {
            this.currentDMUserID = userID;
            this.currentRoom = null;
            this.showDMs = true;
            this.messages = [];
            try {
                const resp = await fetch('/api/dm/' + userID);
                this.messages = await resp.json();
                this.$nextTick(() => this.scrollToBottom());
            } catch(e) {}
        },

        async loadDMs() {
            try {
                const resp = await fetch('/api/dm/conversations');
                this.dmConversations = await resp.json();
                this.dmConversations.forEach(c => {
                    if (c.unread_count > 0) this.unreadDMCount += c.unread_count;
                });
            } catch(e) {}
        },

        roomHasActivity(room) {
            return this.activeRooms[room] && (Date.now() - this.activeRooms[room] < 60000);
        },

        formatTime(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        },

        scrollToBottom() {
            const container = this.$refs.messagesContainer;
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        }
    }
}
</script>
</html>
