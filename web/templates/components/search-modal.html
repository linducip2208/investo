<!-- Global Search Modal (Cmd+K / Ctrl+K) -->
<div x-data="searchModal()" x-init="init()" @keydown.window.cmd.k.prevent="openSearch()" @keydown.window.ctrl.k.prevent="openSearch()">
    <div x-show="open" @click.self="closeSearch()" @keydown.escape.window="closeSearch()"
         class="position-fixed top-0 bottom-0 start-0 end-0 z-3 d-flex align-items-start justify-content-center pt-15vh"
          x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
        <div class="position-absolute top-0 bottom-0 start-0 end-0 bg-body bg-opacity-50 dark:bg-slate-900/60 "></div>

        <div class="position-relative w-100 max-w-lg mx-2 bg-white dark:bg-slate-800 rounded-4 shadow-lg border border dark:border-slate-700 overflow-hidden"
             @click.outside="closeSearch()">
            <div class="d-flex align-items-center gap-3 px-2 py-2 border-bottom border dark:border-slate-700">
                <svg class="w-5 h-5 text-muted dark:text-muted flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" x-ref="searchInput" x-model="query" @input.debounce.200ms="search()" @keydown.down.prevent="moveDown()" @keydown.up.prevent="moveUp()" @keydown.enter.prevent="selectResult()"
                       placeholder="Cari saham, halaman..."
                       class="flex-fill bg-transparent border-0  fs-sm text-body dark:text-white ">
            </div>

            <div class="max-h-72 overflow-y-auto">
                <template x-if="results.stocks && results.stocks.length > 0">
                    <div>
                        <div class="px-2 py-2 fs-6 fw-semibold text-muted dark:text-muted text-uppercase ">Saham</div>
                        <template x-for="(s, idx) in results.stocks" :key="'stock-'+s.id">
                            <div @click="goTo('/saham/' + s.code)" @mouseenter="activeIndex = idx"
                                 class="d-flex align-items-center justify-content-between px-2 py-2  dark:hover:bg-secondary-lt/50 cursor-pointer "
                                 :class="activeIndex === idx ? 'bg-blue-50 dark:bg-blue-900/20' : ''">
                                <div class="d-flex align-items-center gap-3">
                                    <span class="fs-xs fw-bold text-body dark:text-slate-200 w-12" x-text="s.code"></span>
                                    <span class="fs-xs text-muted dark:text-muted text-truncate max-w-200" x-text="s.name"></span>
                                </div>
                                <span class="fs-xs font-monospace" :class="s.change_percent >= 0 ? 'text-emerald-600' : 'text-red-500'"
                                      x-text="(s.change_percent >= 0 ? '+' : '') + s.change_percent.toFixed(2) + '%'"></span>
                            </div>
                        </template>
                    </div>
                </template>

                <div>
                    <div class="px-2 py-2 fs-6 fw-semibold text-muted dark:text-muted text-uppercase ">Halaman</div>
                    <template x-for="(page, idx) in pageResults" :key="'page-'+idx">
                        <div @click="goTo(page.url)" @mouseenter="activeIndex = (results.stocks ? results.stocks.length : 0) + idx"
                             class="d-flex align-items-center gap-3 px-2 py-2  dark:hover:bg-secondary-lt/50 cursor-pointer "
                             :class="activeIndex === ((results.stocks ? results.stocks.length : 0) + idx) ? 'bg-blue-50 dark:bg-blue-900/20' : ''">
                            <span class="fs-sm" x-text="page.icon"></span>
                            <div>
                                <span class="fs-sm fw-medium text-body dark:text-slate-200" x-text="page.label"></span>
                                <span class="fs-xs text-muted dark:text-muted ms-1" x-text="'/'+page.url"></span>
                            </div>
                        </div>
                    </template>
                </div>

                <div x-show="noResults && query.length > 0" class="px-2 py-2 text-center text-muted dark:text-muted fs-sm">
                    Tidak ada hasil untuk "<span x-text="query"></span>"
                </div>
            </div>

            <div class="px-2 py-2 border-top border dark:border-slate-700 d-flex align-items-center gap-4 fs-6 text-muted dark:text-muted">
                <span class="d-flex align-items-center gap-1"><kbd class="px-1 py-0 bg-body dark:bg-slate-700 rounded fs-6">ESC</kbd> tutup</span>
                <span class="d-flex align-items-center gap-1"><kbd class="px-1 py-0 bg-body dark:bg-slate-700 rounded fs-6">↑↓</kbd> navigasi</span>
                <span class="d-flex align-items-center gap-1"><kbd class="px-1 py-0 bg-body dark:bg-slate-700 rounded fs-6">↵</kbd> pilih</span>
            </div>
        </div>
    </div>
</div>

<script>
function searchModal() {
    return {
        open: false,
        query: '',
        results: { stocks: [] },
        activeIndex: -1,
        noResults: false,
        pages: [
            { url: 'dashboard', label: 'Dashboard', icon: '🏠' },
            { url: 'dashboard/portfolios', label: 'Portofolio', icon: '💼' },
            { url: 'dashboard/watchlists', label: 'Watchlist', icon: '⭐' },
            { url: 'dashboard/alerts', label: 'Alert', icon: '🔔' },
            { url: 'saham', label: 'Daftar Saham', icon: '📈' },
            { url: 'forex', label: 'Forex', icon: '💱' },
            { url: 'screener', label: 'Screener', icon: '🔍' },
            { url: 'berita', label: 'Berita', icon: '📰' },
            { url: 'ideas', label: 'Ide Investasi', icon: '💡' },
            { url: 'leaderboard', label: 'Leaderboard', icon: '🏆' },
            { url: 'profil', label: 'Profil', icon: '👤' },
            { url: 'pengaturan', label: 'Pengaturan', icon: '⚙️' },
            { url: 'market/heatmap', label: 'Market Heatmap', icon: '🗺️' },
            { url: 'market/recap', label: 'Market Recap', icon: '🧠' },
            { url: 'blog', label: 'Blog', icon: '📝' },
            { url: 'docs', label: 'Dokumentasi', icon: '📚' },
        ],
        get pageResults() {
            if (!this.query || this.query.length < 1) return this.pages;
            const q = this.query.toLowerCase();
            return this.pages.filter(p => p.label.toLowerCase().includes(q) || p.url.toLowerCase().includes(q));
        },
        init() {
            document.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                    e.preventDefault();
                    this.openSearch();
                }
            });
        },
        openSearch() {
            this.open = true;
            this.query = '';
            this.results = { stocks: [] };
            this.activeIndex = -1;
            this.noResults = false;
            this.$nextTick(() => { this.$refs.searchInput.focus(); });
        },
        closeSearch() {
            this.open = false;
        },
        async search() {
            if (this.query.length < 1) {
                this.results = { stocks: [] };
                this.noResults = false;
                return;
            }
            try {
                const res = await fetch('/api/v1/search?q=' + encodeURIComponent(this.query));
                const data = await res.json();
                this.results = { stocks: Array.isArray(data) ? data : (data.data || []) };
                this.noResults = (!this.results.stocks || this.results.stocks.length === 0) && this.pageResults.length === 0;
                this.activeIndex = -1;
            } catch(e) { console.error('Search error:', e) }
        },
        goTo(url) {
            window.location.href = '/' + url.replace(/^\//, '');
        },
        moveDown() {
            const max = (this.results.stocks ? this.results.stocks.length : 0) + this.pageResults.length - 1;
            if (this.activeIndex < max) {
                this.activeIndex++;
            } else {
                this.activeIndex = 0;
            }
        },
        moveUp() {
            const max = (this.results.stocks ? this.results.stocks.length : 0) + this.pageResults.length - 1;
            if (this.activeIndex > 0) {
                this.activeIndex--;
            } else {
                this.activeIndex = max;
            }
        },
        selectResult() {
            if (this.activeIndex === -1) return;
            const stockLen = this.results.stocks ? this.results.stocks.length : 0;
            if (this.activeIndex < stockLen) {
                const s = this.results.stocks[this.activeIndex];
                this.goTo('saham/' + s.code);
            } else {
                const p = this.pageResults[this.activeIndex - stockLen];
                if (p) this.goTo(p.url);
            }
        }
    }
}
</script>
