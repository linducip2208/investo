<!-- Notification Bell Dropdown Component -->
<div x-data="notificationBell()" x-init="fetchUnread(); fetchNotifications(); setInterval(() => { fetchUnread(); fetchNotifications() }, 60000)"
     class="position-relative" @click.outside="open = false">
    <button @click="open = !open; if (open) fetchNotifications()"
            class="position-relative p-2 rounded-2 text-muted dark:text-muted  dark:hover:text-slate-200  dark:hover:bg-white ">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <span x-show="unreadCount > 0"
              class="position-absolute top-0 end-0 w-4.5 h-4.5 bg-danger text-white fs-6 fw-bold rounded-pill d-flex align-items-center justify-content-center lh-1"
              style="width: 18px; height: 18px;"
              x-text="unreadCount > 99 ? '99+' : unreadCount">3</span>
    </button>

    <div x-show="open"  x-transition:enter-start="opacity-0 scale-95 -translate-y-2" x-transition:enter-end="opacity-100 scale-100 translate-y-0"
         class="position-absolute end-0 mt-2 w-80 bg-white dark:bg-slate-800 rounded-3 shadow-lg border border dark:border-slate-700 overflow-hidden z-3">
        <div class="d-flex align-items-center justify-content-between px-2 py-2 border-bottom border dark:border-slate-700">
            <h3 class="fs-sm fw-semibold text-body dark:text-white">Notifikasi</h3>
            <button @click="markAllRead()" x-show="unreadCount > 0"
                    class="fs-xs text-primary dark:text-info  fw-medium">
                Tandai semua dibaca
            </button>
        </div>

        <div class="max-h-360 overflow-y-auto">
            <template x-if="notifications.length === 0">
                <div class="px-2 py-2 text-center text-muted dark:text-muted dark:text-muted fs-sm">
                    <svg class="w-10 h-10 mx-auto mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                    Tidak ada notifikasi
                </div>
            </template>

            <template x-for="n in notifications" :key="n.id">
                <div @click="markRead(n); if (n.link) window.location = n.link"
                     class="d-flex align-items-start gap-3 px-2 py-2  dark:hover:bg-secondary-lt/50 cursor-pointer  border-bottom border dark:border-slate-700/30"
                     :class="!n.is_read ? 'bg-blue-50/50 dark:bg-blue-900/10' : ''">
                    <div class="w-8 h-8 rounded-2 d-flex align-items-center justify-content-center flex-shrink-0 mt-0"
                         :class="notifIconBg(n.type)">
                        <span class="fs-sm" x-html="notifIcon(n.type)"></span>
                    </div>
                    <div class="flex-fill min-w-0">
                        <p class="fs-sm fw-medium text-body dark:text-white lh-1" x-text="n.title"></p>
                        <p class="fs-xs text-muted dark:text-muted mt-0 line-clamp-2" x-text="n.message"></p>
                        <p class="fs-6 text-muted dark:text-muted dark:text-muted mt-1" x-text="timeAgo(n.created_at)"></p>
                    </div>
                    <div x-show="!n.is_read" class="w-2 h-2 bg-primary rounded-pill flex-shrink-0 mt-2"></div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
function notificationBell() {
    return {
        open: false,
        notifications: [],
        unreadCount: 0,
        async fetchUnread() {
            try {
                const res = await fetch('/api/notifications/unread-count');
                const data = await res.json();
                this.unreadCount = data.count || 0;
            } catch(e) { console.error('Unread count error:', e) }
        },
        async fetchNotifications() {
            try {
                const res = await fetch('/api/notifications');
                this.notifications = await res.json();
            } catch(e) { console.error('Notifications error:', e) }
        },
        async markRead(n) {
            if (!n.is_read) {
                try {
                    await fetch('/api/notifications/' + n.id + '/read', { method: 'POST' });
                    n.is_read = true;
                    this.unreadCount = Math.max(0, this.unreadCount - 1);
                } catch(e) { console.error('Mark read error:', e) }
            }
        },
        async markAllRead() {
            try {
                await fetch('/api/notifications/read-all', { method: 'POST' });
                this.notifications.forEach(n => n.is_read = true);
                this.unreadCount = 0;
            } catch(e) { console.error('Mark all read error:', e) }
        },
        notifIcon(type) {
            const icons = {
                'alert_triggered': '🔔',
                'pattern_detected': '📐',
                'dividend': '💸',
                'price_target': '🎯',
                'news_mention': '📰',
                'portfolio_update': '📊',
                'system': '⚙️',
            };
            return icons[type] || 'ℹ️';
        },
        notifIconBg(type) {
            const bgs = {
                'alert_triggered': 'bg-amber-50 dark:bg-amber-900/30',
                'pattern_detected': 'bg-violet-50 dark:bg-violet-900/30',
                'dividend': 'bg-emerald-50 dark:bg-emerald-900/30',
                'price_target': 'bg-blue-50 dark:bg-blue-900/30',
                'news_mention': 'bg-rose-50 dark:bg-rose-900/30',
                'portfolio_update': 'bg-cyan-50 dark:bg-cyan-900/30',
            };
            return bgs[type] || 'bg-slate-50 dark:bg-slate-700/50';
        },
        timeAgo(dateStr) {
            const then = new Date(dateStr);
            const now = new Date();
            const diff = Math.floor((now - then) / 1000);
            if (diff < 60) return 'Baru saja';
            if (diff < 3600) return Math.floor(diff / 60) + ' menit lalu';
            if (diff < 86400) return Math.floor(diff / 3600) + ' jam lalu';
            if (diff < 604800) return Math.floor(diff / 86400) + ' hari lalu';
            return then.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }
    }
}
</script>
