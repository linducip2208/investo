<!-- Ticker Bar Component — include on dashboard, stocks, forex pages -->
<div x-data="tickerBar()" x-init="fetchTicker(); setInterval(() => fetchTicker(), 30000)"
     class="bg-body dark:bg-slate-900 text-white overflow-hidden border-bottom border dark:border-slate-700">
    <div class="position-relative d-flex align-items-center h-9">
        <div class="flex-shrink-0 bg-primary px-2 h-100 d-flex align-items-center gap-1 z-1">
            <span class="w-1.5 h-1.5 bg-success rounded-pill "></span>
            <span class="fs-xs fw-bold ">IDX LIVE</span>
        </div>
        <div class="flex-fill overflow-hidden">
            <div class="ticker-track d-flex align-items-center h-100" x-ref="track">
                <template x-for="(item, idx) in items" :key="idx">
                    <div class="ticker-item d-flex align-items-center gap-2 flex-shrink-0 px-2 border-end border dark:border-slate-700/50">
                        <span class="fs-xs fw-bold " x-text="item.code">BBCA</span>
                        <span class="fs-xs font-monospace text-body dark:text-body" x-text="'Rp ' + item.price.toLocaleString('id-ID')">9,875</span>
                        <span class="fs-xs font-monospace fw-semibold" :class="item.change_percent >= 0 ? 'text-success' : 'text-danger'"
                              x-text="(item.change_percent >= 0 ? '+' : '') + item.change_percent.toFixed(2) + '%'">+2.3%</span>
                    </div>
                </template>
                <template x-for="(item, idx) in items" :key="'dup-'+idx">
                    <div class="ticker-item d-flex align-items-center gap-2 flex-shrink-0 px-2 border-end border dark:border-slate-700/50">
                        <span class="fs-xs fw-bold " x-text="item.code">BBCA</span>
                        <span class="fs-xs font-monospace text-body dark:text-body" x-text="'Rp ' + item.price.toLocaleString('id-ID')">9,875</span>
                        <span class="fs-xs font-monospace fw-semibold" :class="item.change_percent >= 0 ? 'text-success' : 'text-danger'"
                              x-text="(item.change_percent >= 0 ? '+' : '') + item.change_percent.toFixed(2) + '%'">+2.3%</span>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>

<style>
.ticker-track {
    display: flex;
    width: max-content;
    animation: ticker-scroll 60s linear infinite;
}
.ticker-track:hover {
    animation-play-state: paused;
}
@keyframes ticker-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}
</style>

<script>
function tickerBar() {
    return {
        items: [],
        async fetchTicker() {
            try {
                const res = await fetch('/api/market/summary');
                const data = await res.json();
                this.items = (data.ticker || []).slice(0, 10);
            } catch(e) { console.error('Ticker fetch error:', e) }
        }
    }
}
</script>
