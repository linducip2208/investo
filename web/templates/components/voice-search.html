<div x-data="voiceSearch()" x-init="initVoice()" class="position-fixed bottom-6 right-6 z-3">
    <button @click="toggleListening"
            :class="listening ? 'bg-danger scale-110' : 'bg-primary'"
            class="w-14 h-14 rounded-pill shadow-lg d-flex align-items-center justify-content-center text-white   "
            title="Voice Command">
        <svg x-show="!listening" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
        </svg>
        <svg x-show="listening" class="w-6 h-6 " fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1v1M12 22v1M4.22 4.22l.707.707M19.07 19.07l.707.707M1 12h1M22 12h1M4.22 19.78l.707-.707M19.07 4.93l.707-.707"/>
        </svg>
    </button>
    <div x-show="listening"
         class="position-absolute bottom-16 end-0 bg-white dark:bg-slate-800 border border rounded-3 p-2 w-72 shadow-lg">
        <div class="d-flex align-items-center gap-3 mb-2">
            <div class="d-flex gap-1">
                <span class="w-1.5 h-5 bg-primary rounded " style="animation-delay:0s"></span>
                <span class="w-1.5 h-5 bg-primary rounded " style="animation-delay:0.2s"></span>
                <span class="w-1.5 h-5 bg-primary rounded " style="animation-delay:0.4s"></span>
                <span class="w-1.5 h-5 bg-primary rounded " style="animation-delay:0.6s"></span>
            </div>
            <span class="fs-sm text-primary fw-medium">Mendengarkan...</span>
        </div>
        <p x-show="transcript" class="fs-sm text-body mb-2"><span x-text="transcript"></span></p>
        <p x-show="error" class="fs-xs text-danger" x-text="error"></p>
        <div class="mt-2 pt-2 border-top border dark:border-slate-700">
            <p class="fs-6 text-muted mb-1">Contoh: "buka saham BBCA"</p>
            <div class="d-flex flex-wrap gap-1">
                <span class="fs-6 bg-body dark:bg-slate-700 text-muted dark:text-muted px-1 py-0 rounded">dashboard</span>
                <span class="fs-6 bg-body dark:bg-slate-700 text-muted dark:text-muted px-1 py-0 rounded">forex</span>
                <span class="fs-6 bg-body dark:bg-slate-700 text-muted dark:text-muted px-1 py-0 rounded">screener</span>
            </div>
        </div>
    </div>
</div>

<script>
function voiceSearch() {
    return {
        listening: false,
        transcript: '',
        error: '',
        recognition: null,

        initVoice() {
            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                this.error = 'Browser tidak mendukung voice recognition';
                return;
            }
            this.recognition = new SpeechRecognition();
            this.recognition.lang = 'id-ID';
            this.recognition.continuous = false;
            this.recognition.interimResults = false;

            var self = this;
            this.recognition.onresult = function(e) {
                var text = (e.results[0][0].transcript || '').toLowerCase().trim();
                self.transcript = text;
                self.processCommand(text);
                setTimeout(function() { self.transcript = ''; }, 3000);
            };
            this.recognition.onerror = function(e) {
                self.error = 'Error: ' + e.error;
                self.listening = false;
                setTimeout(function() { self.error = ''; }, 3000);
            };
            this.recognition.onend = function() {
                self.listening = false;
            };
        },

        toggleListening() {
            if (!this.recognition) return;
            if (this.listening) {
                this.recognition.stop();
                this.listening = false;
            } else {
                this.listening = true;
                this.error = '';
                this.transcript = '';
                this.recognition.start();
                var self = this;
                setTimeout(function() { if (self.listening) { self.recognition.stop(); self.listening = false; } }, 7000);
            }
        },

        processCommand(text) {
            if (!text) return;
            var match;

            match = text.match(/buka\s+saham\s+(\w+)/i);
            if (match) { window.location.href = '/saham/' + match[1].toUpperCase(); return; }

            match = text.match(/tampilkan\s+chart\s+(\w+)/i);
            if (match) { window.location.href = '/saham/' + match[1].toUpperCase() + '/chart-pro'; return; }

            match = text.match(/chart\s+(?:pro|)\s*(\w+)/i);
            if (match) { window.location.href = '/saham/' + match[1].toUpperCase() + '/chart-pro'; return; }

            if (text.includes('dashboard') || text.includes('dasbor')) { window.location.href = '/dashboard'; return; }
            if (text.includes('forex')) { window.location.href = '/forex'; return; }
            if (text.includes('screener') || text.includes('skriner')) { window.location.href = '/screener'; return; }
            if (text.includes('saham') || text.includes('daftar')) { window.location.href = '/saham'; return; }
            if (text.includes('berita')) { window.location.href = '/berita'; return; }
            if (text.includes('heatmap')) { window.location.href = '/market/heatmap'; return; }
            if (text.includes('kalkulator')) { window.location.href = '/calculators'; return; }
            if (text.includes('waran')) { window.location.href = '/market/waran'; return; }
        }
    };
}
</script>
