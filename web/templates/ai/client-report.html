<!DOCTYPE html>
<html lang="id" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Client Report &mdash; Investo</title>
    <link rel="stylesheet" href="/static/css/vendor/tabler.css">
    <link rel="stylesheet" href="/static/css/output.css">
    <link rel="stylesheet" href="/static/css/fintech.css">
    <script data-investo-assets>
    (function(){try{var p=localStorage.getItem('investo-theme')||'light';
    var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(d)document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-bs-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();
    </script>
    <script defer src="/static/js/vendor/alpine.min.js"></script>
    <style>
        *{scrollbar-width:thin;scrollbar-color:#334155 #0b1120}
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-track{background:#0b1120}
        ::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid #334155;border-radius:14px;transition:all .2s}
        .card:hover{border-color:#475569}
        .gradient-blue{background:linear-gradient(135deg,#1e3a8a,#3b82f6)}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:500;transition:all .15s;text-decoration:none}
        .sidebar-link:hover{background:#1e293b;color:#e2e8f0}
        .sidebar-link.active{background:#1e3a8a;color:#93c5fd;font-weight:600}
        .report-content h2{font-size:20px;font-weight:700;color:#93c5fd;border-bottom:2px solid #1e3a8a;padding-bottom:8px;margin:30px 0 15px}
        .report-content h3{font-size:16px;font-weight:600;color:#cbd5e1;margin:20px 0 10px}
        .report-content p{line-height:1.8;margin-bottom:1rem;color:#cbd5e1}
        .report-content strong{color:#93c5fd}
        .report-content table{width:100%;border-collapse:collapse;margin:15px 0}
        .report-content th{background:#1e3a8a;color:#e2e8f0;padding:10px 14px;text-align:left;font-weight:600;font-size:13px}
        .report-content td{padding:10px 14px;border-bottom:1px solid #334155;font-size:13px;color:#cbd5e1}
        @media print{.sidebar,header,button.fab{display:none!important}.flex-1{margin-left:0!important}.card{border:none!important}}
        @media(max-width:1024px){.sidebar{display:none}.sidebar.open{display:flex}}
        @media(max-width:640px){.report-content h2{font-size:17px}.report-content table{font-size:11px}.card{padding:14px!important}}
    </style>
<style data-investo-compat>
    body{background:var(--ui-bg)!important;color:var(--ui-text)!important}
    .card{background:var(--ui-surface)!important;border-color:var(--ui-border)!important;color:var(--ui-text)!important}
    .text-success{color:var(--ui-success)!important}.text-danger{color:var(--ui-danger)!important}
    .widget-title{color:var(--ui-muted)!important}
    </style>
</head>
<body class="h-100 d-flex" x-data="{ sidebarOpen: false, reportHTML: '', reportData: null, loading: false }">
    <aside x-data :class="{'open': sidebarOpen}" class="sidebar position-fixed start-0 top-0 h-100 w-64 bg-white dark:bg-[#0f172a] border-end border dark:border-[#1e293b] z-2 d-flex flex-column overflow-y-auto d-none d-md-block">
        <div class="p-2 border-bottom border dark:border-[#1e293b]"><a href="/dashboard" class="d-flex align-items-center gap-3 text-white text-decoration-none"><span class="fs-1">💹</span><span class=" fw-bold fs-3">Investo</span></a></div>
        <div class="p-2 vstack gap-1 flex-fill">
            <div class="px-2 py-2 fs-xs fw-semibold text-muted text-uppercase ">AI Tools</div>
            <a href="/ai/client-report" class="sidebar-link active"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>Client Report</a>
            <a href="/ai/report-generator" class="sidebar-link"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>Report Generator</a>
            <div class="px-2 pt-2 pb-2 fs-xs fw-semibold text-muted text-uppercase ">Menu Utama</div>
            <a href="/dashboard" class="sidebar-link"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Dashboard</a>
        </div>
        <div class="p-2 border-top border dark:border-[#1e293b]"><div class="d-flex align-items-center gap-3"><span class="w-8 h-8 bg-primary text-white rounded-pill d-flex align-items-center justify-content-center fs-xs fw-bold">[[slice .User.Name 0 1]]</span><div><div class="fs-sm fw-medium text-white">[[.User.Name]]</div><form action="/logout" method="POST" class="mt-1"><button class="fs-xs text-muted  ">Keluar</button></form></div></div></div>
    </aside>

    <div class="flex-fill app-offset-wide d-flex flex-column min-h-full">
        <header class="position-sticky top-0 z-2 bg-body bg-opacity-100 dark:bg-[#0b1120]/90  border-bottom border dark:border-[#1e293b]">
            <div class="d-flex align-items-center justify-content-between px-2 py-2">
                <div class="d-flex align-items-center gap-3">
                    <button onclick="document.getElementById('sidebar').classList.toggle('d-none d-md-block');document.getElementById('sb-overlay').classList.toggle('hidden')" class="d-lg-none p-2 text-muted dark:text-slate-400  rounded-2  dark:hover:bg-[#1e293b] "><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
                    <h1 class="fs-3 fw-semibold text-white">Client Report Generator</h1>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button @click="printReport()" class="px-2 py-2 fs-sm text-muted dark:text-slate-400   dark:hover:bg-[#1e293b] rounded-2 ">
                        <svg class="w-4 h-4 d-inline me-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                        Print/Cetak
                    </button>
                    <button @click="downloadHTML()" class="px-2 py-2 fs-sm text-muted dark:text-slate-400   dark:hover:bg-[#1e293b] rounded-2 ">Download HTML</button>
                </div>
            </div>
        </header>

        <main class="flex-fill p-2">
            <div x-show="sidebarOpen" onclick="document.getElementById('sidebar').classList.add('d-none d-md-block');document.getElementById('sb-overlay').classList.add('hidden')" class="d-lg-none position-fixed top-0 bottom-0 start-0 end-0 bg-black bg-opacity-50 z-2 "></div>
            <div class="max-w-4xl mx-auto vstack gap-4">
                <div class="card p-2 text-center" x-show="!reportHTML">
                    <div class="w-16 h-16 gradient-blue rounded-4 d-flex align-items-center justify-content-center text-white fs-1 mx-auto mb-2">📄</div>
                    <h2 class="fs-2 fw-bold text-white mb-2">Generate Laporan Klien</h2>
                    <p class="fs-sm text-muted dark:text-slate-400 mb-2">AI akan menghasilkan laporan profesional untuk portofolio Anda.</p>
                    <div class="d-flex gap-3 justify-content-center">
                        <select id="reportPortfolioSelect" class="bg-white dark:bg-[#0f172a] border border dark:border-[#334155] rounded-3 px-2 py-2 text-white fs-sm">
                            <option value="1">Portfolio 1</option>
                            <option value="2">Portfolio 2</option>
                        </select>
                        <button @click="generateReport()" :disabled="loading"
                                class="px-2 py-2 bg-primary text-white fw-medium rounded-3  disabled:opacity-50 ">
                            <span x-text="loading ? 'Generating...' : 'Generate Report'">Generate Report</span>
                        </button>
                    </div>
                </div>

                <div x-show="loading" class="d-flex justify-content-center py-2">
                    <div class=" w-8 h-8 border-2 border-primary border-top rounded-pill"></div>
                </div>

                <div x-show="reportHTML" class="card p-2">
                    <div class="report-content" x-html="reportHTML"></div>
                </div>
            </div>
        </main>
    </div>

    <button onclick="document.getElementById('sidebar').classList.toggle('d-none d-md-block');document.getElementById('sb-overlay').classList.toggle('hidden')" class="d-lg-none position-fixed bottom-6 left-6 z-3 w-12 h-12 bg-primary text-white rounded-pill shadow-lg d-flex align-items-center justify-content-center  ">
        <svg x-show="!sidebarOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg x-show="sidebarOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>

<script>
document.addEventListener('alpine:init', () => {
    window.generateReport = function() {
        const el = document.querySelector('[x-data]');
        Alpine.evaluate(el, 'loading = true');
        const portfolioId = document.getElementById('reportPortfolioSelect')?.value || 1;
        fetch('/api/ai/client-report/' + portfolioId)
            .then(r => r.json())
            .then(data => {
                Alpine.evaluate(el, 'loading = false');
                if (data.success) {
                    Alpine.evaluate(el, `reportHTML = '${data.html.replace(/'/g, "\\'").replace(/`/g, "\\`").replace(/\$/g, "\\$")}'`);
                    Alpine.evaluate(el, 'reportData = ' + JSON.stringify(data.data));
                }
            })
            .catch(() => Alpine.evaluate(el, 'loading = false'));
    };

    window.printReport = function() { window.print(); };
    window.downloadHTML = function() {
        const el = document.querySelector('[x-data]');
        const html = Alpine.evaluate(el, 'reportHTML');
        if (!html) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'investo-client-report.html'; a.click();
        URL.revokeObjectURL(url);
    };
});
</script>
<div id="sb-overlay" class="position-fixed top-0 bottom-0 start-0 end-0 z-2 bg-black bg-opacity-50  d-none" onclick="document.getElementById('sidebar').classList.toggle('d-none d-md-block');this.classList.toggle('hidden')"></div>    <script src="/static/js/app.js" defer></script>
</body>
</html>
