<!DOCTYPE html>
<html lang="id" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Saham · Admin · [[.AppName]]</title>
    <link rel="stylesheet" href="/static/css/vendor/tabler.css">
    <link rel="stylesheet" href="/static/css/legacy-compat.css">
    <link rel="stylesheet" href="/static/css/fintech.css">
    <script data-investo-assets>
    (function(){try{var p=localStorage.getItem('investo-theme')||'light';
    var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(d)document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-bs-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();
    </script>
    <script defer src="/static/js/vendor/alpine.min.js"></script>
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=inter:400,500,600,700,800,900|jetbrains-mono:400,500,600,700,800" rel="stylesheet">
    <style>
        :root { --sidebar-width: 260px; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace !important; }
        .sidebar { width: var(--sidebar-width); min-height: 100vh; }
        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
        @media (max-width: 767px) {
            .sidebar { position: fixed; z-index: 50; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 45; }
            .sidebar-overlay.show { display: block; }
        }
        @media (prefers-color-scheme: dark) {
            .bg-main { background-color: #0f172a; } .text-main { color: #e2e8f0; }
            .card { background-color: #1e293b; border-color: #334155; }
            .input-dark { background-color: #1e293b; border-color: #475569; color: #e2e8f0; }
            .input-dark:focus { border-color: #3b82f6; }
        }
        @media (prefers-color-scheme: light) {
            .bg-main { background-color: #f1f5f9; } .text-main { color: #0f172a; }
            .card { background-color: #ffffff; border-color: #e2e8f0; }
            .input-dark { background-color: #ffffff; border-color: #cbd5e1; color: #0f172a; }
            .input-dark:focus { border-color: #3b82f6; }
        }
    </style>
<style data-investo-compat>
    body{background:var(--ui-bg)!important;color:var(--ui-text)!important}
    .card{background:var(--ui-surface)!important;border-color:var(--ui-border)!important;color:var(--ui-text)!important}
    .text-success{color:var(--ui-success)!important}.text-danger{color:var(--ui-danger)!important}
    .widget-title{color:var(--ui-muted)!important}
    </style>
</head>
<body class="bg-body text-body antialiased" x-data="{ sidebarOpen: false, darkMode: localStorage.getItem('investo-dark-mode') === 'true' || window.matchMedia('(prefers-color-scheme: dark)').matches }" x-init="document.documentElement.classList.toggle('dark', darkMode); window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {  })">

    <div class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="sidebarOpen = false"></div>

    <aside class="sidebar bg-body dark:bg-slate-900 text-white d-flex flex-column position-fixed start-0 top-0 bottom-0 overflow-y-auto" :class="{ open: sidebarOpen }">
        <div class="d-flex align-items-center gap-3 px-2 py-2 border-bottom border dark:border-slate-700/60">
            <div class="w-9 h-9 bg-gradient bg-gradient-from-blue bg-gradient-to-blue rounded-2 d-flex align-items-center justify-content-center fw-bold text-white fs-sm shadow-lg ">I</div>
            <div>
                <div class="fw-bold fs-base lh-1">[[.AppName]]</div>
                <div class="text-muted dark:text-muted fs-6  text-uppercase">Admin Panel</div>
            </div>
        </div>
        <nav class="flex-fill px-2 py-2 vstack gap-1">
            <a href="/admin/dashboard" class="d-flex align-items-center gap-3 px-2 py-2 rounded-2 text-body dark:text-body  dark:hover:bg-white   ">
                <svg class="w-5 h-5 flex-shrink-0 text-muted dark:text-muted  " fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                <span class="fs-sm">Dashboard</span>
            </a>
            <a href="/admin/users" class="d-flex align-items-center gap-3 px-2 py-2 rounded-2 text-body dark:text-body  dark:hover:bg-white   ">
                <svg class="w-5 h-5 flex-shrink-0 text-muted dark:text-muted  " fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7" stroke-linecap="round"/></svg>
                <span class="fs-sm">Pengguna</span>
            </a>
            <a href="/admin/saham" class="d-flex align-items-center gap-3 px-2 py-2 rounded-2 bg-primary text-white fw-medium  ">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 17l4-5 3 3 5-6 6 5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1" y="1" width="22" height="22" rx="3"/></svg>
                <span class="fs-sm">Saham</span>
            </a>
            <a href="/admin/sektor" class="d-flex align-items-center gap-3 px-2 py-2 rounded-2 text-body dark:text-body  dark:hover:bg-white   ">
                <svg class="w-5 h-5 flex-shrink-0 text-muted dark:text-muted  " fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="8.5" y="14" width="7" height="7" rx="1"/></svg>
                <span class="fs-sm">Sektor</span>
            </a>
            <a href="/admin/berita" class="d-flex align-items-center gap-3 px-2 py-2 rounded-2 text-body dark:text-body  dark:hover:bg-white   ">
                <svg class="w-5 h-5 flex-shrink-0 text-muted dark:text-muted  " fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 8h20" stroke-linecap="round"/><circle cx="8" cy="13" r="1.5" fill="currentColor" stroke="none"/><path d="M12 13h6" stroke-linecap="round"/></svg>
                <span class="fs-sm">Berita</span>
            </a>
            <a href="/admin/blog" class="d-flex align-items-center gap-3 px-2 py-2 rounded-2 text-body dark:text-body  dark:hover:bg-white   ">
                <svg class="w-5 h-5 flex-shrink-0 text-muted dark:text-muted  " fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M16 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V8l-5-5z" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 3v5h5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 13h3.5l1 3h-5.5l1-3z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="fs-sm">Blog</span>
            </a>
            <a href="/admin/pengaturan" class="d-flex align-items-center gap-3 px-2 py-2 rounded-2 text-body dark:text-body  dark:hover:bg-white   ">
                <svg class="w-5 h-5 flex-shrink-0 text-muted dark:text-muted  " fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <span class="fs-sm">Pengaturan</span>
            </a>
        </nav>
        <div class="px-2 py-2 border-top border dark:border-slate-700/60 vstack gap-2">
            <button @click="darkMode = !darkMode; document.documentElement.classList.toggle('dark', darkMode); localStorage.setItem('investo-dark-mode', darkMode ? 'true' : 'false')" class="d-flex align-items-center gap-3 w-100 px-2 py-2 rounded-2 text-muted dark:text-muted  dark:hover:bg-white   fs-sm">
                <svg x-show="!darkMode" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <svg x-show="darkMode" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
                <span x-text="darkMode ? 'Mode Terang' : 'Mode Gelap'"></span>
            </button>
            <div class="d-flex align-items-center gap-3 px-2 py-2 text-muted dark:text-muted fs-xs">
                <div class="w-7 h-7 rounded-pill bg-gradient bg-gradient-from-blue bg-gradient-to-blue d-flex align-items-center justify-content-center text-white fw-bold fs-6">A</div>
                <div>
                    <div class="text-body dark:text-body fs-xs fw-medium">[[.AdminName]]</div>
                    <a href="/admin/logout" class="text-primary  ">Keluar</a>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="bg-white bg-opacity-75 dark:bg-slate-900/80  border-bottom border dark:border-slate-700/50 px-2 py-2 d-flex align-items-center justify-content-between position-sticky top-0 z-2">
            <button @click="sidebarOpen = !sidebarOpen" class="d-lg-none p-2 rounded-2  dark:hover:bg-white ">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
            </button>
            <div class="fs-sm text-muted fw-medium d-none d-sm-block">[[.AppName]] Admin</div>
            <span class="fs-6 text-muted dark:text-muted bg-body dark:bg-slate-800 px-2 py-1 rounded-pill font-monospace">[[.AppVersion]]</span>
        </header>

        <div class="px-2 py-2 max-w-4xl mx-auto vstack gap-4">
            <nav class="d-flex align-items-center gap-2 fs-sm text-muted dark:text-muted" aria-label="Breadcrumb">
                <a href="/admin/saham" class=" dark:hover:text-info  fw-medium">Saham</a>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="text-body dark:text-slate-200 fw-semibold">Edit</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="font-monospace fw-bold text-primary dark:text-info">[[.Stock.Code]]</span>
            </nav>

            <div class="card rounded-4 border shadow-sm p-2">
                <h1 class="fs-2 fw-bolder text-body dark:text-white mb-1">Edit Saham</h1>
                <p class="fs-sm text-muted dark:text-muted mb-2">Perbarui data emiten <span class="font-monospace fw-bold text-primary dark:text-info">[[.Stock.Code]]</span> — [[.Stock.Name]]</p>

                <form method="POST" action="/admin/saham/[[.Stock.ID]]/edit" class="row row-cols-1 row-cols-md-2 gap-5">
                    <div>
                        <label class="d-block fs-sm fw-semibold text-body dark:text-body mb-1">Kode Saham</label>
                        <input type="text" name="code" value="[[.Stock.Code]]" required maxlength="4" class="form-control w-100 px-2 py-2 rounded-3 border fs-sm font-monospace fw-bold     text-uppercase">
                        <p class="fs-6 text-muted dark:text-muted mt-1">Maksimal 4 karakter, uppercase (contoh: AAII)</p>
                    </div>
                    <div>
                        <label class="d-block fs-sm fw-semibold text-body dark:text-body mb-1">Nama Perusahaan</label>
                        <input type="text" name="name" value="[[.Stock.Name]]" required class="form-control w-100 px-2 py-2 rounded-3 border fs-sm    ">
                    </div>
                    <div>
                        <label class="d-block fs-sm fw-semibold text-body dark:text-body mb-1">Sektor</label>
                        <select name="sector_id" class="form-control w-100 px-2 py-2 rounded-3 border fs-sm     appearance-none bg-no-repeat" style="background-image: url(&quot;data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e&quot;); background-position: right 0.75rem center; background-size: 1.25rem;">
                            [[range .Sectors]]
                            <option value="[[.ID]]" [[if eq $.Stock.SectorID .ID]]selected[[end]]>[[.Name]]</option>
                            [[end]]
                        </select>
                    </div>
                    <div>
                        <label class="d-block fs-sm fw-semibold text-body dark:text-body mb-1">Subsektor</label>
                        <input type="text" name="subsector" value="[[.Stock.Subsector]]" class="form-control w-100 px-2 py-2 rounded-3 border fs-sm    ">
                    </div>
                    <div>
                        <label class="d-block fs-sm fw-semibold text-body dark:text-body mb-1">Tanggal IPO</label>
                        <input type="date" name="ipo_date" value="[[.Stock.IPO_Date]]" class="form-control w-100 px-2 py-2 rounded-3 border fs-sm    ">
                    </div>
                    <div>
                        <label class="d-block fs-sm fw-semibold text-body dark:text-body mb-1">Lembar Saham</label>
                        <input type="number" name="total_shares" value="[[.Stock.TotalShares]]" class="form-control w-100 px-2 py-2 rounded-3 border fs-sm font-monospace    ">
                    </div>
                    <div class="col-md-12">
                        <label class="d-block fs-sm fw-semibold text-body dark:text-body mb-1">Deskripsi</label>
                        <textarea name="description" rows="4" class="form-control w-100 px-2 py-2 rounded-3 border fs-sm     resize-y">[[.Stock.Description]]</textarea>
                    </div>
                    <div>
                        <label class="d-block fs-sm fw-semibold text-body dark:text-body mb-1">Logo URL</label>
                        <input type="url" name="logo_url" value="[[.Stock.LogoURL]]" placeholder="https://..." class="form-control w-100 px-2 py-2 rounded-3 border fs-sm    ">
                    </div>
                    <div>
                        <label class="d-block fs-sm fw-semibold text-body dark:text-body mb-1">Website</label>
                        <input type="url" name="website" value="[[.Stock.Website]]" placeholder="https://..." class="form-control w-100 px-2 py-2 rounded-3 border fs-sm    ">
                    </div>
                    <div class="col-md-12 d-flex align-items-center gap-3 pt-2">
                        <button type="submit" class="px-2 py-2 rounded-3 bg-gradient bg-gradient-from-blue bg-gradient-to-blue text-white fs-sm fw-semibold    shadow-lg   ">
                            Simpan Perubahan
                        </button>
                        <a href="/admin/saham" class="px-2 py-2 rounded-3 border border dark:border-slate-600 text-muted dark:text-muted  dark:hover:bg-secondary-lt  fs-sm fw-medium">
                            Batal
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="/static/js/app.js" defer></script>
</body>
</html>
