<!DOCTYPE html>
<html lang="id" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/static/sw.js')}</script>
    <title>[[.Title]]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        *{scrollbar-width:thin;scrollbar-color:#334155 #0b1120}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0b1120}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid #334155;border-radius:16px}
        @media(max-width:640px){.card{padding:24px!important}}
    </style>
</head>
<body class="h-full flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-blue-800 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/25">
                    <span class="text-white font-bold text-lg">I</span>
                </div>
                <span class="font-bold text-2xl text-white tracking-tight">Investo</span>
            </a>
        </div>
        <div class="card p-8">
            [[if .Success]]
            <div class="text-center py-4">
                <div class="text-4xl mb-4">✅</div>
                <h1 class="text-xl font-bold text-white mb-2">Terkirim!</h1>
                <p class="text-slate-400 text-sm mb-6">[[.Message]]</p>
                <a href="/login" class="inline-block px-6 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-blue-600 to-blue-700 rounded-xl shadow-lg hover:from-blue-500 hover:to-blue-600 transition-all">Kembali ke Login</a>
            </div>
            [[else]]
            <h1 class="text-2xl font-bold text-white mb-1">Lupa Password</h1>
            <p class="text-slate-400 text-sm mb-6">Masukkan email Anda untuk menerima link reset password.</p>
            [[if .Error]]
            <div class="mb-6 p-4 bg-red-900/20 border border-red-800/50 rounded-xl">
                <div class="flex items-center gap-2 text-red-400 text-sm">
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span>[[.Error]]</span>
                </div>
            </div>
            [[end]]
            <form method="POST" action="/forgot-password" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">Email</label>
                    <input type="email" name="email" id="email" required autofocus
                           class="w-full px-4 py-3 rounded-xl border border-slate-700 bg-slate-800 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 outline-none transition-all text-sm"
                           placeholder="nama@email.com">
                </div>
                <button type="submit"
                        class="w-full py-3 px-6 text-sm font-semibold text-white bg-gradient-to-r from-blue-600 to-blue-700 rounded-xl shadow-lg shadow-blue-500/25 hover:shadow-xl hover:from-blue-500 hover:to-blue-600 transition-all active:scale-[0.98]">
                    Kirim Link Reset
                </button>
            </form>
            <p class="text-center text-sm text-slate-500 mt-6">
                <a href="/login" class="text-blue-400 hover:text-blue-300 transition-colors">Kembali ke login</a>
            </p>
            [[end]]
        </div>
        <p class="text-center text-xs text-slate-500 mt-6">&copy; [[.CurrentYear]] Investo &middot; Platform analisa pasar Indonesia</p>
    </div>
</body>
</html>
