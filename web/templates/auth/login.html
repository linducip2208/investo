[[define "auth/login.html"]]
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[.Title]] &mdash; Investo</title>
    <meta name="description" content="[[if .MetaDescription]][[.MetaDescription]][[else]]Masuk ke Investo — platform analisa saham & forex Indonesia.[[end]]">
    <meta name="theme-color" content="#f4f6fb">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/css/vendor/tabler.css">
    <link rel="stylesheet" href="/static/css/fintech.css">
    <script data-investo-assets>
    (function(){try{var p=localStorage.getItem('investo-theme')||'light';
    var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(d)document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-bs-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();
    </script>
</head>
<body class="d-flex flex-column">
<div class="page page-center">
    <div class="container container-tight py-3">
        <div class="text-center mb-3">
            <a href="/" class="navbar-brand navbar-brand-autodark" aria-label="Investo">
                <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#2065d1"/><path d="M9 21l4.5-6 3.5 3.5L23 11" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="11" r="1.8" fill="#fff"/></svg>
                <span class="fw-bold fs-2 ms-1">Investo</span>
            </a>
        </div>
        <div class="card card-md">
            <div class="card-body">
                <h1 class="card-title text-center mb-1">Masuk ke akun Anda</h1>
                <p class="text-muted text-center mb-3">Belum punya akun? <a href="/register">Daftar gratis</a></p>

                [[if .Error]]
                <div class="alert alert-danger" role="alert">
                    <div class="d-flex">
                        <div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
                        <div>[[.Error]]</div>
                    </div>
                </div>
                [[end]]

                <form method="POST" action="/login" novalidate>
                    <div class="mb-2">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" class="form-control" name="email" id="email" placeholder="nama@email.com" value="[[.Email]]" required autofocus autocomplete="email">
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="password">Password
                            <span class="form-label-description"><a href="/forgot-password">Lupa password?</a></span>
                        </label>
                        <input type="password" class="form-control" name="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <div class="mb-2">
                        <label class="form-check">
                            <input type="checkbox" class="form-check-input" name="remember" id="remember">
                            <span class="form-check-label">Ingat saya</span>
                        </label>
                    </div>
                    <div class="form-footer">
                        <button type="submit" class="btn btn-primary w-100">Masuk</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="card card-md mt-2">
            <div class="card-body">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="text-muted"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span class="fw-semibold">Akun Demo</span>
                </div>
                <div class="text-muted small">
                    <div><span class="fw-semibold">Admin:</span> <code>admin@investo.test</code> / <code>password</code></div>
                    <div><span class="fw-semibold">User:</span> <code>demo@investo.test</code> / <code>password</code></div>
                </div>
            </div>
        </div>
        <p class="text-center text-muted mt-2 small">&copy; [[currentYear]] Investo &middot; Platform analisa pasar Indonesia</p>
    </div>
</div>
<script src="/static/js/app.js" defer></script>
</body>
</html>
[[end]]
