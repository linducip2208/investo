<!DOCTYPE html>
<html lang="id" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/static/sw.js')}</script>
    <title>[[.Title]]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        *{scrollbar-width:thin;scrollbar-color:#334155 #0b1120}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0b1120}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid #334155;border-radius:16px}
        @media(max-width:640px){.card{padding:24px!important}}
    </style>
</head>
<body class="h-full flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-blue-800 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/25">
                    <span class="text-white font-bold text-lg">I</span>
                </div>
                <span class="font-bold text-2xl text-white tracking-tight">Investo</span>
            </a>
        </div>
        <div class="card p-8 text-center">
            [[if .Success]]
            <div class="text-5xl mb-4">✅</div>
            <h1 class="text-2xl font-bold text-white mb-2">Email Terverifikasi!</h1>
            <p class="text-slate-400 text-sm mb-6">Akun Anda sudah aktif. Silakan login untuk mulai menggunakan Investo.</p>
            <a href="/login" class="inline-block px-6 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-blue-600 to-blue-700 rounded-xl shadow-lg hover:from-blue-500 hover:to-blue-600 transition-all">Login Sekarang</a>
            [[else]]
            <div class="text-5xl mb-4">❌</div>
            <h1 class="text-2xl font-bold text-white mb-2">Verifikasi Gagal</h1>
            <p class="text-slate-400 text-sm mb-2">[[.Error]]</p>
            <a href="/login" class="inline-block px-6 py-2.5 text-sm font-semibold text-slate-400 hover:text-white transition-colors mt-4">Kembali ke Login</a>
            [[end]]
        </div>
        <p class="text-center text-xs text-slate-500 mt-6">&copy; [[currentYear]] Investo &middot; Platform analisa pasar Indonesia</p>
    </div>
</body>
</html>
