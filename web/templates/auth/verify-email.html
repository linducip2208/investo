<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[.Title]]</title>
    <meta name="theme-color" content="#f4f6fb">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/css/vendor/tabler.css">
    <link rel="stylesheet" href="/static/css/fintech.css">
    <script data-investo-assets>
    (function(){try{var p=localStorage.getItem('investo-theme')||'light';
    var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(d)document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-bs-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();
    </script>
</head>
<body class="d-flex flex-column">
<div class="page page-center">
    <div class="container container-tight py-3">
        <div class="text-center mb-3">
            <a href="/" class="navbar-brand navbar-brand-autodark" aria-label="Investo">
                <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#2065d1"/><path d="M9 21l4.5-6 3.5 3.5L23 11" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="11" r="1.8" fill="#fff"/></svg>
                <span class="fw-bold fs-2 ms-1">Investo</span>
            </a>
        </div>
        <div class="card card-md">
            <div class="card-body">
                [[if .Success]]
                <div class="empty">
                    <div class="empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
                    <p class="empty-title">Email Terverifikasi!</p>
                    <p class="empty-subtitle">Akun Anda sudah aktif. Silakan login untuk mulai menggunakan Investo.</p>
                    <div class="empty-action"><a href="/login" class="btn btn-primary">Login Sekarang</a></div>
                </div>
                [[else]]
                <div class="empty">
                    <div class="empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
                    <p class="empty-title">Verifikasi Gagal</p>
                    <p class="empty-subtitle">[[.Error]]</p>
                    <div class="empty-action"><a href="/login" class="btn">Kembali ke Login</a></div>
                </div>
                [[end]]
            </div>
        </div>
        <p class="text-center text-muted mt-2 small">&copy; [[currentYear]] Investo &middot; Platform analisa pasar Indonesia</p>
    </div>
</div>
<script src="/static/js/app.js" defer></script>
</body>
</html>
