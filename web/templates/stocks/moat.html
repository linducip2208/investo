<!DOCTYPE html>
<html lang="id" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[.Title]]</title>
    <link rel="stylesheet" href="/static/css/vendor/tabler.css">
    <link rel="stylesheet" href="/static/css/legacy-compat.css">
    <link rel="stylesheet" href="/static/css/fintech.css">
    <script data-investo-assets>
    (function(){try{var p=localStorage.getItem('investo-theme')||'light';
    var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(d)document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-bs-theme',d?'dark':'light');document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();
    </script>
    <script src="/static/js/vendor/chart.umd.min.js"></script>
    <script defer src="/static/js/vendor/alpine.min.js"></script>
    <style>
        *{scrollbar-width:thin;scrollbar-color:#334155 #0b1120}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0b1120}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid rgba(51,65,85,.5);border-radius:14px;transition:all .2s}
        .card:hover{border-color:#475569}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:500;transition:all .15s;text-decoration:none}
        .sidebar-link:hover{background:#1e293b;color:#e2e8f0}
        .sidebar-link.active{background:#1e3a8a;color:#93c5fd;font-weight:600}
        .star-filled{color:#fbbf24}
        .star-empty{color:#334155}
        .moat-wide{background:linear-gradient(135deg,#064e3b,#065f46);border-color:#059669}
        .moat-narrow{background:linear-gradient(135deg,#451a03,#78350f);border-color:#f59e0b}
        .moat-none{background:linear-gradient(135deg,#450a0a,#7f1d1d);border-color:#dc2626}
        @media(max-width:1024px){.sidebar{display:none}.sidebar.open{display:flex}}
    </style>
<style data-investo-compat>
    body{background:var(--ui-bg)!important;color:var(--ui-text)!important}
    .card{background:var(--ui-surface)!important;border-color:var(--ui-border)!important;color:var(--ui-text)!important}
    .text-success{color:var(--ui-success)!important}.text-danger{color:var(--ui-danger)!important}
    .widget-title{color:var(--ui-muted)!important}
    </style>
</head>
<body class="h-100 d-flex" x-data="moatAnalysis()" x-init="init()">

<script>
function moatAnalysis() {
    return {
        sidebarOpen: false,
        chart: null,
        result: null,
        loading: true,
        code: '[[.Code]]',
        init() { this.fetchData(); },
        async fetchData() {
            try {
                var resp = await fetch('/api/stocks/' + this.code + '/moat');
                var data = await resp.json();
                this.result = data;
                this.loading = false;
                this.$nextTick(() => this.renderChart());
            } catch(e) { this.loading = false; }
        },
        renderChart() {
            if (this.chart) this.chart.destroy();
            var ctx = document.getElementById('moatRadar');
            if (!ctx || !this.result || !this.result.dimensions) return;
            this.chart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: this.result.dimensions.map(d => d.name),
                    datasets: [{
                        label: 'Moat Strength',
                        data: this.result.dimensions.map(d => d.stars),
                        backgroundColor: 'rgba(59,130,246,0.2)',
                        borderColor: '#3b82f6',
                        borderWidth: 2,
                        pointBackgroundColor: '#3b82f6',
                        pointBorderColor: '#1e40af',
                        pointRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { r: { beginAtZero: true, max: 5, ticks: { stepSize: 1, color: '#64748b', backdropColor: 'transparent' }, grid: { color: 'rgba(51,65,85,0.5)' }, pointLabels: { color: '#e2e8f0', font: { size: 11, family: 'Inter', weight: '600' } } } },
                    plugins: { legend: { display: false } }
                }
            });
        },
        starDisplay(stars) {
            var html = '';
            for (var i = 1; i <= 5; i++) {
                html += i <= stars ? '\u2605' : '\u2606';
            }
            return html;
        },
        moatClass(w) {
            if (w === 'Wide Moat') return 'moat-wide';
            if (w === 'Narrow Moat') return 'moat-narrow';
            return 'moat-none';
        }
    }
}
</script>

<!-- SIDEBAR -->
<aside class="sidebar position-fixed top-0 bottom-0 start-0 z-3 w-60 bg-body dark:bg-[#0b1120] border-end border dark:border-slate-800 d-flex flex-column" class="d-none d-md-block">
    <div class="d-flex align-items-center gap-3 px-2 h-16 border-bottom border dark:border-slate-800">
        <div class="w-8 h-8 rounded-2 bg-gradient bg-gradient-from-blue bg-gradient-to-blue d-flex align-items-center justify-content-center fw-bold text-white fs-sm">I</div>
        <span class="fw-bold fs-3 text-white">Investo</span>
    </div>
    <nav class="flex-fill overflow-y-auto px-2 py-2 vstack gap-1">
        <a href="/dashboard" class="sidebar-link"><span>&#x1F4CA;</span> Dashboard</a>
        <a href="/saham" class="sidebar-link"><span>&#x1F4C8;</span> Saham IDX</a>
        <a href="/saham/[[.Code]]" class="sidebar-link"><span>&#x1F50D;</span> Detail [[.Code]]</a>
        <a href="/saham/[[.Code]]/fundamental" class="sidebar-link"><span>&#x1F4CA;</span> Fundamental</a>
        <a href="/saham/[[.Code]]/teknikal" class="sidebar-link"><span>&#x1F4C8;</span> Teknikal</a>
        <a href="/saham/[[.Code]]/moat" class="sidebar-link active"><span>&#x1F6E1;</span> Moat Analysis</a>
    </nav>
</aside>

<!-- MAIN -->
<div class="flex-fill ml-60 min-vh-100 d-flex flex-column">
    <header class="position-sticky top-0 z-2 h-16 bg-body bg-opacity-100 dark:bg-[#0b1120]/90  border-bottom border dark:border-slate-800 d-flex align-items-center px-2 px-lg-5 gap-4">
        <button onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');document.getElementById('sb-overlay').classList.toggle('hidden')" class="d-lg-none p-2 text-muted dark:text-muted "><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="flex-fill max-w-md d-none d-sm-block">
            <input type="text" placeholder="Cari saham, forex, atau halaman..." class="w-100 bg-white dark:bg-white border border dark:border rounded-3 px-2 py-2 fs-sm text-white      " onkeydown="if(event.key==='Enter'){var q=this.value.trim();if(q.length>1)location.href='/saham?search='+encodeURIComponent(q)}">
        </div>
        <div class="d-flex align-items-center gap-2 ms-auto">
            [[if .User]]
            <div class="d-flex align-items-center gap-2 ps-2 border-start border dark:border">
                <div class="w-8 h-8 rounded-pill bg-gradient bg-gradient-from-blue bg-gradient-to-blue d-flex align-items-center justify-content-center text-white fs-xs fw-bold">[[slice .User.Name 0 1]]</div>
                <span class="fs-sm fw-medium text-white d-none d-sm-block">[[.User.Name]]</span>
            </div>
            [[else]]
            <a href="/login" class="px-2 py-2 bg-primary  text-white fs-sm fw-medium rounded-3 ">Masuk</a>
            [[end]]
        </div>
    </header>

    <main class="flex-fill p-2 p-lg-4 vstack gap-3 overflow-y-auto">
        <div>
            <h1 class="fs-2 fs-1 fw-bold text-white">Moat Analysis: <span x-text="code"></span></h1>
            <p class="fs-sm text-muted dark:text-muted mt-0">Economic moat assessment across 5 dimensions. How strong is the competitive advantage?</p>
            <template x-if="result && result.is_illustrative">
                <div class="card p-2 mt-2 border-warning bg-warning bg-opacity-10">
                    <p class="fs-xs text-warning">⚠️ <span class="fw-semibold">Data ilustratif</span> — contoh, bukan data real-time. <span class="text-muted dark:text-muted" x-text="'Sumber: ' + (result.source || '-') + (result.as_of ? ' · per ' + result.as_of : '')"></span></p>
                </div>
            </template>
            <p class="fs-xs text-muted mt-2" x-show="result && !result.is_illustrative && result.source" x-text="'Sumber: ' + result.source + (result.as_of ? ' · per ' + result.as_of : '')"></p>
        </div>

        <template x-if="loading">
            <div class="vstack gap-3">
                <div class="card p-2 "><div class="h-64 bg-body bg-opacity-25 dark:bg-secondary-lt/30 rounded-2"></div></div>
            </div>
        </template>

        <template x-if="!loading && result">
            <div class="vstack gap-3">
                <div class="card p-2 text-center" :class="moatClass(result.moat_width)">
                    <h3 class="fs-sm text-muted dark:text-muted mb-1">Moat Width</h3>
                    <p class="fs-1 fw-bolder text-white" x-text="result.moat_width"></p>
                    <p class="fs-sm text-muted dark:text-muted mt-1"><span class="font-monospace text-white" x-text="result.total_stars.toFixed(1)"></span> / 25 stars</p>
                </div>

                <div class="row row-cols-1 row-cols-lg-5 gap-4">
                    <div class="col-lg-5">
                        <div class="card p-2">
                            <h3 class="fs-sm fw-semibold text-body dark:text-body mb-2">Moat Radar</h3>
                            <div style="height:350px"><canvas id="moatRadar"></canvas></div>
                        </div>
                    </div>
                    <div class="col-lg-7">
                        <div class="card p-2 vstack gap-2">
                            <h3 class="fs-sm fw-semibold text-body dark:text-body mb-2">Dimension Breakdown</h3>
                            <template x-for="dim in result.dimensions" :key="dim.name">
                                <div class="bg-white bg-opacity-50 dark:bg-white/50 rounded-3 p-2">
                                    <div class="d-flex align-items-center justify-content-between mb-1">
                                        <span class="fs-sm fw-semibold text-body dark:text-slate-200" x-text="dim.name"></span>
                                        <span class="font-monospace fs-sm" :class="{'text-warning': dim.stars >= 4, 'text-muted': dim.stars < 4}">
                                            <span x-show="dim.stars >= 1">&#x2605;</span>
                                            <span x-show="dim.stars >= 2">&#x2605;</span>
                                            <span x-show="dim.stars >= 3">&#x2605;</span>
                                            <span x-show="dim.stars >= 4">&#x2605;</span>
                                            <span x-show="dim.stars >= 5">&#x2605;</span>
                                            <span x-show="dim.stars < 1">&#x2606;&#x2606;&#x2606;&#x2606;&#x2606;</span>
                                            <span x-show="dim.stars >= 1 && dim.stars < 2">&#x2606;&#x2606;&#x2606;&#x2606;</span>
                                            <span x-show="dim.stars >= 2 && dim.stars < 3">&#x2606;&#x2606;&#x2606;</span>
                                            <span x-show="dim.stars >= 3 && dim.stars < 4">&#x2606;&#x2606;</span>
                                            <span x-show="dim.stars >= 4 && dim.stars < 5">&#x2606;</span>
                                            <span class="ms-1 fs-xs" x-text="dim.stars + '/5'"></span>
                                        </span>
                                    </div>
                                    <p class="fs-xs text-muted lh-lg" x-text="dim.description"></p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="card p-2">
                    <h3 class="fs-sm fw-semibold text-body dark:text-body mb-2">Moat Narrative</h3>
                    <p class="fs-sm text-muted dark:text-muted lh-lg" x-text="result.narrative"></p>
                </div>
            </div>
        </template>
    </main>
</div>
<div id="sb-overlay" class="position-fixed top-0 bottom-0 start-0 end-0 z-2 bg-black bg-opacity-50  d-none" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div>    <script src="/static/js/app.js" defer></script>
</body>
</html>
