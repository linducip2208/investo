    <script>
        function mlPredict() {
            return {
                sidebarOpen: false, stockCode: '[[.StockCode]]', days: 7, prediction: null, loading: false, error: null,
                prices: [], chartReady: false,
                async init() {
                    if (this.stockCode) { this.predict(); }
                },
                async predict() {
                    if (!this.stockCode) return;
                    this.loading = true; this.error = null; this.prediction = null;
                    try {
                        var res = await fetch('/api/stocks/' + encodeURIComponent(this.stockCode) + '/predict?days=' + this.days);
                        if (!res.ok) { var err = await res.json(); this.error = err.error || 'Prediction failed'; this.loading = false; return; }
                        this.prediction = await res.json();
                        await this.fetchChartData();
                        this.loading = false;
                        setTimeout(() => { if(this.prediction) this.renderChart(); }, 200);
                    } catch(e) { this.error = 'Network error'; this.loading = false; }
                },
                async fetchChartData() {
                    try {
                        var d = new Date(); var end = d.toISOString().substring(0,10);
                        d.setDate(d.getDate() - 90); var start = d.toISOString().substring(0,10);
                        var res = await fetch('/stocks/' + encodeURIComponent(this.stockCode) + '/chart?start=' + start + '&end=' + end);
                        if (!res.ok) return;
                        var data = await res.json();
                        if (data && data.candles) {
                            this.prices = data.candles.map(function(c) { return { date: c.time, open: c.open, high: c.high, low: c.low, close: c.close }; });
                        } else if (data && data.ohlc) {
                            this.prices = data.ohlc;
                        } else if (Array.isArray(data)) {
                            this.prices = data;
                        }
                    } catch(e) {}
                },
                renderChart() {
                    var container = document.getElementById('regression-chart');
                    if (!container || !this.prediction) return;
                    container.innerHTML = '';

                    var chart = LightweightCharts.createChart(container, {
                        layout: { background: { color: '#1e293b' }, textColor: '#94a3b8' },
                        grid: { vertLines: { color: '#334155' }, horzLines: { color: '#334155' } },
                        crosshair: { mode: 0 },
                        rightPriceScale: { borderColor: '#475569' },
                        timeScale: { borderColor: '#475569', timeVisible: true },
                        width: container.clientWidth,
                        height: 400
                    });

                    var candleSeries = chart.addCandlestickSeries({
                        upColor: '#34d399', downColor: '#f87171', borderUpColor: '#34d399', borderDownColor: '#f87171',
                        wickUpColor: '#34d399', wickDownColor: '#f87171'
                    });

                    var priceData = this.getPriceData();
                    if (priceData.length > 0) {
                        candleSeries.setData(priceData);
                    }

                    var regressionLine = chart.addLineSeries({
                        color: '#60a5fa', lineWidth: 2, lineStyle: 0, priceLineVisible: false
                    });

                    var regData = this.getRegressionLineData();
                    if (regData.length > 0) {
                        regressionLine.setData(regData);
                    }

                    var upperLine = chart.addLineSeries({
                        color: 'rgba(96,165,250,0.3)', lineWidth: 1, lineStyle: 2, priceLineVisible: false
                    });

                    var lowerLine = chart.addLineSeries({
                        color: 'rgba(96,165,250,0.3)', lineWidth: 1, lineStyle: 2, priceLineVisible: false
                    });

                    var upperData = this.getConfidenceBandData('upper');
                    var lowerData = this.getConfidenceBandData('lower');
                    if (upperData.length > 0) upperLine.setData(upperData);
                    if (lowerData.length > 0) lowerLine.setData(lowerData);

                    var supportLine = chart.addLineSeries({
                        color: 'rgba(16,185,129,0.5)', lineWidth: 1, lineStyle: 2, priceLineVisible: false
                    });
                    var resistanceLine = chart.addLineSeries({
                        color: 'rgba(239,68,68,0.5)', lineWidth: 1, lineStyle: 2, priceLineVisible: false
                    });

                    var srData = this.getSRData();
                    supportLine.setData(srData.support);
                    resistanceLine.setData(srData.resistance);

                    chart.timeScale().fitContent();

                    window.addEventListener('resize', function() {
                        chart.applyOptions({ width: container.clientWidth });
                    });
                },
                getPriceData() {
                    return this.prices.map(function(p) {
                        return {
                            time: p.date ? p.date.substring(0, 10) : '',
                            open: p.open || p.close,
                            high: p.high || p.close,
                            low: p.low || p.close,
                            close: p.close
                        };
                    }).filter(function(p) { return p.time; }).slice(-90);
                },
                getRegressionLineData() {
                    if (!this.prediction || !this.prices.length) return [];
                    var slope = this.prediction.slope;
                    var intercept = this.prediction.intercept;
                    var priceData = this.getPriceData();
                    var result = [];
                    for (var i = 0; i < priceData.length; i++) {
                        result.push({
                            time: priceData[i].time,
                            value: parseFloat((slope * i + intercept).toFixed(2))
                        });
                    }
                    for (var j = 0; j <= this.days; j++) {
                        var d = new Date();
                        d.setDate(d.getDate() + j);
                        var t = d.toISOString().substring(0, 10);
                        result.push({
                            time: t,
                            value: parseFloat((slope * (priceData.length + j) + intercept).toFixed(2))
                        });
                    }
                    return result;
                },
                getConfidenceBandData(type) {
                    if (!this.prediction) return [];
                    var priceData = this.getPriceData();
                    var result = [];
                    var se = (this.prediction.upper_bound - this.prediction.lower_bound) / (2 * 1.96);
                    for (var i = 0; i < priceData.length; i++) {
                        var val = this.prediction.intercept + this.prediction.slope * i;
                        result.push({
                            time: priceData[i].time,
                            value: type === 'upper' ? parseFloat((val + se).toFixed(2)) : parseFloat((val - se).toFixed(2))
                        });
                    }
                    for (var j = 0; j <= this.days; j++) {
                        var d = new Date();
                        d.setDate(d.getDate() + j);
                        var t = d.toISOString().substring(0, 10);
                        var forecast = this.prediction.forecast[j];
                        if (forecast) {
                            result.push({
                                time: t,
                                value: type === 'upper' ? forecast.high : forecast.low
                            });
                        }
                    }
                    return result;
                },
                getSRData() {
                    var data = { support: [], resistance: [] };
                    if (!this.prediction) return data;
                    var priceData = this.getPriceData();
                    if (priceData.length === 0) return data;
                    var support = this.prediction.support;
                    var resistance = this.prediction.resistance;
                    for (var i = 0; i < priceData.length; i++) {
                        data.support.push({ time: priceData[i].time, value: support });
                        data.resistance.push({ time: priceData[i].time, value: resistance });
                    }
                    if (this.prediction.forecast && this.prediction.forecast.length > 0) {
                        var lastDate = this.prediction.forecast[this.prediction.forecast.length - 1].date;
                        data.support.push({ time: lastDate, value: support });
                        data.resistance.push({ time: lastDate, value: resistance });
                    }
                    return data;
                },
                formatPrice(v) { if(!v) return '-'; return 'Rp '+Number(v).toLocaleString('id-ID'); },
                formatPct(v) { if(v===null||v===undefined) return '-'; return v.toFixed(2)+'%'; },
                trendIcon(t) { if(t==='up') return '&#x1F4C8;'; if(t==='down') return '&#x1F4C9;'; return '&#x27F7;'; },
                trendLabel(t) { if(t==='up') return 'UPTREND'; if(t==='down') return 'DOWNTREND'; return 'SIDEWAYS'; },
                trendClass(t) { if(t==='up') return 'bg-success-lt'; if(t==='down') return 'bg-danger-lt'; return 'badge-sideways'; },
                confidenceColor(v) {
                    if (v >= 70) return '#34d399';
                    if (v >= 40) return '#fbbf24';
                    return '#f87171';
                },
                hasPrediction() { return this.prediction !== null; },
                hasError() { return this.error !== null; }
            }
        }
    </script>

    <div class="flex-fill ml-60 min-vh-100 d-flex flex-column">
        <header class="position-sticky top-0 z-2 h-16 bg-body bg-opacity-100 dark:bg-[#0b1120]/90  border-bottom border dark:border-slate-800 d-flex align-items-center px-2 px-lg-5 gap-4">
            <button onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');document.getElementById('sb-overlay').classList.toggle('hidden')" class="d-lg-none p-2 text-muted dark:text-slate-400 "><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
            <div class="d-flex align-items-center gap-3">
                <a :href="'/saham/'+stockCode" class="font-monospace fw-bold fs-3 text-primary " x-text="stockCode"></a>
                <span class="fs-sm text-muted dark:text-slate-400">&#x2022;</span>
                <span class="fs-sm text-muted dark:text-slate-400">ML Price Prediction</span>
            </div>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <div class="d-flex align-items-center gap-2 ps-2 border-start border dark:border">
                    <div class="w-8 h-8 rounded-pill bg-gradient bg-gradient-from-blue bg-gradient-to-blue d-flex align-items-center justify-content-center text-white fs-xs fw-bold">[[slice .User.Name 0 1]]</div>
                    <span class="fs-sm fw-medium text-white d-none d-sm-block">[[.User.Name]]</span>
                </div>
            </div>
        </header>

        <main class="flex-fill p-2 p-lg-4 vstack gap-3 overflow-y-auto">
            <div class="d-flex align-items-center gap-3">
                <div class="flex-fill max-w-xs">
                    <input type="text" x-model="stockCode" placeholder="Stock code (e.g. BBCA)" @keydown.enter="predict()" class="w-100 bg-white dark:bg-white border border dark:border rounded-3 px-2 py-2 fs-sm font-monospace text-white       text-uppercase">
                </div>
                <select x-model.number="days" @change="predict()" class="bg-white dark:bg-white border border dark:border rounded-3 px-2 py-2 fs-sm text-white  ">
                    <option value="3">3 days</option>
                    <option value="5">5 days</option>
                    <option value="7" selected>7 days</option>
                    <option value="14">14 days</option>
                    <option value="30">30 days</option>
                </select>
                <button @click="predict()" class="px-2 py-2 bg-gradient bg-gradient-from-blue bg-gradient-to-blue text-white rounded-3 fs-sm fw-semibold   shadow-lg  ">
                    &#x1F9E0; Predict
                </button>
            </div>

            <template x-if="error">
            <div class="bg-danger bg-opacity-10 border border-danger rounded-3 p-2 fs-sm text-danger" x-text="error"></div>
            </template>

            <template x-if="loading">
            <div class="vstack gap-3">
                <div class="row row-cols-2 row-cols-lg-4 gap-3">
                    <template x-for="i in 4" :key="i">
                        <div class="card p-2 animate-shimmer" style="height:90px"></div>
                    </template>
                </div>
                <div class="card animate-shimmer" style="height:400px"></div>
            </div>
            </template>

            <template x-if="!loading && prediction">
            <div>
                <div class="row row-cols-2 row-cols-lg-4 gap-3 mb-2">
                    <div class="prediction-card text-center">
                        <div class="fs-xs text-muted text-uppercase  mb-1">Predicted Price</div>
                        <div class="fs-1 fw-bold text-white font-monospace" x-text="formatPrice(prediction.predicted_price)"></div>
                        <div class="fs-xs text-muted mt-1" x-text="'in '+days+' days'"></div>
                    </div>
                    <div class="prediction-card text-center">
                        <div class="fs-xs text-muted text-uppercase  mb-1">Confidence</div>
                        <div class="d-flex justify-content-center">
                            <div class="confidence-circle" :style="'border:4px solid '+confidenceColor(prediction.confidence)+';color:'+confidenceColor(prediction.confidence)">
                                <span x-text="prediction.confidence+'%'"></span>
                            </div>
                        </div>
                    </div>
                    <div class="prediction-card text-center">
                        <div class="fs-xs text-muted text-uppercase  mb-1">Price Range</div>
                        <div class="fs-sm text-white font-monospace">
                            <span class="text-success" x-text="formatPrice(prediction.lower_bound)"></span>
                            <span class="text-muted mx-1">-</span>
                            <span class="text-danger" x-text="formatPrice(prediction.upper_bound)"></span>
                        </div>
                    </div>
                    <div class="prediction-card text-center">
                        <div class="fs-xs text-muted text-uppercase  mb-1">Trend</div>
                        <div class="d-flex align-items-center justify-content-center gap-2">
                            <span class="bg-info-lt" :class="trendClass(prediction.trend)">
                                <span x-html="trendIcon(prediction.trend)"></span>
                                <span x-text="trendLabel(prediction.trend)"></span>
                            </span>
                        </div>
                    </div>
                </div>

                <div class="row row-cols-2 row-cols-md-4 gap-3 mb-2">
                    <div class="card p-2 text-center">
                        <div class="fs-sm font-monospace text-primary fw-bold" x-text="'R2 = '+prediction.r_squared.toFixed(4)"></div>
                        <div class="fs-xs text-muted mt-0">R-squared</div>
                    </div>
                    <div class="card p-2 text-center">
                        <div class="fs-sm font-monospace fw-bold" :class="prediction.slope >= 0 ? 'text-green-400' : 'text-red-400'" x-text="prediction.slope.toFixed(4)"></div>
                        <div class="fs-xs text-muted mt-0">Slope</div>
                    </div>
                    <div class="card p-2 text-center">
                        <div class="fs-sm font-monospace text-success fw-bold" x-text="formatPrice(prediction.support)"></div>
                        <div class="fs-xs text-muted mt-0">Support</div>
                    </div>
                    <div class="card p-2 text-center">
                        <div class="fs-sm font-monospace text-danger fw-bold" x-text="formatPrice(prediction.resistance)"></div>
                        <div class="fs-xs text-muted mt-0">Resistance</div>
                    </div>
                </div>

                <div class="card p-2 mb-2">
                    <h3 class="widget-title">&#x1F4C8; Regression Chart</h3>
                    <div id="regression-chart" style="width:100%;height:400px;border-radius:8px"></div>
                    <div class="d-flex flex-wrap align-items-center gap-4 mt-2 fs-xs text-muted">
                        <span class="d-flex align-items-center gap-1"><span class="w-3 h-0.5 bg-primary d-inline-block"></span> Regression Line</span>
                        <span class="d-flex align-items-center gap-1"><span class="w-3 h-0.5 bg-primary bg-opacity-25 d-inline-block" style="border-top:1px dashed"></span> Confidence Band</span>
                        <span class="d-flex align-items-center gap-1"><span class="w-3 h-0.5 bg-success bg-opacity-50 d-inline-block" style="border-top:1px dashed"></span> Support</span>
                        <span class="d-flex align-items-center gap-1"><span class="w-3 h-0.5 bg-danger bg-opacity-50 d-inline-block" style="border-top:1px dashed"></span> Resistance</span>
                    </div>
                </div>

                <div class="card overflow-hidden">
                    <div class="px-2 py-2 border-bottom border dark:border">
                        <h3 class="widget-title mb-0">&#x1F4C5; <span x-text="days+'-Day Forecast'"></span></h3>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-vcenter table-hover w-100">
                            <thead>
                                <tr class="border-bottom border dark:border">
                                    <th class="table-header text-start px-2 py-2">Date</th>
                                    <th class="table-header text-end px-2 py-2">Predicted Low</th>
                                    <th class="table-header text-end px-2 py-2">Predicted Mid</th>
                                    <th class="table-header text-end px-2 py-2">Predicted High</th>
                                    <th class="table-header text-center px-2 py-2">Range</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="f in prediction.forecast" :key="f.date">
                                <tr class="table-row border-bottom border dark:border-slate-800/50 animate-fade-slide">
                                    <td class="px-2 py-2 font-monospace fs-sm text-body dark:text-body" x-text="f.date"></td>
                                    <td class="px-2 py-2 text-end font-monospace fs-sm text-success" x-text="formatPrice(f.low)"></td>
                                    <td class="px-2 py-2 text-end font-monospace fs-sm text-white fw-bold" x-text="formatPrice(f.mid)"></td>
                                    <td class="px-2 py-2 text-end font-monospace fs-sm text-danger" x-text="formatPrice(f.high)"></td>
                                    <td class="px-2 py-2 text-center">
                                        <div class="d-flex align-items-center justify-content-center gap-1">
                                            <span class="fs-6 text-muted">IDR</span>
                                            <span class="font-monospace fs-xs text-body dark:text-body" x-text="formatPrice(f.high - f.low)"></span>
                                        </div>
                                    </td>
                                </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="bg-warning bg-opacity-10 border border-warning rounded-3 p-2 fs-sm text-warning d-flex align-items-start gap-3">
                    <span class="fs-3 flex-shrink-0">&#x26A0;</span>
                    <div>
                        <span class="fw-semibold">Disclaimer:</span> Prediksi berbasis regresi linear sederhana, bukan jaminan. Data historis tidak menjamin performa masa depan. Gunakan sebagai referensi tambahan, bukan dasar keputusan investasi tunggal.
                    </div>
                </div>
            </div>
            </template>

            <template x-if="!loading && !prediction && !error">
            <div class="card text-center py-2">
                <div class="display-4 mb-2">&#x1F9E0;</div>
                <p class="text-muted dark:text-slate-400 fw-medium fs-3">Masukkan kode saham dan klik Predict</p>
                <p class="text-muted fs-sm mt-1">Model regresi linear akan menganalisa 90 hari data historis untuk memproyeksikan harga.</p>
            </div>
            </template>
        </main>
    </div>
    <style>@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}.animate-shimmer{background:linear-gradient(90deg,#1e293b 25%,#334155 50%,#1e293b 75%);background-size:200% 100%;animation:shimmer 1.8s infinite}</style>
    <div id="sb-overlay" class="position-fixed top-0 bottom-0 start-0 end-0 z-2 bg-black bg-opacity-50  d-none" onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');this.classList.toggle('hidden')"></div>
    <script src="/static/js/app.js" defer></script>
</body>
</html>
