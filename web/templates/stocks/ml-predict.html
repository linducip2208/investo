<html lang="id" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[.Title]]</title>
    <meta name="description" content="ML Price Prediction dengan regresi linear. Prediksi harga [[.StockCode]] berbasis data historis 90 hari.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        *{scrollbar-width:thin;scrollbar-color:#334155 #0b1120}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0b1120}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
        body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:#0b1120;color:#e2e8f0}
        .card{background:#1e293b;border:1px solid #334155;border-radius:14px;transition:all .2s}
        .card:hover{border-color:#475569}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:500;transition:all .15s;text-decoration:none}
        .sidebar-link:hover{background:#1e293b;color:#e2e8f0}
        .sidebar-link.active{background:#1e3a8a;color:#93c5fd;font-weight:600}
        .sidebar-link .icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:16px}
        .widget-title{font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
        .prediction-card{background:linear-gradient(135deg,#1e293b 0%,#1e3a5f 100%);border:1px solid #334155;border-radius:14px;padding:20px}
        .badge-trend{border-radius:6px;font-size:11px;font-weight:700;padding:4px 10px;letter-spacing:.03em;display:inline-flex;align-items:center;gap:4px}
        .badge-up{background:rgba(16,185,129,.18);color:#34d399;border:1px solid rgba(16,185,129,.3)}
        .badge-down{background:rgba(239,68,68,.18);color:#f87171;border:1px solid rgba(239,68,68,.3)}
        .badge-sideways{background:rgba(148,163,184,.15);color:#94a3b8;border:1px solid rgba(148,163,184,.25)}
        .confidence-circle{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;font-family:'JetBrains Mono',monospace}
        .table-header{font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em}
        @keyframes fadeSlideUp{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
        .animate-fade-slide{animation:fadeSlideUp .4s ease-out forwards}
        @media(max-width:1024px){.sidebar{display:none}.sidebar.open{display:flex}}
        @media(max-width:768px){.table-responsive{display:block;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}}
    </style>
</head>
<body class="h-full flex" x-data="mlPredict()">
    <script>
        function mlPredict() {
            return {
                sidebarOpen: false, stockCode: '[[.StockCode]]', days: 7, prediction: null, loading: false, error: null,
                prices: [], chartReady: false,
                async init() {
                    if (this.stockCode) { this.predict(); }
                },
                async predict() {
                    if (!this.stockCode) return;
                    this.loading = true; this.error = null; this.prediction = null;
                    try {
                        var res = await fetch('/api/stocks/' + encodeURIComponent(this.stockCode) + '/predict?days=' + this.days);
                        if (!res.ok) { var err = await res.json(); this.error = err.error || 'Prediction failed'; this.loading = false; return; }
                        this.prediction = await res.json();
                        await this.fetchChartData();
                        this.loading = false;
                        setTimeout(() => { if(this.prediction) this.renderChart(); }, 200);
                    } catch(e) { this.error = 'Network error'; this.loading = false; }
                },
                async fetchChartData() {
                    try {
                        var d = new Date(); var end = d.toISOString().substring(0,10);
                        d.setDate(d.getDate() - 90); var start = d.toISOString().substring(0,10);
                        var res = await fetch('/stocks/' + encodeURIComponent(this.stockCode) + '/chart?start=' + start + '&end=' + end);
                        if (!res.ok) return;
                        var data = await res.json();
                        if (data && data.candles) {
                            this.prices = data.candles.map(function(c) { return { date: c.time, open: c.open, high: c.high, low: c.low, close: c.close }; });
                        } else if (data && data.ohlc) {
                            this.prices = data.ohlc;
                        } else if (Array.isArray(data)) {
                            this.prices = data;
                        }
                    } catch(e) {}
                },
                renderChart() {
                    var container = document.getElementById('regression-chart');
                    if (!container || !this.prediction) return;
                    container.innerHTML = '';

                    var chart = LightweightCharts.createChart(container, {
                        layout: { background: { color: '#1e293b' }, textColor: '#94a3b8' },
                        grid: { vertLines: { color: '#334155' }, horzLines: { color: '#334155' } },
                        crosshair: { mode: 0 },
                        rightPriceScale: { borderColor: '#475569' },
                        timeScale: { borderColor: '#475569', timeVisible: true },
                        width: container.clientWidth,
                        height: 400
                    });

                    var candleSeries = chart.addCandlestickSeries({
                        upColor: '#34d399', downColor: '#f87171', borderUpColor: '#34d399', borderDownColor: '#f87171',
                        wickUpColor: '#34d399', wickDownColor: '#f87171'
                    });

                    var priceData = this.getPriceData();
                    if (priceData.length > 0) {
                        candleSeries.setData(priceData);
                    }

                    var regressionLine = chart.addLineSeries({
                        color: '#60a5fa', lineWidth: 2, lineStyle: 0, priceLineVisible: false
                    });

                    var regData = this.getRegressionLineData();
                    if (regData.length > 0) {
                        regressionLine.setData(regData);
                    }

                    var upperLine = chart.addLineSeries({
                        color: 'rgba(96,165,250,0.3)', lineWidth: 1, lineStyle: 2, priceLineVisible: false
                    });

                    var lowerLine = chart.addLineSeries({
                        color: 'rgba(96,165,250,0.3)', lineWidth: 1, lineStyle: 2, priceLineVisible: false
                    });

                    var upperData = this.getConfidenceBandData('upper');
                    var lowerData = this.getConfidenceBandData('lower');
                    if (upperData.length > 0) upperLine.setData(upperData);
                    if (lowerData.length > 0) lowerLine.setData(lowerData);

                    var supportLine = chart.addLineSeries({
                        color: 'rgba(16,185,129,0.5)', lineWidth: 1, lineStyle: 2, priceLineVisible: false
                    });
                    var resistanceLine = chart.addLineSeries({
                        color: 'rgba(239,68,68,0.5)', lineWidth: 1, lineStyle: 2, priceLineVisible: false
                    });

                    var srData = this.getSRData();
                    supportLine.setData(srData.support);
                    resistanceLine.setData(srData.resistance);

                    chart.timeScale().fitContent();

                    window.addEventListener('resize', function() {
                        chart.applyOptions({ width: container.clientWidth });
                    });
                },
                getPriceData() {
                    return this.prices.map(function(p) {
                        return {
                            time: p.date ? p.date.substring(0, 10) : '',
                            open: p.open || p.close,
                            high: p.high || p.close,
                            low: p.low || p.close,
                            close: p.close
                        };
                    }).filter(function(p) { return p.time; }).slice(-90);
                },
                getRegressionLineData() {
                    if (!this.prediction || !this.prices.length) return [];
                    var slope = this.prediction.slope;
                    var intercept = this.prediction.intercept;
                    var priceData = this.getPriceData();
                    var result = [];
                    for (var i = 0; i < priceData.length; i++) {
                        result.push({
                            time: priceData[i].time,
                            value: parseFloat((slope * i + intercept).toFixed(2))
                        });
                    }
                    for (var j = 0; j <= this.days; j++) {
                        var d = new Date();
                        d.setDate(d.getDate() + j);
                        var t = d.toISOString().substring(0, 10);
                        result.push({
                            time: t,
                            value: parseFloat((slope * (priceData.length + j) + intercept).toFixed(2))
                        });
                    }
                    return result;
                },
                getConfidenceBandData(type) {
                    if (!this.prediction) return [];
                    var priceData = this.getPriceData();
                    var result = [];
                    var se = (this.prediction.upper_bound - this.prediction.lower_bound) / (2 * 1.96);
                    for (var i = 0; i < priceData.length; i++) {
                        var val = this.prediction.intercept + this.prediction.slope * i;
                        result.push({
                            time: priceData[i].time,
                            value: type === 'upper' ? parseFloat((val + se).toFixed(2)) : parseFloat((val - se).toFixed(2))
                        });
                    }
                    for (var j = 0; j <= this.days; j++) {
                        var d = new Date();
                        d.setDate(d.getDate() + j);
                        var t = d.toISOString().substring(0, 10);
                        var forecast = this.prediction.forecast[j];
                        if (forecast) {
                            result.push({
                                time: t,
                                value: type === 'upper' ? forecast.high : forecast.low
                            });
                        }
                    }
                    return result;
                },
                getSRData() {
                    var data = { support: [], resistance: [] };
                    if (!this.prediction) return data;
                    var priceData = this.getPriceData();
                    if (priceData.length === 0) return data;
                    var support = this.prediction.support;
                    var resistance = this.prediction.resistance;
                    for (var i = 0; i < priceData.length; i++) {
                        data.support.push({ time: priceData[i].time, value: support });
                        data.resistance.push({ time: priceData[i].time, value: resistance });
                    }
                    if (this.prediction.forecast && this.prediction.forecast.length > 0) {
                        var lastDate = this.prediction.forecast[this.prediction.forecast.length - 1].date;
                        data.support.push({ time: lastDate, value: support });
                        data.resistance.push({ time: lastDate, value: resistance });
                    }
                    return data;
                },
                formatPrice(v) { if(!v) return '-'; return 'Rp '+Number(v).toLocaleString('id-ID'); },
                formatPct(v) { if(v===null||v===undefined) return '-'; return v.toFixed(2)+'%'; },
                trendIcon(t) { if(t==='up') return '&#x1F4C8;'; if(t==='down') return '&#x1F4C9;'; return '&#x27F7;'; },
                trendLabel(t) { if(t==='up') return 'UPTREND'; if(t==='down') return 'DOWNTREND'; return 'SIDEWAYS'; },
                trendClass(t) { if(t==='up') return 'badge-up'; if(t==='down') return 'badge-down'; return 'badge-sideways'; },
                confidenceColor(v) {
                    if (v >= 70) return '#34d399';
                    if (v >= 40) return '#fbbf24';
                    return '#f87171';
                },
                hasPrediction() { return this.prediction !== null; },
                hasError() { return this.error !== null; }
            }
        }
    </script>

    <aside class="sidebar fixed inset-y-0 left-0 z-50 w-60 bg-[#0b1120] border-r border-slate-800 flex flex-col" id="sidebar">
        <div class="flex items-center gap-3 px-5 h-16 border-b border-slate-800">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center font-bold text-white text-sm">I</div>
            <span class="font-bold text-lg text-white">Investo</span>
        </div>
        <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
            <a href="/dashboard" class="sidebar-link"><span class="icon">&#x1F4CA;</span> Dashboard</a>
            <a href="/saham" class="sidebar-link"><span class="icon">&#x1F4C8;</span> Saham IDX</a>
            <a href="/forex" class="sidebar-link"><span class="icon">&#x1F4B1;</span> Forex</a>
            <a href="/screener" class="sidebar-link"><span class="icon">&#x1F50D;</span> Screener</a>
            <div class="border-t border-slate-800 my-2"></div>
            <p class="px-4 text-[10px] font-semibold text-slate-600 uppercase tracking-widest mb-1">Stock [[.StockCode]]</p>
            <a :href="'/saham/'+stockCode" class="sidebar-link"><span class="icon">&#x1F4CA;</span> Overview</a>
            <a :href="'/saham/'+stockCode+'/fundamental'" class="sidebar-link"><span class="icon">&#x1F4CA;</span> Fundamental</a>
            <a :href="'/saham/'+stockCode+'/teknikal'" class="sidebar-link"><span class="icon">&#x1F4C8;</span> Teknikal</a>
            <a :href="'/saham/'+stockCode+'/ml-predict'" class="sidebar-link active"><span class="icon">&#x1F9E0;</span> ML Predict</a>
            <div class="border-t border-slate-800 my-2"></div>
            <a href="/market/heatmap" class="sidebar-link"><span class="icon">&#x1F5FA;</span> Heatmap</a>
            <a href="/market/gap-scanner" class="sidebar-link"><span class="icon">&#x26A1;</span> Gap Scanner</a>
            <a href="/market/rs-ranking" class="sidebar-link"><span class="icon">&#x1F3AF;</span> RS Ranking</a>
            <a href="/dashboard/portfolios" class="sidebar-link"><span class="icon">&#x1F4BC;</span> Portofolio</a>
            <a href="/blog" class="sidebar-link"><span class="icon">&#x1F4DD;</span> Blog</a>
        </nav>
        <div class="p-3 border-t border-slate-800">
            <a href="/pengaturan" class="sidebar-link"><span class="icon">&#x2699;</span> Pengaturan</a>
            <a href="/logout" class="sidebar-link text-danger"><span class="icon">&#x1F6AA;</span> Keluar</a>
        </div>
    </aside>

    <div class="flex-1 lg:ml-60 min-h-screen flex flex-col">
        <header class="sticky top-0 z-40 h-16 bg-[#0b1120]/90 backdrop-blur-xl border-b border-slate-800 flex items-center px-4 lg:px-8 gap-4">
            <button onclick="document.getElementById('sidebar').classList.toggle('max-md:hidden');document.getElementById('sb-overlay').classList.toggle('hidden')" class="lg:hidden p-2 text-slate-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
            <div class="flex items-center gap-3">
                <a :href="'/saham/'+stockCode" class="font-mono font-bold text-lg text-blue-400 hover:text-blue-300" x-text="stockCode"></a>
                <span class="text-sm text-slate-400">&#x2022;</span>
                <span class="text-sm text-slate-400">ML Price Prediction</span>
            </div>
            <div class="flex items-center gap-2 ml-auto">
                <div class="flex items-center gap-2.5 pl-2 border-l border-slate-700">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center text-white text-xs font-bold">[[slice .User.Name 0 1]]</div>
                    <span class="text-sm font-medium text-white hidden sm:block">[[.User.Name]]</span>
                </div>
            </div>
        </header>

        <main class="flex-1 p-4 lg:p-6 space-y-5 overflow-y-auto">
            <div class="flex items-center gap-3">
                <div class="flex-1 max-w-xs">
                    <input type="text" x-model="stockCode" placeholder="Stock code (e.g. BBCA)" @keydown.enter="predict()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm font-mono text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all uppercase">
                </div>
                <select x-model.number="days" @change="predict()" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                    <option value="3">3 days</option>
                    <option value="5">5 days</option>
                    <option value="7" selected>7 days</option>
                    <option value="14">14 days</option>
                    <option value="30">30 days</option>
                </select>
                <button @click="predict()" class="px-6 py-2.5 bg-gradient-to-r from-blue-600 to-blue-800 text-white rounded-xl text-sm font-semibold hover:from-blue-700 hover:to-blue-900 shadow-lg shadow-blue-600/20 transition-all">
                    &#x1F9E0; Predict
                </button>
            </div>

            <template x-if="error">
            <div class="bg-red-500/10 border border-red-500/30 rounded-xl p-4 text-sm text-red-400" x-text="error"></div>
            </template>

            <template x-if="loading">
            <div class="space-y-4">
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                    <template x-for="i in 4" :key="i">
                        <div class="card p-6 animate-shimmer" style="height:90px"></div>
                    </template>
                </div>
                <div class="card animate-shimmer" style="height:400px"></div>
            </div>
            </template>

            <template x-if="!loading && prediction">
            <div>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
                    <div class="prediction-card text-center">
                        <div class="text-xs text-slate-500 uppercase tracking-wider mb-1">Predicted Price</div>
                        <div class="text-3xl font-bold text-white font-mono" x-text="formatPrice(prediction.predicted_price)"></div>
                        <div class="text-xs text-slate-500 mt-1" x-text="'in '+days+' days'"></div>
                    </div>
                    <div class="prediction-card text-center">
                        <div class="text-xs text-slate-500 uppercase tracking-wider mb-1">Confidence</div>
                        <div class="flex justify-center">
                            <div class="confidence-circle" :style="'border:4px solid '+confidenceColor(prediction.confidence)+';color:'+confidenceColor(prediction.confidence)">
                                <span x-text="prediction.confidence+'%'"></span>
                            </div>
                        </div>
                    </div>
                    <div class="prediction-card text-center">
                        <div class="text-xs text-slate-500 uppercase tracking-wider mb-1">Price Range</div>
                        <div class="text-sm text-white font-mono">
                            <span class="text-green-400" x-text="formatPrice(prediction.lower_bound)"></span>
                            <span class="text-slate-500 mx-1">-</span>
                            <span class="text-red-400" x-text="formatPrice(prediction.upper_bound)"></span>
                        </div>
                    </div>
                    <div class="prediction-card text-center">
                        <div class="text-xs text-slate-500 uppercase tracking-wider mb-1">Trend</div>
                        <div class="flex items-center justify-center gap-2">
                            <span class="badge-trend" :class="trendClass(prediction.trend)">
                                <span x-html="trendIcon(prediction.trend)"></span>
                                <span x-text="trendLabel(prediction.trend)"></span>
                            </span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
                    <div class="card p-4 text-center">
                        <div class="text-sm font-mono text-blue-400 font-bold" x-text="'R2 = '+prediction.r_squared.toFixed(4)"></div>
                        <div class="text-xs text-slate-500 mt-0.5">R-squared</div>
                    </div>
                    <div class="card p-4 text-center">
                        <div class="text-sm font-mono font-bold" :class="prediction.slope >= 0 ? 'text-green-400' : 'text-red-400'" x-text="prediction.slope.toFixed(4)"></div>
                        <div class="text-xs text-slate-500 mt-0.5">Slope</div>
                    </div>
                    <div class="card p-4 text-center">
                        <div class="text-sm font-mono text-green-400 font-bold" x-text="formatPrice(prediction.support)"></div>
                        <div class="text-xs text-slate-500 mt-0.5">Support</div>
                    </div>
                    <div class="card p-4 text-center">
                        <div class="text-sm font-mono text-red-400 font-bold" x-text="formatPrice(prediction.resistance)"></div>
                        <div class="text-xs text-slate-500 mt-0.5">Resistance</div>
                    </div>
                </div>

                <div class="card p-4 mb-5">
                    <h3 class="widget-title">&#x1F4C8; Regression Chart</h3>
                    <div id="regression-chart" style="width:100%;height:400px;border-radius:8px"></div>
                    <div class="flex flex-wrap items-center gap-4 mt-3 text-xs text-slate-500">
                        <span class="flex items-center gap-1"><span class="w-3 h-0.5 bg-blue-400 inline-block"></span> Regression Line</span>
                        <span class="flex items-center gap-1"><span class="w-3 h-0.5 bg-blue-400/30 inline-block" style="border-top:1px dashed"></span> Confidence Band</span>
                        <span class="flex items-center gap-1"><span class="w-3 h-0.5 bg-green-400/50 inline-block" style="border-top:1px dashed"></span> Support</span>
                        <span class="flex items-center gap-1"><span class="w-3 h-0.5 bg-red-400/50 inline-block" style="border-top:1px dashed"></span> Resistance</span>
                    </div>
                </div>

                <div class="card overflow-hidden">
                    <div class="px-4 py-3 border-b border-slate-700">
                        <h3 class="widget-title mb-0">&#x1F4C5; <span x-text="days+'-Day Forecast'"></span></h3>
                    </div>
                    <div class="table-responsive">
                        <table class="w-full">
                            <thead>
                                <tr class="border-b border-slate-700">
                                    <th class="table-header text-left px-4 py-3">Date</th>
                                    <th class="table-header text-right px-4 py-3">Predicted Low</th>
                                    <th class="table-header text-right px-4 py-3">Predicted Mid</th>
                                    <th class="table-header text-right px-4 py-3">Predicted High</th>
                                    <th class="table-header text-center px-4 py-3">Range</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="f in prediction.forecast" :key="f.date">
                                <tr class="table-row border-b border-slate-800/50 animate-fade-slide">
                                    <td class="px-4 py-3 font-mono text-sm text-slate-300" x-text="f.date"></td>
                                    <td class="px-4 py-3 text-right font-mono text-sm text-green-400" x-text="formatPrice(f.low)"></td>
                                    <td class="px-4 py-3 text-right font-mono text-sm text-white font-bold" x-text="formatPrice(f.mid)"></td>
                                    <td class="px-4 py-3 text-right font-mono text-sm text-red-400" x-text="formatPrice(f.high)"></td>
                                    <td class="px-4 py-3 text-center">
                                        <div class="flex items-center justify-center gap-1.5">
                                            <span class="text-[10px] text-slate-500">IDR</span>
                                            <span class="font-mono text-xs text-slate-300" x-text="formatPrice(f.high - f.low)"></span>
                                        </div>
                                    </td>
                                </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 text-sm text-amber-400 flex items-start gap-3">
                    <span class="text-lg shrink-0">&#x26A0;</span>
                    <div>
                        <span class="font-semibold">Disclaimer:</span> Prediksi berbasis regresi linear sederhana, bukan jaminan. Data historis tidak menjamin performa masa depan. Gunakan sebagai referensi tambahan, bukan dasar keputusan investasi tunggal.
                    </div>
                </div>
            </div>
            </template>

            <template x-if="!loading && !prediction && !error">
