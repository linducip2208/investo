server {
    listen 80;
    server_name investo.whitelabel.co.id;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name investo.whitelabel.co.id;

    ssl_certificate /www/server/panel/ssl/investo.whitelabel.co.id.pem;
    ssl_certificate_key /www/server/panel/ssl/investo.whitelabel.co.id.key;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        alias /www/wwwroot/investo/web/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}
